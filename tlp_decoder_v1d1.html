  var TNAMES = {
    '000_00000':'MRd32','001_00000':'MRd64','010_00000':'MWr32','011_00000':'MWr64',
    '000_00001':'MRdLk32','001_00001':'MRdLk64',
    '000_00010':'IORd','010_00010':'IOWr',
    '000_00100':'CfgRd0','010_00100':'CfgWr0','000_00101':'CfgRd1','010_00101':'CfgWr1',

    '000_01010':'Cpl','010_01010':'CplD','000_01011':'CplLk','010_01011':'CplDLk',

    '010_01101':'Swap','011_01101':'Swap64',
    '010_01110':'CAS','011_01110':'CAS64',

  var FLIT_DB = {};
function flitDB(hex, name, hdr, hasData, desc, nfm) {
  var k = parseInt(hex,16);
  FLIT_DB[k] = {n:name, h:hdr, d:hasData, desc:desc, nfm:nfm};
}
// Based on PCIe Base Spec Table 2-5 Flit Mode TLP Header Type Encodings
//        hex  name              hdr data  desc                                            nfm
flitDB('00','NOP',               1, false, 'NOPз©әй—ІеЎ«е…… (1DW, жҺҘж”¶з«ҜзӣҙжҺҘдёўејғ)',             'вҖ”');
flitDB('03','MemRead32',         3, false, '32-bitеӯҳеӮЁеҷЁиҜ» (3DW, ж— ж•°жҚ®, йңҖCplD)',          'MRd32');
flitDB('04','CfgRd0',            3, false, 'й…ҚзҪ®иҜ»Type0 (3DW, ж— ж•°жҚ®, йңҖCplD)',            'CfgRd0');
flitDB('06','IORd',              3, false, 'I/OиҜ» (3DW, ж— ж•°жҚ®, йңҖCplD, е·Іеәҹејғ)',          'IORd');
flitDB('08','MRd64',             4, false, '64-bitеӯҳеӮЁеҷЁиҜ» (4DW, ж— ж•°жҚ®, йңҖCplD)',          'MRd64');
flitDB('20','MWr64',             4, true,  '64-bitеӯҳеӮЁеҷЁеҶҷ (4DW, жңүж•°жҚ®, Posted)',          'MWr64');
flitDB('22','UioMemRead',        4, false, 'UIO 64-bitеӯҳеӮЁеҷЁиҜ» (4DW, ж— ж•°жҚ®)',             'MRd64(UIO)');
flitDB('24','Cpl',               3, false, 'е®ҢжҲҗж— ж•°жҚ® (3DW, е“Қеә”IOWr/CfgWr)',             'Cpl');
flitDB('26','CplD',              3, true,  'е®ҢжҲҗеёҰж•°жҚ® (3DW, е“Қеә”MRd)',                    'CplD');
flitDB('28','CfgWr0',            3, true,  'й…ҚзҪ®еҶҷType0 (3DW, жңүж•°жҚ®, еҝ…йЎ»OHC-A3)',        'CfgWr0');
flitDB('30','MsgToRc',           3, false, 'ж¶ҲжҒҜеҲ°RC (3DW, ж— ж•°жҚ®, Posted)',               'Msg');
flitDB('40','MemWrite32',        3, true,  '32-bitеӯҳеӮЁеҷЁеҶҷ (3DW, жңүж•°жҚ®, Posted)',          'MWr32');
flitDB('42','IoWrite',           3, true,  'I/OеҶҷ (3DW, жңүж•°жҚ®, еҝ…йЎ»OHC-A2)',              'IOWr');
flitDB('44','CfgWrite0',         3, true,  'й…ҚзҪ®еҶҷType0 (3DW, жңүж•°жҚ®, еҝ…йЎ»OHC-A3)',        'CfgWr0');
flitDB('46','MsgDToRc',          3, true,  'еёҰж•°жҚ®ж¶ҲжҒҜеҲ°RC (3DW, 1DWж•°жҚ®, Posted)',         'MsgD');
flitDB('48','IOWr',              3, true,  'I/OеҶҷ (3DW, жңүж•°жҚ®, еҝ…йЎ»OHC-A2)',              'IOWr');
flitDB('4A','CplD',              3, true,  'е®ҢжҲҗеёҰж•°жҚ® (3DW, е“Қеә”MRd)',                    'CplD');
flitDB('4C','FetchAdd32',        3, true,  '32-bit FetchAdd (3DW, жңүж•°жҚ®, йңҖCplD)',        'FetchAdd');
flitDB('4E','CompareSwap32',     3, true,  '32-bit CAS (3DW, 2DWж•°жҚ®, йңҖCplD)',            'CAS');
flitDB('58','Cpl',               3, false, 'е®ҢжҲҗж— ж•°жҚ® (3DW)',                             'Cpl');
flitDB('5A','CplD (alt)',        3, true,  'е®ҢжҲҗеёҰж•°жҚ®еӨҮйҖү (3DW)',                         'CplD');
flitDB('5B','DMWr32',            3, true,  'Deferrable MWr (3DW, жңүж•°жҚ®)',                 'DMWr32');
flitDB('61','UioMemWrite',       4, true,  'UIO 64-bitеӯҳеӮЁеҷЁеҶҷ (4DW, жңүж•°жҚ®)',              'MWr64(UIO)');
flitDB('70','MsgDToRc (alt)',    3, true,  'еёҰж•°жҚ®ж¶ҲжҒҜеҲ°RCеӨҮйҖү (3DW, Posted)',              'MsgD');
flitDB('80','Swap32',            3, true,  '32-bit SwapеҺҹеӯҗж“ҚдҪң (3DW, жңүж•°жҚ®, йңҖCplD)',     'Swap');
flitDB('82','CAS32',             3, true,  '32-bit CASеҺҹеӯҗж“ҚдҪң (3DW, 2DWж•°жҚ®, йңҖCplD)',     'CAS');
flitDB('8D','LocalTLPPrefix',    1, false, 'жң¬ең°TLPеүҚзјҖ (1DW, й“ҫи·Ҝжң¬ең°)',                  'TLP Prefix');
flitDB('A0','MRdLk32',           3, false, '32-bitй”Ғе®ҡиҜ» (3DW, е·Іеәҹејғ)',                   'MRdLk32');
flitDB('C0','MRdLk64',           4, false, '64-bitй”Ғе®ҡиҜ» (4DW, е·Іеәҹејғ)',                   'MRdLk64');
flitDB('E0','FetchAdd64',        4, true,  '64-bit FetchAdd (4DW, жңүж•°жҚ®)',                'FetchAdd64');
flitDB('E2','Swap64',            4, true,  '64-bit Swap (4DW, жңүж•°жҚ®)',                    'Swap64');
flitDB('E4','CAS64',             4, true,  '64-bit CAS (4DW, 2DWж•°жҚ®)',                    'CAS64');

// ====== Universal Flit Type Resolver ======
function resolveFlitType(type8) {
  if(FLIT_DB[type8]) return FLIT_DB[type8];
  var hex = ('00'+type8.toString(16).toUpperCase()).slice(-2);
  var baseType = type8 & 0x1F;
  var mod = (type8 >> 5) & 0x7;
  var hdr = 3, hasData = false, name = 'Flit_0x'+hex, nfm = 'вҖ”';
  
  // Infer from bit[4:0] = NFM Type pattern
  var typeMap = {0:'Memory',1:'MRdLk',2:'I/O',4:'Cfg0',5:'Cfg1',0xA:'Cpl',0xB:'CplLk',
                 0xC:'FetchAdd',0xD:'Swap',0xE:'CAS',0xF:'DMWr'};
  
  if(baseType >= 0x10) {
    name = (mod&1?'MsgD':'Msg')+'_0x'+hex;
    hasData = !!(mod&1);
  } else {
    var base = typeMap[baseType] || 'T'+baseType.toString(16);
    var is64 = !!(mod&1);
    var hasDat = !!(mod&2);
    hdr = is64 ? 4 : 3;
    hasData = hasDat;
    if(type8===0x00||type8===0x8D) hdr=1;
    name = base + (is64?'64':'') + (hasDat?'_W':'');
    if(baseType===0) name = (!hasDat&&!is64)?'MRd32':(hasDat&&!is64)?'MWr32':(!hasDat&&is64)?'MRd64':'MWr64';
    else if(baseType===2) name = hasDat?'IOWr':'IORd';
    else if(baseType===4||baseType===5) {var t=baseType===4?'0':'1';name=hasDat?'CfgWr'+t:'CfgRd'+t;}
    else if(baseType===0xA) name = hasDat?'CplD':'Cpl';
  }
  return {n:name, h:hdr, d:hasData, desc:'Flit 0x'+hex+' (жҺЁж–ӯ: bits[4:0]='+baseType.toString(16)+')', nfm:nfm};
}var EXAMPLES = [
    '4A000001 02003000 00000001 80000000',
    '00000001 02003000 80000000',
    '0A000001 02003000 00000001',
    '4A000001 02003000 00000001 80000000 12345678 DEADBEEF'
  ];
  
  var FLIT_EXAMPLES = [
    '04000001 02003000 80000000',
    '20000004 02003000 00000001 80000000',
    '44000001 02003000 01000000',
    '01000004 02003000 80000000',
    '06000001 02003000 01000000'
  ];
  
  // ====== History ======
  function getHist() {
    try { return JSON.parse(localStorage.getItem('tlp_hist') || '[]'); } catch(e) { return []; }
  }
  
  function addHist(s) {
    try {
      var h = getHist();
      var c = s.trim().replace(/\s+/g,' ');
      var i = h.findIndex(function(x){return x.h === c;});
      if(i>=0) h.splice(i,1);
      h.unshift({h:c, t:new Date().toLocaleString()});
      if(h.length>20) h.length=20;
      localStorage.setItem('tlp_hist', JSON.stringify(h));
      updHistUI();
    } catch(e) {}
  }
  
  function clearHist() {
    if(!confirm('жё…з©әжүҖжңүеҺҶеҸІи®°еҪ•пјҹ')) return;
    try { localStorage.removeItem('tlp_hist'); } catch(e) {}
    updHistUI();
    histDD.classList.remove('show');
  }
  
  function updHistUI() {
    var h = getHist();
    histCnt.textContent = h.length;
  }
  
  function renderHist() {
    var h = getHist();
    histDD.innerHTML = '';
    if(h.length===0) {
      histDD.innerHTML = '<div class="em">жҡӮж— еҺҶеҸІи®°еҪ•</div>';
      return;
    }
    h.forEach(function(item) {
      var d = document.createElement('div');
      d.className = 'hi';
      d.innerHTML = '<span>'+item.h+'</span><span class="t">'+item.t+'</span>';
      (function(val) {
        d.onclick = function() {
          inp.value = val;
          histDD.classList.remove('show');
          doDecode(false);
        };
      })(item.h);
      histDD.appendChild(d);
    });
  }
  
  histBtn.onclick = function(e) {
    e.stopPropagation();
    histDD.classList.toggle('show');
    if(histDD.classList.contains('show')) renderHist();
  };
  document.addEventListener('click', function() { histDD.classList.remove('show'); });
  document.getElementById('clearHistBtn').onclick = clearHist;
  
  // ====== Helper ======
  function hex2bytes(s) {
    s = s.replace(/\s+/g,'');
    if(!/^[0-9a-fA-F]+$/.test(s)) throw new Error('еҗ«жңүйқһеҚҒе…ӯиҝӣеҲ¶еӯ—з¬Ұ');
    if(s.length%2!==0) throw new Error('й•ҝеәҰеҝ…йЎ»дёәеҒ¶ж•°');
    var b = [];
    for(var i=0;i<s.length;i+=2) b.push(parseInt(s.substr(i,2),16));
    return b;
  }
  
  function dwVal(bytes, off) {
    if(off+4>bytes.length) return null;
    return ((bytes[off]<<24)|(bytes[off+1]<<16)|(bytes[off+2]<<8)|bytes[off+3])>>>0;
  }
  
  function bits(val, hi, lo) { return (val>>>lo) & ((1<<(hi-lo+1))-1); }
  
  function dwStr(v) { return ('00000000'+(v>>>0).toString(16).toUpperCase()).slice(-8); }
  
  function tlpName(fmt, type) {
    return TNAMES[fmt+'_'+type] || ('Fmt='+fmt+' Type='+type);
  }
  
  // ====== Main Decode ======
  function doDecode(auto) {
    var input = inp.value.trim();
    err.style.display = 'none';
    var flit = isFlitMode();
    
    if(!input) {
      err.textContent = 'вқҢ иҜ·иҫ“е…Ҙ TLP еҚҒе…ӯиҝӣеҲ¶ж•°жҚ®';
      err.style.display = 'block';
      res.classList.remove('on');
      return;
    }
    
    try {
      var bytes = hex2bytes(input);
      if(bytes.length<4) throw new Error('иҮіе°‘йңҖиҰҒ4еӯ—иҠӮ(1DW)пјҢеҪ“еүҚд»…'+bytes.length+'еӯ—иҠӮ');
      
      addHist(input);
      
      var dw = [];
      for(var i=0;i<bytes.length;i+=4) {
        var v = dwVal(bytes,i);
        if(v!==null) dw.push(v);
      }
      
      if(flit) {
        doDecodeFlit(dw, bytes, auto);
      } else {
        doDecodeNonFlit(dw, bytes, auto);
      }
      
    } catch(e) {
      err.textContent = 'вқҢ '+e.message;
      err.style.display = 'block';
      res.classList.remove('on');
    }
  }
  
  // ====== Non-Flit Mode Decode ======
  function doDecodeNonFlit(dw, bytes, auto) {
    var dw0=dw[0], dw1=dw[1], dw2=dw[2], dw3=dw.length>3?dw[3]:0;
    
    var fmt = bits(dw0,31,29);
    var type = bits(dw0,28,24);
    var t9 = bits(dw0,23,23);
    var tc = bits(dw0,22,20);
    var t8 = bits(dw0,19,19);
    var a2 = bits(dw0,18,18);
    var r17 = bits(dw0,17,17);
    var th = bits(dw0,16,16);
    var td = bits(dw0,15,15);
    var ep = bits(dw0,14,14);
    var a1 = bits(dw0,13,13);
    var a0 = bits(dw0,12,12);
    var at = bits(dw0,11,10);
    var lenH = bits(dw0,9,8);
    var lenL = bits(dw0,7,0);
    var len = (lenH<<8)|lenL;
    var lenDW = len===0?1024:len;
    
    var fStr = ('000'+fmt.toString(2)).slice(-3);
    var tStr = ('00000'+type.toString(2)).slice(-5);
    var name = tlpName(fStr,tStr);
    var fDesc = FMT[fStr]||'дҝқз•ҷ';
    
    var is4DW = (fmt===1||fmt===3);
    var hasData = (fmt===2||fmt===3);
    var hdrDW = is4DW?4:3;
    
    var rows = [];
    var fields = [];
    var idx = 0;
    
    var dw0f = [
      {n:'Fmt',b:3,v:fStr,hi:31,lo:29,c:C.fmt,d:'TLPж јејҸ: '+fDesc},
      {n:'Type',b:5,v:'0x'+type.toString(16).toUpperCase(),hi:28,lo:24,c:C.type,d:'TLPзұ»еһӢзј–з Ғ: '+tStr},
      {n:'T9',b:1,v:t9.toString(),hi:23,lo:23,c:C.tag,d:'Extended Tag bit 9'},
      {n:'TC',b:3,v:tc.toString(),hi:22,lo:20,c:C.tc,d:'Traffic Class: TC'+tc},
      {n:'T8',b:1,v:t8.toString(),hi:19,lo:19,c:C.tag,d:'Extended Tag bit 8'},
      {n:'Attr',b:1,v:a2.toString(),hi:18,lo:18,c:C.attr,d:'Attr[2] IDO'},
      {n:'R',b:1,v:r17.toString(),hi:17,lo:17,c:C.r,d:'Reserved'},
      {n:'TH',b:1,v:th.toString(),hi:16,lo:16,c:C.th,d:'TPH: '+(th?'жңү':'ж— ')},
      {n:'TD',b:1,v:td.toString(),hi:15,lo:15,c:C.td,d:'ECRC: '+(td?'еӯҳеңЁ':'ж— ')},
      {n:'EP',b:1,v:ep.toString(),hi:14,lo:14,c:C.ep,d:'Poisoned: '+(ep?'жҳҜ':'еҗҰ')},
      {n:'Attr',b:2,v:''+a1+a0,hi:13,lo:12,c:C.attr,d:'RO='+a1+' NS='+a0},
      {n:'AT',b:2,v:['00','01','10','11'][at],hi:11,lo:10,c:C.at,d:['Untranslated','Translation Req','Translated','Reserved'][at]},
      {n:'Length',b:10,v:lenDW+'DW',hi:9,lo:0,c:C.len,d:'ж•°жҚ®: '+lenDW+'DW ('+(lenDW*4)+'B)'+(len===0?' (0=1024DW)':'')}
    ];
    dw0f.forEach(function(f){fields.push({idx:idx++,dw:0,n:f.n,b:f.b,v:f.v,raw:bits(dw0,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
    rows.push({l:'DW0 [31:0]',f:dw0f});
    
    parseRemainingDW(name, tStr, dw, dw0, dw1, dw2, dw3, fields, rows, idx, t9, t8);
    renderAll(name, fDesc, hasData, lenDW, hdrDW, dw, rows, fields, bytes, false, auto);
  }
  
  // ====== Flit Mode Decode ======
  function doDecodeFlit(dw, bytes, auto) {
    var dw0 = dw[0];
    
    // Flit Mode DW0: Byte0=Type[7:0], Byte1=TC[2:0](7:5)+OHC[4:0](4:0),
    // Byte2=TS[2:0](7:5)+Attr[2:0](4:2)+Length[9:8](1:0), Byte3=Length[7:0]
    var type8 = bits(dw0,31,24);
    var tc = bits(dw0,23,21);
    var ohc = bits(dw0,20,16);
    var ts = bits(dw0,15,13);
    var attr = bits(dw0,12,10);
    var lenH = bits(dw0,9,8);
    var lenL = bits(dw0,7,0);
    var len = (lenH<<8)|lenL;
    var lenDW = len===0?1024:len;
    
    var typeHex = ('00'+type8.toString(16).toUpperCase()).slice(-2);
    var p = resolveFlitType(type8);
    var hdrDW = p.h;
    var hasData = p.d;
    var nameStr = p.n;
    var nfmEquiv = p.nfm;
    var suggestNFM = nfmEquiv !== 'вҖ”' ? ' (еҜ№еә”Non-Flit: '+nfmEquiv+')' : '';
    
    // ====== Build DW0 fields ======
    var rows = [], fields = [];
    var idx = 0;
    
    var tsDesc = ['ж— Trailer','1DW ECRC','1DW Reserved','2DW Reserved','2DW Reserved','3DW IDE MAC','4DW IDE+PCRC','5DW Reserved'];
    var ohcParts = [];
    if(ohc&1) ohcParts.push('OHC-A');
    if(ohc&2) ohcParts.push('OHC-B');
    if(ohc&4) ohcParts.push('OHC-C');
    if(ohc&8) ohcParts.push('OHC-E1');
    if(ohc&16) ohcParts.push('OHC-E2/E4');
    
    // Generate binary representation of DW0 bytes
    var b0 = ('00000000'+type8.toString(2)).slice(-8);
    var b1 = ('00000000'+bits(dw0,23,16).toString(2)).slice(-8);
    var b2 = ('00000000'+bits(dw0,15,8).toString(2)).slice(-8);
    var b3 = ('00000000'+bits(dw0,7,0).toString(2)).slice(-8);
    
    var dw0f = [
      {n:'Type',b:8,v:'0x'+typeHex+' вҶ’ '+nameStr,hi:31,lo:24,c:C.type,d:'FlitжүҒе№і8-bitзұ»еһӢзј–з Ғ'+suggestNFM+'гҖӮ'+p.desc},
      {n:'TC',b:3,v:'TC'+tc,hi:23,lo:21,c:C.tc,d:'Traffic Class '+tc+' (3-bit, дёҺNon-Flitеҗ«д№үзӣёеҗҢ)'},
      {n:'OHC',b:5,v:('00000'+ohc.toString(2)).slice(-5),hi:20,lo:16,c:C.ohc,d:'OHCеӯҳеңЁдҪҚеӣҫ [4:0]гҖӮ'+(ohcParts.length?ohcParts.join(' | '):'ж— OHC')},
      {n:'TS',b:3,v:ts.toString(),hi:15,lo:13,c:C.td,d:'Trailer Size: '+tsDesc[ts]+' (жӣҝд»ЈNon-Flitзҡ„TDдҪҚ)'},
      {n:'Attr',b:3,v:('000'+attr.toString(2)).slice(-3),hi:12,lo:10,c:C.attr,d:'еұһжҖ§ (дёҺNon-Flitеҗ«д№үзӣёеҗҢ)гҖӮRO='+(attr>>1&1)+' NS='+(attr&1)},
      {n:'Length',b:10,v:lenDW+'DW',hi:9,lo:0,c:C.len,d:'ж•°жҚ®иҙҹиҪҪй•ҝеәҰ: '+lenDW+'DW ('+(lenDW*4)+' Bytes)'+(len===0?' (зј–з Ғ0=1024DW)':'')}
    ];
    dw0f.forEach(function(f){fields.push({idx:idx++,dw:0,n:f.n,b:f.b,v:f.v,raw:bits(dw0,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
    rows.push({l:'DW0 [31:0] Flit',f:dw0f});
    
    // ====== Parse remaining DWs ======
    // Flit DW1 typically: Requester ID[31:16] + Tag/Control[15:0]
    if(dw.length>=2) {
      var dw1 = dw[1];
      var reqId = bits(dw1,31,16);
      var tagCtrl = bits(dw1,15,0);
      
      var d1f = [
        {n:'Requester ID',b:16,v:('0000'+reqId.toString(16)).toUpperCase().slice(-4),hi:31,lo:16,c:C.reqid,d:'иҜ·жұӮиҖ…BDF (Bus:Device:Function)'}
      ];
      
      // Check if this is a 3DW or 4DW header type
      if(hdrDW>=3) {
        // For memory-like Flit TLPs, DW1 lower 16 bits contain Tag+control
        // Flit Tag is 14-bit (vs NFM 8-bit), located in DW1 or OHC
        var tagVal = bits(dw1,13,0);
        d1f.push({n:'Tag/Control',b:16,v:'0x'+('0000'+tagCtrl.toString(16).toUpperCase()).slice(-4),hi:15,lo:0,c:C.tag,
          d:'Flit Tag(14-bit) + жҺ§еҲ¶дҪҚгҖӮTagеҖј: 0x'+('0000'+tagVal.toString(16).toUpperCase()).slice(-4)+' (жү©еұ•иҮі14-bit)'});
      } else {
        // 1DW types (NOP, LocalTLPPrefix) - no more fields
      }
      
      d1f.forEach(function(f){fields.push({idx:idx++,dw:1,n:f.n,b:f.b,v:f.v,raw:bits(dw1,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
      rows.push({l:'DW1 [31:0]',f:d1f});
    }
    
    // DW2/DW3: Address or routing fields
    if(dw.length>=3) {
      var dw2 = dw[2];
      if(hdrDW===4 && dw.length>=4) {
        // 4DW header (UIO types): DW2=Address[63:32], DW3=Address[31:2]
        var d2f = [{n:'Address[63:32]',b:32,v:'0x'+dwStr(dw2),hi:31,lo:0,c:C.addr,d:'UIO 64-bitең°еқҖй«ҳ32дҪҚ'}];
        d2f.forEach(function(f){fields.push({idx:idx++,dw:2,n:f.n,b:f.b,v:f.v,raw:dw2,c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
        rows.push({l:'DW2 [31:0]',f:d2f});
        
        var dw3 = dw[3];
        var aLo = bits(dw3,31,2);
        var d3f = [
          {n:'Address[31:2]',b:30,v:'0x'+('00000000'+((aLo<<2)>>>0).toString(16).toUpperCase()).slice(-8),hi:31,lo:2,c:C.addr2,d:'UIO 64-bitең°еқҖдҪҺ30дҪҚ (е®Ңж•ҙ: '+
            '0x'+('00000000'+((aLo<<2)>>>0).toString(16).toUpperCase()).slice(-8)+')'},
          {n:'R',b:2,v:bits(dw3,1,0).toString(2).padStart(2,'0'),hi:1,lo:0,c:C.r,d:'Reserved'}
        ];
        d3f.forEach(function(f){fields.push({idx:idx++,dw:3,n:f.n,b:f.b,v:f.v,raw:bits(dw3,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
        rows.push({l:'DW3 [31:0]',f:d3f});
        
      } else if(hdrDW===3) {
        // 3DW header: DW2=Address[31:2] (most types)
        var a = bits(dw2,31,2);
        if(type8===0x03||type8===0x0B) {
          // Message types - DW2 is routing/data
          var d2f = [{n:'Msg Routing/Data',b:32,v:'0x'+dwStr(dw2),hi:31,lo:0,c:C.msg,d:'ж¶ҲжҒҜи·Ҝз”ұдҝЎжҒҜжҲ–ж•°жҚ® (MsgToRc/MsgDToRc)'}];
          d2f.forEach(function(f){fields.push({idx:idx++,dw:2,n:f.n,b:f.b,v:f.v,raw:dw2,c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
          rows.push({l:'DW2 [31:0]',f:d2f});
        } else if(type8===0x06) {
          // Config type - DW2 contains Bus/Device/Function + Reg
          var bus = bits(dw2,31,24);
          var dev = bits(dw2,23,19);
          var fnc = bits(dw2,18,16);
          var er = bits(dw2,11,8);
          var rg = bits(dw2,7,2);
          var d2f = [
            {n:'Bus',b:8,v:'0x'+bus.toString(16).toUpperCase(),hi:31,lo:24,c:C.reqid,d:'жҖ»зәҝ: '+bus},
            {n:'Device',b:5,v:dev.toString(),hi:23,lo:19,c:C.reqid,d:'и®ҫеӨҮ: '+dev},
            {n:'Function',b:3,v:fnc.toString(),hi:18,lo:16,c:C.reqid,d:'еҠҹиғҪ: '+fnc},
            {n:'R',b:4,v:'0',hi:15,lo:12,c:C.r,d:'Reserved'},
            {n:'ExtRegNo',b:4,v:'0x'+er.toString(16).toUpperCase(),hi:11,lo:8,c:C.tc,d:'жү©еұ•еҜ„еӯҳеҷЁеҸ·'},
            {n:'RegNo',b:6,v:'0x'+rg.toString(16).toUpperCase(),hi:7,lo:2,c:C.tag,d:'еҜ„еӯҳеҷЁеҸ·'},
            {n:'R',b:2,v:'00',hi:1,lo:0,c:C.r,d:'Reserved'}
          ];
          d2f.forEach(function(f){fields.push({idx:idx++,dw:2,n:f.n,b:f.b,v:f.v,raw:bits(dw2,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
          rows.push({l:'DW2 [31:0]',f:d2f});
        } else {
          // Memory / I/O / Atomic - Address
          var d2f = [
            {n:'Address[31:2]',b:30,v:'0x'+('00000000'+(a<<2).toString(16).toUpperCase()).slice(-8),hi:31,lo:2,c:C.addr,d:'32-bitең°еқҖ (4BеҜ№йҪҗ)'},
            {n:'R',b:2,v:bits(dw2,1,0).toString(2).padStart(2,'0'),hi:1,lo:0,c:C.r,d:'Reserved'}
          ];
          d2f.forEach(function(f){fields.push({idx:idx++,dw:2,n:f.n,b:f.b,v:f.v,raw:bits(dw2,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
          rows.push({l:'DW2 [31:0]',f:d2f});
        }
      }
      // hdrDW===1: NOP/LocalTLPPrefix - no more DWs
    }
    
    // ====== OHC Info ======
    if(ohc>0) {
      var ohcRows = [];
      if(ohc&1) {
        ohcRows.push({n:'OHC-A',b:1,v:'еӯҳеңЁ',hi:0,lo:0,c:C.ohc,d:'OHC-A: еҗ«FBE/LBE/PASIDзӯүгҖӮI/OиҜ·жұӮеҝ…йҖүA2, й…ҚзҪ®иҜ·жұӮеҝ…йҖүA3'});
      }
      if(ohc&2) {
        ohcRows.push({n:'OHC-B',b:1,v:'еӯҳеңЁ',hi:0,lo:0,c:C.ohc,d:'OHC-B: TPHжү©еұ• (HV+PH+ST+AMA)'});
      }
      if(ohc&4) {
        ohcRows.push({n:'OHC-C',b:1,v:'еӯҳеңЁ',hi:0,lo:0,c:C.ohc,d:'OHC-C: IDEе®үе…Ёжү©еұ• (Stream_ID/PCRC/MACзӯү)'});
      }
      if(ohc&0x18) {
        ohcRows.push({n:'OHC-E',b:1,v:'еӯҳеңЁ',hi:0,lo:0,c:C.ohc,d:'OHC-E: йҷ„еҠ жү©еұ•'});
      }
      if(ohcRows.length) {
        rows.push({l:'OHC (OHC[4:0]='+('00000'+ohc.toString(2)).slice(-5)+')',f:ohcRows});
      }
    }
    
    renderAll(nameStr, 'Flit Mode Type=0x'+typeHex, hasData, lenDW, hdrDW, dw, rows, fields, bytes, true, auto);
  }
  
  // ====== Parse remaining DWs (Non-Flit) ======
  function parseRemainingDW(name, tStr, dw, dw0, dw1, dw2, dw3, fields, rows, idx, t9, t8) {
    var isCpl = name.indexOf('Cpl')===0;
    
    if(isCpl) {
      var cplId = bits(dw1,31,16);
      var st = bits(dw1,15,13);
      var bcm = bits(dw1,12,12);
      var bcH = bits(dw1,11,8);
      var bcL = bits(dw1,7,0);
      var bc = (bcH<<8)|bcL;
      var rId2 = bits(dw2,31,16);
      var tg2 = bits(dw2,15,8);
      var la = bits(dw2,7,1);
      var sn = ['SC(жҲҗеҠҹ)','UR(дёҚж”ҜжҢҒ)','CRS(йҮҚиҜ•)','дҝқз•ҷ','CA(дёӯжӯў)'];
      
      var d1f = [
        {n:'Completer ID',b:16,v:('0000'+cplId.toString(16)).toUpperCase().slice(-4),hi:31,lo:16,c:C.reqid,d:'е®ҢжҲҗиҖ…BDF'},
        {n:'Status',b:3,v:st+' ('+(sn[st]||'дҝқз•ҷ')+')',hi:15,lo:13,c:C.status,d:'е®ҢжҲҗзҠ¶жҖҒ'},
        {n:'BCM',b:1,v:bcm.toString(),hi:12,lo:12,c:C.td,d:'Byte Count Modified'},
        {n:'Byte Count',b:12,v:bc.toString(),hi:11,lo:0,c:C.len,d:'еү©дҪҷ: '+bc+'B'}
      ];
      var d2f = [
        {n:'Requester ID',b:16,v:('0000'+rId2.toString(16)).toUpperCase().slice(-4),hi:31,lo:16,c:C.reqid,d:'иҜ·жұӮиҖ…BDF(еӣһжҳҫ)'},
        {n:'Tag',b:8,v:'0x'+('00'+tg2.toString(16)).toUpperCase().slice(-2),hi:15,lo:8,c:C.tag,d:'ж Үзӯҫ(еӣһжҳҫ)'},
        {n:'Lower Address',b:7,v:'0x'+('0'+la.toString(16)).toUpperCase().slice(-2),hi:7,lo:1,c:C.addr2,d:'дҪҺең°еқҖ'},
        {n:'Reserved',b:1,v:'0',hi:0,lo:0,c:C.r,d:'дҝқз•ҷ'}
      ];
      d1f.forEach(function(f){fields.push({idx:idx++,dw:1,n:f.n,b:f.b,v:f.v,raw:bits(dw1,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
      d2f.forEach(function(f){fields.push({idx:idx++,dw:2,n:f.n,b:f.b,v:f.v,raw:bits(dw2,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
      rows.push({l:'DW1 [31:0]',f:d1f});
      rows.push({l:'DW2 [31:0]',f:d2f});
      
    } else if(tStr==='00100'||tStr==='00101') {
      var rId = bits(dw1,31,16);
      var tg = bits(dw1,15,8);
      var lbe = bits(dw1,7,4);
      var fbe = bits(dw1,3,0);
      var bus = bits(dw2,31,24);
      var dev = bits(dw2,23,19);
      var fnc = bits(dw2,18,16);
      var er = bits(dw2,11,8);
      var rg = bits(dw2,7,2);
      
      var d1f = [
        {n:'Requester ID',b:16,v:('0000'+rId.toString(16)).toUpperCase().slice(-4),hi:31,lo:16,c:C.reqid,d:'иҜ·жұӮиҖ…BDF'},
        {n:'Tag',b:8,v:'0x'+('00'+tg.toString(16)).toUpperCase().slice(-2),hi:15,lo:8,c:C.tag,d:'ж Үзӯҫ'},
        {n:'Last DW BE',b:4,v:lbe.toString(2).padStart(4,'0'),hi:7,lo:4,c:C.be,d:'жң«DWеӯ—иҠӮдҪҝиғҪ'},
        {n:'First DW BE',b:4,v:fbe.toString(2).padStart(4,'0'),hi:3,lo:0,c:C.ep,d:'йҰ–DWеӯ—иҠӮдҪҝиғҪ'}
      ];
      var d2f = [
        {n:'Bus',b:8,v:'0x'+bus.toString(16).toUpperCase(),hi:31,lo:24,c:C.reqid,d:'жҖ»зәҝ: '+bus},
        {n:'Device',b:5,v:dev.toString(),hi:23,lo:19,c:C.reqid,d:'и®ҫеӨҮ: '+dev},
        {n:'Function',b:3,v:fnc.toString(),hi:18,lo:16,c:C.reqid,d:'еҠҹиғҪ: '+fnc},
        {n:'Reserved',b:4,v:'0',hi:15,lo:12,c:C.r,d:'дҝқз•ҷ'},
        {n:'Ext Reg No',b:4,v:'0x'+er.toString(16).toUpperCase(),hi:11,lo:8,c:C.tc,d:'жү©еұ•еҜ„еӯҳеҷЁеҸ·'},
        {n:'Register No',b:6,v:'0x'+rg.toString(16).toUpperCase(),hi:7,lo:2,c:C.tag,d:'DWең°еқҖ: 0x'+((er<<6)|rg).toString(16).toUpperCase()},
        {n:'Reserved',b:2,v:'00',hi:1,lo:0,c:C.r,d:'дҝқз•ҷ'}
      ];
      d1f.forEach(function(f){fields.push({idx:idx++,dw:1,n:f.n,b:f.b,v:f.v,raw:bits(dw1,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
      d2f.forEach(function(f){fields.push({idx:idx++,dw:2,n:f.n,b:f.b,v:f.v,raw:bits(dw2,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
      rows.push({l:'DW1 [31:0]',f:d1f});
      rows.push({l:'DW2 [31:0]',f:d2f});
      
    } else if(tStr==='10000'||tStr==='10010'||((parseInt(tStr,2)&0x18)===0x10)) {
      var rId = bits(dw1,31,16);
      var tg = bits(dw1,15,8);
      var mc = bits(dw1,7,0);
      var d1f = [
        {n:'Requester ID',b:16,v:('0000'+rId.toString(16)).toUpperCase().slice(-4),hi:31,lo:16,c:C.reqid,d:'иҜ·жұӮиҖ…BDF'},
        {n:'Tag',b:8,v:'0x'+('00'+tg.toString(16)).toUpperCase().slice(-2),hi:15,lo:8,c:C.tag,d:'ж Үзӯҫ'},
        {n:'Message Code',b:8,v:'0x'+('00'+mc.toString(16)).toUpperCase().slice(-2),hi:7,lo:0,c:C.msg,d:'ж¶ҲжҒҜзј–з Ғ'}
      ];
      d1f.forEach(function(f){fields.push({idx:idx++,dw:1,n:f.n,b:f.b,v:f.v,raw:bits(dw1,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
      rows.push({l:'DW1 [31:0]',f:d1f});
      rows.push({l:'DW2 [31:0]',f:[{n:'Msg Data',b:32,v:dwStr(dw[2]||0),hi:31,lo:0,c:C.addr,d:'ж¶ҲжҒҜж•°жҚ®/и·Ҝз”ұ'}]});
      
    } else {
      var rId = bits(dw1,31,16);
      var tg = bits(dw1,15,8);
      var lbe = bits(dw1,7,4);
      var fbe = bits(dw1,3,0);
      var d1f = [
        {n:'Requester ID',b:16,v:('0000'+rId.toString(16)).toUpperCase().slice(-4),hi:31,lo:16,c:C.reqid,d:'BDF: '+('0000'+rId.toString(16)).toUpperCase().slice(-4)},
        {n:'Tag',b:8,v:'0x'+('00'+tg.toString(16)).toUpperCase().slice(-2),hi:15,lo:8,c:C.tag,d:'ж Үзӯҫ (T9='+t9+' T8='+t8+')'},
        {n:'Last DW BE',b:4,v:lbe.toString(2).padStart(4,'0'),hi:7,lo:4,c:C.be,d:'жң«DWеӯ—иҠӮдҪҝиғҪ'},
        {n:'First DW BE',b:4,v:fbe.toString(2).padStart(4,'0'),hi:3,lo:0,c:C.ep,d:'йҰ–DWеӯ—иҠӮдҪҝиғҪ'}
      ];
      d1f.forEach(function(f){fields.push({idx:idx++,dw:1,n:f.n,b:f.b,v:f.v,raw:bits(dw1,f.hi,f.lo),c:f.c,d:f.d,hi:f.hi,lo:f.lo});});
      rows.push({l:'DW1 [31:0]',f:d1f});
      
      var is4DW = (bits(dw0,31,29)===1||bits(dw0,31,29)===3);
      if(is4DW && dw.length>=4) {
        var aH = dw[2]>>>0;
        var aL = bits(dw[3],31,2);
        rows.push({l:'DW2 [31:0]',f:[{n:'Address[63:32]',b:32,v:'0x'+dwStr(aH),hi:31,lo:0,c:C.addr,d:'й«ҳ32дҪҚ'}]});
        rows.push({l:'DW3 [31:0]',f:[
          {n:'Address[31:2]',b:30,v:'0x'+('00000000'+((aL<<2)>>>0).toString(16).toUpperCase()).slice(-8),hi:31,lo:2,c:C.addr2,d:'е®Ңж•ҙ64-bitең°еқҖ (дҪҺ30дҪҚ)'},
          {n:'PH',b:2,v:bits(dw[3],1,0).toString(2).padStart(2,'0'),hi:1,lo:0,c:C.ph,d:'Proc Hints'}
        ]});
      } else {
        var a = bits(dw2,31,2);
        rows.push({l:'DW2 [31:0]',f:[
          {n:'Address[31:2]',b:30,v:'0x'+('00000000'+(a<<2).toString(16).toUpperCase()).slice(-8),hi:31,lo:2,c:C.addr,d:'32-bitең°еқҖ'},
          {n:'PH',b:2,v:bits(dw2,1,0).toString(2).padStart(2,'0'),hi:1,lo:0,c:C.ph,d:'Proc Hints'}
        ]});
      }
    }
  }
  
  // ====== PCIe Config Register Names (first 64 registers = 256B) ======
  var REG_NAMES = {
    0x00:'Vendor ID',0x02:'Device ID',0x04:'Command',0x06:'Status',
    0x08:'Revision ID',0x09:'Class Code',0x0C:'Cache Line Size',0x0D:'Latency Timer',
    0x0E:'Header Type',0x0F:'BIST',0x10:'BAR0',0x14:'BAR1',
    0x18:'BAR2',0x1C:'BAR3',0x20:'BAR4',0x24:'BAR5',
    0x28:'CardBus CIS Pointer',0x2C:'Subsystem Vendor ID',0x2E:'Subsystem ID',
    0x30:'Expansion ROM Base',0x34:'Capabilities Pointer',0x38:'Reserved',
    0x3C:'Interrupt Line',0x3D:'Interrupt Pin',0x3E:'Min_Gnt',0x3F:'Max_Lat',
    0x40:'Bridge Control (Bridge)',0x42:'Bridge Status (Bridge)'
  };
  function getConfigRegName(regNum) {
    if(regNum < 0) return '';
    var offset = regNum * 4;
    if(offset > 0xFF) return '';
    // Check DW-aligned register names
    for(var key in REG_NAMES) {
      if(parseInt(key) === regNum) return REG_NAMES[key];
    }
    return '';
  }

  // ====== Render ======
  function renderAll(name, fDesc, hasData, lenDW, hdrDW, dw, rows, fields, bytes, flit, auto) {
    res.classList.add('on');
    
    // ====== Summary Card ======
    var payloadB = hasData && bytes.length>hdrDW*4 ? bytes.length-hdrDW*4 : 0;
    var rawHex = dw.map(dwStr).join(' ');
    var sumEl = document.getElementById('summaryBox');
    sumEl.className = 'summary on';
    
    var keyFields = {};
    fields.forEach(function(f){ keyFields[f.n] = f; });
    
    var addrStr = '';
    if(keyFields['Address[63:32]']) {
      addrStr = keyFields['Address[63:32]'].v + ' ' + (keyFields['Address[31:2]'] ? keyFields['Address[31:2]'].v : '');
    } else if(keyFields['Address[31:2]']) {
      addrStr = keyFields['Address[31:2]'].v;
    } else if(keyFields['Lower Address']) {
      addrStr = keyFields['Lower Address'].v;
    }
    
    var reqStr = keyFields['Requester ID'] ? keyFields['Requester ID'].v : (keyFields['Completer ID'] ? keyFields['Completer ID'].v : '');
    var tagStr = keyFields['Tag'] ? keyFields['Tag'].v : '';
    var lenStr = keyFields['Length'] ? keyFields['Length'].v : '';
    var statusStr = keyFields['Status'] ? keyFields['Status'].v : '';
    var msgCodeStr = keyFields['Message Code'] ? keyFields['Message Code'].v : '';
    var busStr = keyFields['Bus'] ? 'B:'+keyFields['Bus'].v+' D:'+keyFields['Device'].v+' F:'+keyFields['Function'].v : '';
    var typeStr = keyFields['Type'] ? keyFields['Type'].v : '';
    
    var modeLabel = flit ? 'FLIT' : 'Non-FLIT';
    var summaryHTML = '<div class="top">';
    summaryHTML += '<div class="name">'+name+' <span class="mode">'+modeLabel+'</span></div>';
    summaryHTML += '<div class="badges">';
    summaryHTML += '<span class="badge">'+(hasData?'рҹ“Ұ жңүж•°жҚ®':'рҹ“„ ж— ж•°жҚ®')+'</span>';
    summaryHTML += '<span class="badge">Header: <b>'+hdrDW+' DW</b></span>';
    if(lenStr) summaryHTML += '<span class="badge">Payload: <b>'+lenStr+'</b></span>';
    if(payloadB>0) summaryHTML += '<span class="badge" style="background:#dc2626">Data: <b>'+payloadB+' B</b></span>';
    summaryHTML += '</div></div><div class="grid">';
    
    var gridItems = [];
    if(flit) {
      gridItems.push({l:'Flit Type', v: typeStr});
      gridItems.push({l:'TC', v: keyFields['TC']?keyFields['TC'].v:''});
      gridItems.push({l:'OHC', v: keyFields['OHC']?keyFields['OHC'].v:''});
      gridItems.push({l:'TS', v: keyFields['TS']?keyFields['TS'].v:''});
    } else {
      gridItems.push({l:'Fmt', v: fields.length>0?fields[0].v:''});
      gridItems.push({l:'Type', v: typeStr});
    }
    if(tagStr) gridItems.push({l:'Tag', v: tagStr});
    if(reqStr) gridItems.push({l:'ReqID', v: reqStr});
    if(statusStr) gridItems.push({l:'Status', v: statusStr});
    if(msgCodeStr) gridItems.push({l:'Msg Code', v: msgCodeStr});
    if(busStr) gridItems.push({l:'Config', v: busStr});
    if(lenStr) gridItems.push({l:'Length', v: lenStr});
    if(addrStr) gridItems.push({l:'Address', v: addrStr});
    
    gridItems.forEach(function(item){
      summaryHTML += '<div class="item"><div class="lbl">'+item.l+'</div><div class="val">'+item.v+'</div></div>';
    });
    
    summaryHTML += '</div><div class="raw">RAW: '+rawHex+'</div>';
    
    // ====== TLP Description ======
    var descLines = [];
    if(flit) {
      var flitType = keyFields['Type'] ? keyFields['Type'].v : '';
      descLines.push('вҡЎ FLITжЁЎејҸ В· зұ»еһӢ: '+name);
      descLines.push('вҖў еӨҙй•ҝ: '+hdrDW+'DW'+(hasData?' В· ж•°жҚ®иҙҹиҪҪ: '+lenDW+'DW ('+(lenDW*4)+'B)':' В· ж— ж•°жҚ®иҙҹиҪҪ'));
      if(addrStr) descLines.push('вҖў зӣ®ж Үең°еқҖ: '+addrStr);
      if(reqStr) descLines.push('вҖў иҜ·жұӮиҖ…ID: '+reqStr);
      if(addrStr && name.indexOf('Write')>=0) descLines.push('вҖў ж“ҚдҪң: еҶҷе…Ҙең°еқҖ '+addrStr+'пјҢй•ҝеәҰ '+lenDW+'DW');
      if(addrStr && name.indexOf('Read')>=0) descLines.push('вҖў ж“ҚдҪң: иҜ»еҸ–ең°еқҖ '+addrStr+'пјҢиҜ·жұӮ '+lenDW+'DW');
    } else {
      var desc = '';
      // Build natural language description
      if(name.indexOf('MRd')===0) desc = 'иҜ»еӯҳеӮЁеҷЁең°еқҖ '+addrStr+'пјҢиҜ·жұӮиҜ»еҸ– '+lenDW+'DW ('+(lenDW*4)+'B)';
      else if(name.indexOf('MWr')===0) desc = 'еҶҷеӯҳеӮЁеҷЁең°еқҖ '+addrStr+'пјҢж•°жҚ®й•ҝеәҰ '+lenDW+'DW ('+(lenDW*4)+'B)';
      else if(name.indexOf('CfgRd')===0) {
        var busV = keyFields['Bus'] ? keyFields['Bus'].v : '';
        var devV = keyFields['Device'] ? keyFields['Device'].v : '';
        var fnV = keyFields['Function'] ? keyFields['Function'].v : '';
        var regV = keyFields['Register No'] ? keyFields['Register No'].v : '';
        var regNum = keyFields['Register No'] ? parseInt(keyFields['Register No'].raw) : -1;
        var regName = getConfigRegName(regNum);
        desc = 'иҜ»еҸ–й…ҚзҪ®з©әй—ҙ B:'+busV+' D:'+devV+' F:'+fnV+'пјҢеҜ„еӯҳеҷЁеҒҸз§» 0x'+(regNum*4).toString(16).toUpperCase()+(regName?' ('+regName+')':'');
      }
      else if(name.indexOf('CfgWr')===0) {
        var busV = keyFields['Bus'] ? keyFields['Bus'].v : '';
        var devV = keyFields['Device'] ? keyFields['Device'].v : '';
        var fnV = keyFields['Function'] ? keyFields['Function'].v : '';
        var regV = keyFields['Register No'] ? keyFields['Register No'].v : '';
        var regNum = keyFields['Register No'] ? parseInt(keyFields['Register No'].raw) : -1;
        var regName = getConfigRegName(regNum);
        desc = 'еҶҷе…Ҙй…ҚзҪ®з©әй—ҙ B:'+busV+' D:'+devV+' F:'+fnV+'пјҢеҜ„еӯҳеҷЁеҒҸз§» 0x'+(regNum*4).toString(16).toUpperCase()+(regName?' ('+regName+')':'');
      }
      else if(name.indexOf('Cpl')===0) desc = 'е®ҢжҲҗеҢ…'+(hasData?'пјҢиҝ”еӣһж•°жҚ®й•ҝеәҰ '+lenDW+'DW':'')+(statusStr?'пјҢзҠ¶жҖҒ: '+statusStr:'');
      else if(name.indexOf('Msg')===0) desc = 'ж¶ҲжҒҜ '+(msgCodeStr?'зј–з Ғ: '+msgCodeStr:'')+' и·Ҝз”ұеҲ°зӣ®ж Ү';
      else if(name.indexOf('IORd')===0) desc = 'иҜ»I/Oз«ҜеҸЈең°еқҖ '+addrStr;
      else if(name.indexOf('IOWr')===0) desc = 'еҶҷI/Oз«ҜеҸЈең°еқҖ '+addrStr;
      else if(name.indexOf('FetchAdd')===0||name.indexOf('Swap')===0||name.indexOf('CAS')===0) desc = 'еҺҹеӯҗж“ҚдҪң '+name+' ең°еқҖ '+addrStr;
      else desc = name+' TLP';
      descLines.push('рҹ“Ұ '+desc);
      var epVal = keyFields['EP'] ? keyFields['EP'].v : '';
      if(epVal==='1') descLines.push('вҡ пёҸ ж•°жҚ®дёӯжҜ’');
      var tdVal = keyFields['TD'] ? keyFields['TD'].v : '';
      if(tdVal==='1') descLines.push('еҗ«ECCRC');
    }
    summaryHTML += '<div style="margin-top:10px;padding:10px 12px;background:rgba(255,255,255,.07);border-radius:6px;font-size:13px;line-height:1.6;color:rgba(255,255,255,.9)">';
    descLines.forEach(function(l){ if(l) summaryHTML += '<div>'+l+'</div>'; });
    summaryHTML += '</div>';
    
    sumEl.innerHTML = summaryHTML;
    
    // ====== Packet Info Bar (secondary) ======
    var infoHTML = '<span class="tag '+(flit?'tag-fm':'tag-nf')+'">'+(flit?'FLIT':'Non-FLIT')+'</span>'+
      '<span class="tag tag-ty">'+name+'</span>'+
      '<span class="tag tag-ln">'+hdrDW+'DWеӨҙ'+(hasData?' В· '+lenDW+'DWж•°жҚ®':' В· ж— ж•°жҚ®')+'</span>'+
      (payloadB>0?'<span class="tag" style="background:#fce4ec;color:#c62828">Payload: '+payloadB+'B</span>':'')+
      '<span class="tag-rw">'+dw.map(dwStr).join(' ')+'</span>';
    document.getElementById('pktInfo').innerHTML = infoHTML;
    
    // Diagram
    var html = '<div class="dia-t">рҹ“Ҡ TLP её§з»“жһ„ <span class="s">(MSBе·ҰвҶ’LSBеҸі, Byte0е…Ҳдј )</span></div>';
    // Bit position row with label spacer (70px to match .dl width)
    html += '<div style="display:flex;margin-bottom:2px"><div style="width:70px;min-width:70px"></div><div style="display:flex;flex:1">';
    for(var b=0;b<4;b++) html+='<div style="flex:1;text-align:center;font-size:10px;color:#888;font-weight:600;padding:1px 0;border-bottom:2px solid #000">Byte +'+b+'</div>';
    html += '</div></div>';
    html += '<div style="display:flex;margin-bottom:4px"><div style="width:70px;min-width:70px"></div><div style="display:flex;flex:1">';
    for(var b=0;b<4;b++) for(var i=7;i>=0;i--) html+='<div style="flex:1;text-align:center;font-size:8px;color:#bbb;font-family:Consolas,monospace">'+i+'</div>';
    html += '</div></div>';
    
    rows.forEach(function(row){
      html += '<div class="dr"><div class="dl">'+row.l+'</div><div class="fd">';
      var bitPos = 31;
      row.f.forEach(function(f){
        var dk = f.c==='#95a5a6'||f.c==='#bdc3c7'||f.c==='#1abc9c'||f.c==='#2ecc71';
        var dn = f.n.length>12?f.n.substr(0,10)+'вҖҰ':f.n;
        html += '<div class="fb'+(dk?' dk':'')+'" style="flex:'+f.b+' 0 0;background:'+f.c+'" onclick="highlightField(\''+f.n+'\')">';
        html += '<span class="fn">'+dn+'</span>';
        html += '<span class="fv">'+f.v+'</span></div>';
        bitPos -= f.b;
        // Add byte boundary marker after every 8 bits
        if(bitPos % 8 === 0 && bitPos > 0) {
          html += '<div style="width:2px;flex-shrink:0;background:rgba(0,0,0,.08);border-radius:1px"></div>';
        }
      });
      html += '</div></div>';
    });
    
    html += '<div class="lg">';
    [['#2980b9','Fmt'],['#1abc9c','Type'],['#9b59b6','Tag'],['#c0392b','TC'],
     ['#2ecc71','Attr'],['#f39c12','ReqID'],['#34495e','Length'],['#3498db','AT'],
     ['#2c3e50','Address'],['#8e44ad','TH'],['#16a085','TD'],['#e74c3c','EP']]
    .forEach(function(x){html+='<div><span class="sw" style="background:'+x[0]+'"></span>'+x[1]+'</div>';});
    html += '</div>';
    document.getElementById('diagram').innerHTML = html;
    
    // Table
    var tb = document.getElementById('fieldBody');
    tb.innerHTML = '';
    fields.forEach(function(f){
      var bw = Math.ceil(f.b/4);
      var rh = '0x'+('00000000'+((f.raw>>>0).toString(16).toUpperCase())).slice(-Math.max(bw,1));
      tb.innerHTML += '<tr><td style="color:#8899b4;width:28px">'+f.idx+'</td>'+
        '<td class="n"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+f.c+';vertical-align:middle;margin-right:4px"></span>'+f.n+'</td>'+
        '<td class="v" style="color:#8899b4">'+f.b+' bit</td>'+
        '<td class="v" style="color:#8899b4">DW'+f.dw+' ['+f.hi+':'+f.lo+']</td>'+
        '<td class="v">'+rh+'</td><td style="font-family:inherit;color:#374151;font-size:13px">'+f.d+'</td></tr>';
    });
    
    // 如果不是自动解码（即用户手动操作），则滚动到结果区域
    if (!auto) {
      res.scrollIntoView({behavior:'smooth', block:'start'});
    }
  }
  
  // ====== Setup ======
  btn.onclick = function() { doDecode(false); };
  clr.onclick = function() { inp.value=''; err.style.display='none'; res.classList.remove('on'); inp.focus(); };
  inp.onkeydown = function(e) { if(e.key==='Enter') doDecode(false); };
  
  // Examples
  function loadExamples(flit) {
    exEl.innerHTML = '';
    var list = flit ? FLIT_EXAMPLES : EXAMPLES;
    list.forEach(function(ex) {
      var s = document.createElement('span');
      s.textContent = ex;
      s.onclick = function() { inp.value = ex; doDecode(false); };
      exEl.appendChild(s);
    });
  }
  loadExamples(false);
  
  // Init
  updHistUI();
  // Auto-decode first example (suppress scrolling)
  function autoDecode() {
    var list = isFlitMode() ? FLIT_EXAMPLES : EXAMPLES;
    if(list.length>0) {
      inp.value = list[0];
      doDecode(true);  // auto=true to suppress scroll
    }
  }
  autoDecode();
  
  // 强制页面加载完成后滚动到顶部（覆盖任何可能的滚动）
  window.addEventListener('load', function() {
    window.scrollTo(0, 0);
  });
  
})();

// Global for onclick from diagram
function highlightField(name) {
  var els = document.querySelectorAll('.fb');
  els.forEach(function(e){e.style.outline='';});
  var found = false;
  els.forEach(function(e){
    if(e.textContent.indexOf(name)>=0 && !found) {
      e.style.outline='2px solid #000';
      e.style.outlineOffset='1px';
      found = true;
    }
  });
  var rows = document.querySelectorAll('#fieldBody tr');
  rows.forEach(function(r){
    if(r.textContent.indexOf(name)>=0) {
      r.scrollIntoView({behavior:'smooth',block:'center'});
      r.style.background='#fff9c4';
      setTimeout(function(){r.style.background='';},1500);
    }
  });
}
</script>
