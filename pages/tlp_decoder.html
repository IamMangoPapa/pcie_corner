<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <link rel="stylesheet" href="./../UI/particles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCIe TLP 解码器（Based on PCIe 6.0）</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
      background: #f0f2f5;
      color: #1a2332;
      min-height: 100vh;
      padding: 20px
    }

    .container {
      max-width: 1100px;
      margin: 0 auto
    }

    h1 {
      font-size: 22px;
      color: #1a56db;
      margin-bottom: 4px
    }

    .sub {
      font-size: 13px;
      color: #6b7c93;
      margin-bottom: 16px
    }

    .panel {
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px
    }

    .panel label {
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      display: block;
      margin-bottom: 6px
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .row input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 2px solid #d0d5dd;
      border-radius: 6px;
      font-size: 14px;
      font-family: Consolas, Menlo, monospace;
      outline: none;
      background: #fff;
      color: #000
    }

    .row input:focus {
      border-color: #1a56db;
      background: #fff
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap
    }

    .btn-primary {
      background: #1a56db;
      color: #fff
    }

    .btn-primary:hover {
      background: #1545b8
    }

    .btn-second {
      background: #eef2f7;
      color: #4a5568;
      border: 1px solid #d0d5dd
    }

    .btn-second:hover {
      background: #e2e8f0
    }

    .btn-sm {
      padding: 4px 10px !important;
      font-size: 11px !important;
      border-radius: 4px !important
    }

    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fecaca
    }

    .btn-danger:hover {
      background: #fecaca
    }

    .mode-select {
      padding: 8px 12px;
      border: 2px solid #d0d5dd;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      background: #fff;
      cursor: pointer;
      min-width: 120px
    }

    .mode-select:focus {
      border-color: #1a56db
    }

    .mode-select.nf {
      color: #1a56db;
      background: #e8eefb
    }

    .mode-select.fm {
      color: #7c3aed;
      background: #f0e8fb
    }

    .tbar {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .tbar .ex {
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }

    .tbar .ex span {
      font-size: 11px;
      color: #6b7c93;
      padding: 3px 8px;
      background: #f0f5ff;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #d0e0ff;
      white-space: nowrap
    }

    .tbar .ex span:hover {
      background: #dbeafe;
      border-color: #1a56db;
      color: #1a56db
    }

    .hist {
      position: relative;
      display: inline-block
    }

    .hist-btn {
      padding: 4px 10px;
      background: #f0f5ff;
      border: 1px solid #d0e0ff;
      border-radius: 4px;
      font-size: 11px;
      color: #6b7c93;
      cursor: pointer
    }

    .hist-btn:hover {
      background: #dbeafe;
      border-color: #1a56db;
      color: #1a56db
    }

    .hist-dd {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 2px;
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
      z-index: 100;
      min-width: 320px;
      max-height: 240px;
      overflow-y: auto
    }

    .hist-dd.show {
      display: block
    }

    .hist-dd .hi {
      padding: 6px 12px;
      font-size: 11px;
      font-family: Consolas, monospace;
      cursor: pointer;
      border-bottom: 1px solid #eef2f7;
      color: #4a5568;
      display: flex;
      justify-content: space-between
    }

    .hist-dd .hi:hover {
      background: #f0f5ff
    }

    .hist-dd .hi .t {
      font-size: 9px;
      color: #8899b4;
      font-family: inherit
    }

    .hist-dd .em {
      font-size: 11px;
      color: #8899b4;
      padding: 12px;
      text-align: center
    }

    .err {
      color: #dc2626;
      font-size: 13px;
      margin-top: 6px;
      display: none
    }

    .res {
      display: none
    }

    .res.on {
      display: block
    }

    .info {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .tag {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: 600
    }

    .tag-nf {
      background: #e8eefb;
      color: #1a56db
    }

    .tag-fm {
      background: #f0e8fb;
      color: #7c3aed
    }

    .tag-ty {
      background: #fff3e0;
      color: #e65100
    }

    .tag-ln {
      background: #e8f5e9;
      color: #2e7d32
    }

    .tag-rw {
      font-family: Consolas, monospace;
      font-size: 11px;
      padding: 4px 10px;
      background: #f5f5f5;
      border-radius: 4px;
      color: #555;
      max-width: 500px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .dia {
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      overflow-x: auto
    }

    .dia-t {
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px
    }

    .dia-t .s {
      font-weight: 400;
      font-size: 11px;
      color: #8899b4
    }

    .dr {
      display: flex;
      align-items: stretch;
      margin-bottom: 2px;
      min-height: 30px
    }

    .dl {
      width: 70px;
      min-width: 70px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: 11px;
      color: #888;
      font-weight: 600;
      white-space: nowrap
    }

    .fd {
      display: flex;
      flex: 1;
      gap: 1px
    }

    .fb {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 1px;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      border-radius: 2px;
      min-height: 30px;
      text-align: center;
      line-height: 1.2;
      overflow: hidden;
      transition: all .08s;
      position: relative
    }

    .fb:hover {
      filter: brightness(1.12) !important;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
      z-index: 5
    }

    .fb .fn {
      font-size: 10px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .4);
      pointer-events: none
    }

    .fb .fv {
      font-size: 8px;
      position: absolute;
      bottom: 1px;
      right: 2px;
      pointer-events: none;
      opacity: .9;
      text-shadow: 0 1px 1px rgba(0, 0, 0, .3)
    }

    .fb.dk {
      color: #111 !important
    }

    .fb.dk .fn {
      color: #111 !important;
      text-shadow: none
    }

    .fb.dk .fv {
      color: #444 !important;
      text-shadow: none
    }

    .tb {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      overflow: hidden
    }

    .tb th {
      background: #f0f5ff;
      padding: 8px 8px;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      text-align: left;
      border-bottom: 2px solid #d0d5dd
    }

    .tb td {
      padding: 7px 8px;
      font-size: 14px;
      border-bottom: 1px solid #eef2f7;
      font-family: Consolas, Menlo, monospace;
      color: #4a5568
    }

    .tb td.n {
      white-space: normal;
      word-break: break-all;
      max-width: 90px;
      width: 15%
    }

    .tb td.v {
      white-space: nowrap;
      font-size: 12px
    }

    .tb tr:hover td {
      background: #f8faff
    }

    .lg {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #eef2f7
    }

    .lg div {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      color: #6b7c93
    }

    .lg div .sw {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0
    }

    .h {
      font-size: 11px;
      color: #8899b4;
      margin-top: 6px
    }

    .summary {
      background: linear-gradient(135deg, #1a2332, #2c3e50);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 16px;
      color: #fff;
      display: none
    }

    .summary.on {
      display: block
    }

    .summary .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px
    }

    .summary .name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px
    }

    .summary .name .mode {
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, .15);
      padding: 3px 10px;
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle
    }

    .summary .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .summary .badge {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 255, 255, .12)
    }

    .summary .badge b {
      color: #fbbf24
    }

    .summary .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px
    }

    .summary .item {
      background: rgba(255, 255, 255, .08);
      border-radius: 6px;
      padding: 8px 12px
    }

    .summary .item .lbl {
      font-size: 9px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .5);
      font-weight: 600;
      letter-spacing: .5px
    }

    .summary .item .val {
      font-size: 16px;
      font-weight: 700;
      margin-top: 2px;
      font-family: Consolas, Menlo, monospace
    }

    .summary .item .val .subv {
      font-size: 11px;
      font-weight: 400;
      opacity: .7;
      margin-left: 6px
    }

    .summary .raw {
      font-size: 11px;
      font-family: Consolas, monospace;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, .1);
      color: rgba(255, 255, 255, .5);
      word-break: break-all
    }

    @media(max-width:700px) {
      body {
        padding: 10px
      }

      .row input {
        min-width: 100%
      }

      .dl {
        width: 50px;
        min-width: 50px;
        font-size: 10px
      }

      .summary .name {
        font-size: 20px
      }
    }
  </style>
</head>

<body>
  <canvas id="particleCanvas"></canvas>
  <div class="container">
    <h1>🥭 PCIe TLP 解码器 <span style="font-size:12px;font-weight:400;color:#6b7c93">(Based on PCIe 6.0)</span></h1>
    <div class="sub">输入 TLP 十六进制数据，自动解析各字段并可视化</div>

    <div class="panel">
      <label for="hexInput">TLP 十六进制数据（可含空格）</label>
      <div class="row">
        <input type="text" id="hexInput" placeholder="例如: 4A000001 02003000 00000001 80000000">
        <select id="modeSelect" class="mode-select nf" onchange="toggleMode()">
          <option value="nf" selected>🧊 Non-FLIT</option>
          <option value="fm">⚡ FLIT Mode</option>
        </select>
        <button class="btn btn-primary" id="decodeBtn">🔍 解码</button>
        <button class="btn btn-second" id="clearBtn">🗑 清空</button>
      </div>
      <div class="tbar">
        <div class="ex" id="examples"></div>
        <div class="hist">
          <div class="hist-btn" id="histBtn">📋 历史 (<span id="histCnt">0</span>)</div>
          <div class="hist-dd" id="histDD"></div>
        </div>
        <button class="btn btn-sm btn-danger" id="clearHistBtn">清空历史</button>
      </div>
      <div class="err" id="errMsg"></div>
      <div class="h">💡 直接输入或粘贴 · Enter 解码 · 历史自动保存</div>
    </div>

    <div class="res" id="resArea">
      <div class="summary" id="summaryBox"></div>
      <div class="info" id="pktInfo"></div>
      <div class="dia" id="diagram"></div>
      <table class="tb" id="fieldTable">
        <thead>
          <tr>
            <th style="width:28px">#</th>
            <th style="width:15%">字段</th>
            <th style="width:80px">位宽</th>
            <th style="width:100px">位置</th>
            <th style="width:130px">原始值</th>
            <th>描述</th>
          </tr>
        </thead>
        <tbody id="fieldBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    (function () {
      // ====== DOM refs ======
      var inp = document.getElementById('hexInput');
      var btn = document.getElementById('decodeBtn');
      var clr = document.getElementById('clearBtn');
      var err = document.getElementById('errMsg');
      var res = document.getElementById('resArea');
      var modeSel = document.getElementById('modeSelect');

      function isFlitMode() { return modeSel.value === 'fm'; }

      function toggleMode() {
        modeSel.className = 'mode-select ' + (isFlitMode() ? 'fm' : 'nf');
        loadExamples(isFlitMode());
        if (document.getElementById('hexInput').value.trim()) doDecode();
      }
      var exEl = document.getElementById('examples');
      var histBtn = document.getElementById('histBtn');
      var histDD = document.getElementById('histDD');
      var histCnt = document.getElementById('histCnt');

      // ====== Colors ======
      var C = {
        fmt: '#2980b9', type: '#1abc9c', tag: '#9b59b6', tc: '#c0392b', attr: '#2ecc71',
        r: '#95a5a6', th: '#8e44ad', td: '#16a085', ep: '#e74c3c', at: '#3498db',
        len: '#34495e', reqid: '#f39c12', addr: '#2c3e50', addr2: '#7f8c8d',
        be: '#1abc9c', status: '#be185d', msg: '#ea580c', ohc: '#059669', ph: '#bdc3c7'
      };

      // ====== Non-Flit Fmt 描述 ======
      var FMT = { 
        '000': '3DW无数据', 
        '001': '4DW无数据', 
        '010': '3DW有数据', 
        '011': '4DW有数据', 
        '100': 'TLP Prefix' 
      };

      // ====== Non-Flit Type 映射 ======
      var TNAMES = {
        '000_00000': 'MRd32', 
        '001_00000': 'MRd64', 
        '010_00000': 'MWr32', 
        '011_00000': 'MWr64',
        '000_00001': 'MRdLk32', 
        '001_00001': 'MRdLk64',
        '000_00010': 'IORd', 
        '010_00010': 'IOWr',
        '000_00100': 'CfgRd0', 
        '010_00100': 'CfgWr0',
        '000_00101': 'CfgRd1',
        '010_00101': 'CfgWr1',
        '001_10000': 'Msg',
        '011_10000': 'MsgD',
        '000_01010': 'Cpl',
        '010_01010': 'CplD',
        '000_01011': 'CplLk',
        '010_01011': 'CplDLk',
        '010_01100': 'FetchAdd',
        '011_01100': 'FetchAdd64',
        '010_01101': 'Swap',
        '011_01101': 'Swap64',
        '010_01110': 'CAS',
        '011_01110': 'CAS64',
        '010_01111': 'DMWr32',
        '011_01111': 'DMWr64',
        '000_11011': 'TCfgRd'
      };

      // ====== Flit DB —— 基于 PCIe 6.0 Table 2-5 完整版 ======
      var FLIT_DB = {};
      function flitDB(hex, name, hdr, hasData, desc) {
        var k = parseInt(hex, 16);
        FLIT_DB[k] = { n: name, h: hdr, d: hasData, desc: desc };
      }
      flitDB('00', 'NOP', 1, false, 'NOP 空闲填充 (1DW)');
      flitDB('01', 'MRdLk32', 3, false, '32-bit 锁定读 (3DW, 无数据, 已废弃)');
      flitDB('02', 'IORd', 3, false, 'I/O 读 (3DW, 无数据, 已废弃)');
      flitDB('03', 'MRd32', 3, false, '32-bit 存储器读 (3DW, 无数据, 需 CplD)');
      flitDB('04', 'CfgRd0', 3, false, '配置读 Type 0 (3DW, 无数据, 需 CplD)');
      flitDB('05', 'CfgRd1', 3, false, '配置读 Type 1 (3DW, 无数据, 需 CplD)');
      flitDB('0A', 'Cpl', 3, false, '完成无数据 (3DW, 响应 IOWr/CfgWr)');
      flitDB('0B', 'CplLk', 3, false, '锁定读完成无数据 (3DW, 已废弃)');
      flitDB('20', 'MRd64', 4, false, '64-bit 存储器读 (4DW, 无数据, 需 CplD)');
      flitDB('21', 'MRdLk64', 4, false, '64-bit 锁定读 (4DW, 已废弃)');
      flitDB('30', 'Msg (to RC)', 4, false, '消息到 RC (4DW, 无数据, Posted)');
      flitDB('31', 'Msg (Routed by Addr)', 4, false, '消息按地址路由 (4DW, 无数据, Posted, 规范未定义使用)');
      flitDB('32', 'Msg (Routed by ID)', 4, false, '消息按 ID 路由 (4DW, 无数据, Posted)');
      flitDB('33', 'Msg (Broadcast from RC)', 4, false, '消息广播 (4DW, 无数据, Posted)');
      flitDB('34', 'Msg (Local Terminate)', 4, false, '消息本地终止 (4DW, 无数据, Posted)');
      flitDB('35', 'Msg (Gathered and routed to RC)', 4, false, '通用消息 (4DW, 无数据)');
      flitDB('36', 'Msg (Rsvd)', 4, false, '预留消息 (4DW, 无数据)');
      flitDB('37', 'Msg (Rsvd)', 4, false, '预留消息 (4DW, 无数据)');
      flitDB('40', 'MWr32', 3, true, '32-bit 存储器写 (3DW, 有数据, Posted)');
      flitDB('42', 'IOWr', 3, true, 'I/O 写 (3DW, 有数据, 已废弃)');
      flitDB('44', 'CfgWr0', 3, true, '配置写 Type 0 (3DW, 有数据, 必须 OHC-A3)');
      flitDB('45', 'CfgWr1', 3, true, '配置写 Type 1 (3DW, 有数据, 必须 OHC-A3)');
      flitDB('4A', 'CplD', 3, true, '完成带数据 (3DW, 响应 MRd)');
      flitDB('4B', 'CplDLk', 3, true, '锁定读完成带数据 (3DW, 已废弃)');
      flitDB('4C', 'FetchAdd32', 3, true, '32-bit FetchAdd 原子操作 (3DW, 有数据, 需 CplD)');
      flitDB('4D', 'Swap32', 3, true, '32-bit Swap 原子操作 (3DW, 有数据, 需 CplD)');
      flitDB('4E', 'CAS32', 3, true, '32-bit CAS 原子操作 (3DW, 2DW 数据, 需 CplD)');
      flitDB('5B', 'DMWr32', 3, true, '32-bit Deferrable Memory Write (3DW, 有数据)');
      flitDB('60', 'MWr64', 4, true, '64-bit 存储器写 (4DW, 有数据, Posted)');
      flitDB('6C', 'FetchAdd64', 4, true, '64-bit FetchAdd 原子操作 (4DW, 有数据, 需 CplD)');
      flitDB('6D', 'Swap64', 4, true, '64-bit Swap 原子操作 (4DW, 有数据, 需 CplD)');
      flitDB('6E', 'CAS64', 4, true, '64-bit CAS 原子操作 (4DW, 2DW 数据, 需 CplD)');
      flitDB('70', 'MsgD (to RC)', 4, true, '带数据消息到 RC (4DW, 1DW 数据, Posted)');
      flitDB('71', 'MsgD (Routed by Addr)', 4, true, '带数据消息按地址路由 (4DW, Posted, 规范未定义使用)');
      flitDB('72', 'MsgD (Routed by ID)', 4, true, '带数据消息按 ID 路由 (4DW, Posted)');
      flitDB('73', 'MsgD (Broadcast from RC)', 4, true, '带数据消息广播 (4DW, Posted)');
      flitDB('74', 'MsgD (Local Terminate)', 4, true, '带数据消息本地终止 (4DW, Posted, PTM ResponseD)');
      flitDB('75', 'MsgD (Gathered and routed to RC)', 4, true, '通用带数据消息 (4DW, Posted)');
      flitDB('76', 'MsgD (Rsvd)', 4, true, '预留带数据消息 (4DW, Posted)');
      flitDB('77', 'MsgD (Rsvd)', 4, true, '预留带数据消息 (4DW, Posted)');
      flitDB('7B', 'DMWr64', 4, true, '64-bit Deferrable Memory Write (4DW, 有数据)');

      // ====== 示例 ======
      var EXAMPLES = [
        '4A000001 02003000 00000001 80000000',
        '00000001 02003000 80000000',
        '0A000001 02003000 00000001',
        '4A000001 02003000 00000001 80000000 12345678 DEADBEEF'
      ];
      var FLIT_EXAMPLES = [
        '03000001 02003000 80000000',
        '40000004 02003000 00000001 80000000',   // MWr32 with OHC-A
        '44000001 02003000 01000000',            // CfgWr0 with OHC-A3
        '01000004 02003000 80000000',
        '02000001 02003000 01000000',
        '20000004 02003000 00000001 80000000',
        '60000004 02003000 00000001 80000000'
      ];

      // ====== History ======
      function getHist() { try { return JSON.parse(localStorage.getItem('tlp_hist') || '[]'); } catch (e) { return []; } }
      function addHist(s) {
        try {
          var h = getHist();
          var c = s.trim().replace(/\s+/g, ' ');
          var i = h.findIndex(function (x) { return x.h === c; });
          if (i >= 0) h.splice(i, 1);
          h.unshift({ h: c, t: new Date().toLocaleString() });
          if (h.length > 20) h.length = 20;
          localStorage.setItem('tlp_hist', JSON.stringify(h));
          updHistUI();
        } catch (e) { }
      }
      function clearHist() {
        if (!confirm('清空所有历史记录？')) return;
        try { localStorage.removeItem('tlp_hist'); } catch (e) { }
        updHistUI();
        histDD.classList.remove('show');
      }
      function updHistUI() { histCnt.textContent = getHist().length; }
      function renderHist() {
        var h = getHist();
        histDD.innerHTML = '';
        if (h.length === 0) { histDD.innerHTML = '<div class="em">暂无历史记录</div>'; return; }
        h.forEach(function (item) {
          var d = document.createElement('div');
          d.className = 'hi';
          d.innerHTML = '<span>' + item.h + '</span><span class="t">' + item.t + '</span>';
          (function (val) { d.onclick = function () { inp.value = val; histDD.classList.remove('show'); doDecode(); }; })(item.h);
          histDD.appendChild(d);
        });
      }
      histBtn.onclick = function (e) { e.stopPropagation(); histDD.classList.toggle('show'); if (histDD.classList.contains('show')) renderHist(); };
      document.addEventListener('click', function () { histDD.classList.remove('show'); });
      document.getElementById('clearHistBtn').onclick = clearHist;

      // ====== Helpers ======
      function hex2bytes(s) {
        s = s.replace(/\s+/g, '');
        if (!/^[0-9a-fA-F]+$/.test(s)) throw new Error('含有非十六进制字符');
        if (s.length % 2 !== 0) throw new Error('长度必须为偶数');
        var b = [];
        for (var i = 0; i < s.length; i += 2) b.push(parseInt(s.substr(i, 2), 16));
        return b;
      }
      function dwVal(bytes, off) { if (off + 4 > bytes.length) return null; return ((bytes[off] << 24) | (bytes[off + 1] << 16) | (bytes[off + 2] << 8) | bytes[off + 3]) >>> 0; }
      function bits(val, hi, lo) { return (val >>> lo) & ((1 << (hi - lo + 1)) - 1); }
      function dwStr(v) { return ('00000000' + (v >>> 0).toString(16).toUpperCase()).slice(-8); }
      function tlpName(fmt, type) {
        var key = fmt + '_' + type;
        return TNAMES[key] || null;
      }

      // ====== Main Decode ======
      function doDecode() {
        var input = inp.value.trim();
        err.style.display = 'none';
        var flit = isFlitMode();
        if (!input) {
          err.textContent = '❌ 请输入 TLP 十六进制数据';
          err.style.display = 'block';
          res.classList.remove('on');
          return;
        }
        try {
          var bytes = hex2bytes(input);
          if (bytes.length < 4) throw new Error('至少需要4字节(1DW)，当前仅' + bytes.length + '字节');
          addHist(input);
          var dw = [];
          for (var i = 0; i < bytes.length; i += 4) { var v = dwVal(bytes, i); if (v !== null) dw.push(v); }
          if (flit) { doDecodeFlit(dw, bytes); } else { doDecodeNonFlit(dw, bytes); }
        } catch (e) {
          err.textContent = '❌ ' + e.message;
          err.style.display = 'block';
          res.classList.remove('on');
        } 
      }

      // ====== Non-Flit Mode ======
      function doDecodeNonFlit(dw, bytes) {
        var dw0 = dw[0], dw1 = dw[1] || 0, dw2 = dw[2] || 0, dw3 = dw[3] || 0;
        var fmt = bits(dw0, 31, 29);
        var type = bits(dw0, 28, 24);
        var t9 = bits(dw0, 23, 23);
        var tc = bits(dw0, 22, 20);
        var t8 = bits(dw0, 19, 19);
        var a2 = bits(dw0, 18, 18);
        var r17 = bits(dw0, 17, 17);
        var th = bits(dw0, 16, 16);
        var td = bits(dw0, 15, 15);
        var ep = bits(dw0, 14, 14);
        var a1 = bits(dw0, 13, 13);
        var a0 = bits(dw0, 12, 12);
        var at = bits(dw0, 11, 10);
        var lenH = bits(dw0, 9, 8);
        var lenL = bits(dw0, 7, 0);
        var len = (lenH << 8) | lenL;
        var lenDW = len === 0 ? 1024 : len;

        var fStr = ('000' + fmt.toString(2)).slice(-3);
        var tStr = ('00000' + type.toString(2)).slice(-5);
        var name = tlpName(fStr, tStr);
        var isUnsupported = (name === null);
        if (isUnsupported) name = 'Unsupported TLP (Fmt=' + fStr + ' Type=' + tStr + ')';

        var fDesc = FMT[fStr] || '保留';
        var is4DW = (fmt === 1 || fmt === 3);
        var hasData = (fmt === 2 || fmt === 3);
        var hdrDW = is4DW ? 4 : 3;

        var rows = [], fields = [], idx = 0;

        var dw0f = [
          { n: 'Fmt', b: 3, v: fStr, hi: 31, lo: 29, c: C.fmt, d: 'TLP 格式: ' + fDesc },
          { n: 'Type', b: 5, v: '0x' + type.toString(16).toUpperCase(), hi: 28, lo: 24, c: C.type, d: 'TLP 类型编码: ' + tStr + (isUnsupported ? ' ⚠️ 此编码为保留或不支持' : '') },
          { n: 'T9', b: 1, v: t9.toString(), hi: 23, lo: 23, c: C.tag, d: 'Extended Tag bit 9 (Tag[9])' },
          { n: 'TC', b: 3, v: 'TC' + tc, hi: 22, lo: 20, c: C.tc, d: 'Traffic Class: TC' + tc + ' (TC0 必须支持)' },
          { n: 'T8', b: 1, v: t8.toString(), hi: 19, lo: 19, c: C.tag, d: 'Extended Tag bit 8 (Tag[8])' },
          { n: 'Attr[2]', b: 1, v: a2.toString(), hi: 18, lo: 18, c: C.attr, d: 'Attr[2] IDO: ' + (a2 ? '允许基于ID排序' : '强制PCI顺序') },
          { n: 'R', b: 1, v: r17.toString(), hi: 17, lo: 17, c: C.r, d: 'Reserved (必须为0)' },
          { n: 'TH', b: 1, v: th.toString(), hi: 16, lo: 16, c: C.th, d: 'TPH: ' + (th ? '包含 TLP Processing Hint' : '无 TPH') },
          { n: 'TD', b: 1, v: td.toString(), hi: 15, lo: 15, c: C.td, d: 'TLP Digest (ECRC): ' + (td ? '存在' : '无') },
          { n: 'EP', b: 1, v: ep.toString(), hi: 14, lo: 14, c: C.ep, d: 'Error Poisoned: ' + (ep ? '数据中毒' : '正常') },
          { n: 'Attr[1:0]', b: 2, v: '' + a1 + a0, hi: 13, lo: 12, c: C.attr, d: 'RO=' + a1 + ' (宽松排序), NS=' + a0 + ' (No Snoop)' },
          { n: 'AT', b: 2, v: ['00', '01', '10', '11'][at], hi: 11, lo: 10, c: C.at, d: ['Untranslated', 'Translation Req', 'Translated', 'Reserved'][at] },
          { n: 'Length', b: 10, v: lenDW + ' DW', hi: 9, lo: 0, c: C.len, d: '数据负载: ' + lenDW + ' DW (' + (lenDW * 4) + ' B)' + (len === 0 ? ' (编码0=1024DW)' : '') }
        ];
        dw0f.forEach(function (f) { fields.push({ idx: idx++, dw: 0, n: f.n, b: f.b, v: f.v, raw: bits(dw0, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
        rows.push({ l: 'DW0', f: dw0f });

        if (!isUnsupported) {
          parseRemainingDW_NF(name, tStr, dw, dw0, dw1, dw2, dw3, fields, rows, idx, t9, t8);
        }
        renderAll(name, fDesc, hasData, lenDW, hdrDW, dw, rows, fields, bytes, false, isUnsupported);
      }

      // ====== Non-Flit 剩余 DW 解析（仅支持类型调用） ======
      function parseRemainingDW_NF(name, tStr, dw, dw0, dw1, dw2, dw3, fields, rows, idx, t9, t8) {
        var isCpl = name.indexOf('Cpl') === 0;
        var isCfg = name.indexOf('Cfg') === 0;
        var isIO = name.indexOf('IORd') === 0 || name.indexOf('IOWr') === 0;
        var isMsg = name.indexOf('Msg') === 0 || name.indexOf('MsgD') === 0;

        if (isCpl) {
          var cplId = bits(dw1, 31, 16);
          var st = bits(dw1, 15, 13);
          var bcm = bits(dw1, 12, 12);
          var bcH = bits(dw1, 11, 8);
          var bcL = bits(dw1, 7, 0);
          var bc = (bcH << 8) | bcL;
          var rId2 = bits(dw2, 31, 16);
          var tg2 = bits(dw2, 15, 8);
          var la = bits(dw2, 7, 1);
          var sn = ['SC (成功)', 'UR (不支持)', 'CRS (重试, 仅Cfg)', 'Reserved', 'CA (中止)', 'Reserved', 'Reserved', 'Reserved'];
          var d1f = [
            { n: 'Completer ID', b: 16, v: ('0000' + cplId.toString(16)).toUpperCase().slice(-4), hi: 31, lo: 16, c: C.reqid, d: '完成者 BDF' },
            { n: 'Status', b: 3, v: st + ' (' + (sn[st] || 'Reserved') + ')', hi: 15, lo: 13, c: C.status, d: '完成状态: ' + (sn[st] || '保留') },
            { n: 'BCM', b: 1, v: bcm.toString(), hi: 12, lo: 12, c: C.td, d: 'Byte Count Modified: ' + (bcm ? '已修改' : '未修改') },
            { n: 'Byte Count', b: 12, v: bc + ' B', hi: 11, lo: 0, c: C.len, d: '剩余字节数: ' + bc + ' B' }
          ];
          var d2f = [
            { n: 'Requester ID', b: 16, v: ('0000' + rId2.toString(16)).toUpperCase().slice(-4), hi: 31, lo: 16, c: C.reqid, d: '请求者 BDF (回显)' },
            { n: 'Tag', b: 8, v: '0x' + ('00' + tg2.toString(16)).toUpperCase().slice(-2), hi: 15, lo: 8, c: C.tag, d: 'Tag (回显)' },
            { n: 'Lower Address', b: 7, v: '0x' + ('0' + la.toString(16)).toUpperCase().slice(-2), hi: 7, lo: 1, c: C.addr2, d: '低7位地址 (数据对齐)' },
            { n: 'R', b: 1, v: '0', hi: 0, lo: 0, c: C.r, d: 'Reserved' }
          ];
          d1f.forEach(function (f) { fields.push({ idx: idx++, dw: 1, n: f.n, b: f.b, v: f.v, raw: bits(dw1, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
          d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: bits(dw2, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
          rows.push({ l: 'DW1', f: d1f }); rows.push({ l: 'DW2', f: d2f });
          return;
        }

        if (isCfg) {
          var rId = bits(dw1, 31, 16);
          var tg = bits(dw1, 15, 8);
          var lbe = bits(dw1, 7, 4);
          var fbe = bits(dw1, 3, 0);
          var bus = bits(dw2, 31, 24);
          var dev = bits(dw2, 23, 19);
          var fnc = bits(dw2, 18, 16);
          var er = bits(dw2, 11, 8);
          var rg = bits(dw2, 7, 2);
          var regOffset = ((er << 6) | rg) << 2;
          var d1f = [
            { n: 'Requester ID', b: 16, v: ('0000' + rId.toString(16)).toUpperCase().slice(-4), hi: 31, lo: 16, c: C.reqid, d: '请求者 BDF' },
            { n: 'Tag', b: 8, v: '0x' + ('00' + tg.toString(16)).toUpperCase().slice(-2), hi: 15, lo: 8, c: C.tag, d: 'Tag' },
            { n: 'Last DW BE', b: 4, v: lbe.toString(2).padStart(4, '0'), hi: 7, lo: 4, c: C.be, d: '末 DW 字节使能' },
            { n: 'First DW BE', b: 4, v: fbe.toString(2).padStart(4, '0'), hi: 3, lo: 0, c: C.be, d: '首 DW 字节使能' }
          ];
          var d2f = [
            { n: 'Bus', b: 8, v: '0x' + bus.toString(16).toUpperCase(), hi: 31, lo: 24, c: C.reqid, d: '总线号: ' + bus },
            { n: 'Device', b: 5, v: dev.toString(), hi: 23, lo: 19, c: C.reqid, d: '设备号: ' + dev },
            { n: 'Function', b: 3, v: fnc.toString(), hi: 18, lo: 16, c: C.reqid, d: '功能号: ' + fnc },
            { n: 'R', b: 4, v: '0', hi: 15, lo: 12, c: C.r, d: 'Reserved' },
            { n: 'Ext Reg No', b: 4, v: '0x' + er.toString(16).toUpperCase(), hi: 11, lo: 8, c: C.tc, d: '扩展寄存器号 (bit[11:8])' },
            { n: 'Reg No', b: 6, v: '0x' + rg.toString(16).toUpperCase(), hi: 7, lo: 2, c: C.tag, d: '寄存器号 (bit[7:2]) 偏移 0x' + regOffset.toString(16).toUpperCase() },
            { n: 'R', b: 2, v: '00', hi: 1, lo: 0, c: C.r, d: 'Reserved' }
          ];
          d1f.forEach(function (f) { fields.push({ idx: idx++, dw: 1, n: f.n, b: f.b, v: f.v, raw: bits(dw1, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
          d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: bits(dw2, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
          rows.push({ l: 'DW1', f: d1f }); rows.push({ l: 'DW2', f: d2f });
          return;
        }

        if (isMsg) {
          var rId = bits(dw1, 31, 16);
          var tg = bits(dw1, 15, 8);
          var mc = bits(dw1, 7, 0);
          var d1f = [
            { n: 'Requester ID', b: 16, v: ('0000' + rId.toString(16)).toUpperCase().slice(-4), hi: 31, lo: 16, c: C.reqid, d: '请求者 BDF' },
            { n: 'Tag', b: 8, v: '0x' + ('00' + tg.toString(16)).toUpperCase().slice(-2), hi: 15, lo: 8, c: C.tag, d: 'Tag' },
            { n: 'Message Code', b: 8, v: '0x' + ('00' + mc.toString(16)).toUpperCase().slice(-2), hi: 7, lo: 0, c: C.msg, d: '消息编码 (Table 2-30)' }
          ];
          var d2f = [{ n: 'Msg Data / Routing', b: 32, v: dwStr(dw2), hi: 31, lo: 0, c: C.addr, d: '消息数据或路由信息' }];
          d1f.forEach(function (f) { fields.push({ idx: idx++, dw: 1, n: f.n, b: f.b, v: f.v, raw: bits(dw1, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
          d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: dw2, c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
          rows.push({ l: 'DW1', f: d1f }); rows.push({ l: 'DW2', f: d2f });
          return;
        }

        if (isIO) {
          var rId = bits(dw1, 31, 16);
          var tg = bits(dw1, 15, 8);
          var lbe = bits(dw1, 7, 4);
          var fbe = bits(dw1, 3, 0);
          var addr = bits(dw2, 31, 2);
          var d1f = [
            { n: 'Requester ID', b: 16, v: ('0000' + rId.toString(16)).toUpperCase().slice(-4), hi: 31, lo: 16, c: C.reqid, d: '请求者 BDF' },
            { n: 'Tag', b: 8, v: '0x' + ('00' + tg.toString(16)).toUpperCase().slice(-2), hi: 15, lo: 8, c: C.tag, d: 'Tag' },
            { n: 'Last DW BE', b: 4, v: lbe.toString(2).padStart(4, '0'), hi: 7, lo: 4, c: C.be, d: '末 DW 字节使能 (I/O 强制为 0000)' },
            { n: 'First DW BE', b: 4, v: fbe.toString(2).padStart(4, '0'), hi: 3, lo: 0, c: C.be, d: '首 DW 字节使能' }
          ];
          var d2f = [
            { n: 'Address[31:2]', b: 30, v: '0x' + ('00000000' + (addr << 2).toString(16).toUpperCase()).slice(-8), hi: 31, lo: 2, c: C.addr, d: 'I/O 地址 (4B 对齐)' },
            { n: 'PH', b: 2, v: bits(dw2, 1, 0).toString(2).padStart(2, '0'), hi: 1, lo: 0, c: C.ph, d: 'Processing Hints' }
          ];
          d1f.forEach(function (f) { fields.push({ idx: idx++, dw: 1, n: f.n, b: f.b, v: f.v, raw: bits(dw1, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
          d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: bits(dw2, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
          rows.push({ l: 'DW1', f: d1f }); rows.push({ l: 'DW2', f: d2f });
          return;
        }

        // Memory / Atomic / DMWr
        var rId = bits(dw1, 31, 16);
        var tg = bits(dw1, 15, 8);
        var lbe = bits(dw1, 7, 4);
        var fbe = bits(dw1, 3, 0);
        var d1f = [
          { n: 'Requester ID', b: 16, v: ('0000' + rId.toString(16)).toUpperCase().slice(-4), hi: 31, lo: 16, c: C.reqid, d: '请求者 BDF' },
          { n: 'Tag', b: 8, v: '0x' + ('00' + tg.toString(16)).toUpperCase().slice(-2), hi: 15, lo: 8, c: C.tag, d: 'Tag (T9=' + t9 + ' T8=' + t8 + ')' },
          { n: 'Last DW BE', b: 4, v: lbe.toString(2).padStart(4, '0'), hi: 7, lo: 4, c: C.be, d: '末 DW 字节使能' },
          { n: 'First DW BE', b: 4, v: fbe.toString(2).padStart(4, '0'), hi: 3, lo: 0, c: C.be, d: '首 DW 字节使能' }
        ];
        d1f.forEach(function (f) { fields.push({ idx: idx++, dw: 1, n: f.n, b: f.b, v: f.v, raw: bits(dw1, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
        rows.push({ l: 'DW1', f: d1f });

        var is4DW = (bits(dw0, 31, 29) === 1 || bits(dw0, 31, 29) === 3);
        if (is4DW && dw.length >= 4) {
          var aH = dw[2] >>> 0;
          var aL = bits(dw[3], 31, 2);
          rows.push({ l: 'DW2', f: [{ n: 'Address[63:32]', b: 32, v: '0x' + dwStr(aH), hi: 31, lo: 0, c: C.addr, d: '64-bit 地址高32位' }] });
          rows.push({
            l: 'DW3', f: [
              { n: 'Address[31:2]', b: 30, v: '0x' + ('00000000' + ((aL << 2) >>> 0).toString(16).toUpperCase()).slice(-8), hi: 31, lo: 2, c: C.addr2, d: '64-bit 地址低30位 (完整地址)' },
              { n: 'PH', b: 2, v: bits(dw[3], 1, 0).toString(2).padStart(2, '0'), hi: 1, lo: 0, c: C.ph, d: 'Processing Hints' }
            ]
          });
          var d2f = rows[rows.length - 2].f;
          var d3f = rows[rows.length - 1].f;
          d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: bits(dw2, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
          d3f.forEach(function (f) { fields.push({ idx: idx++, dw: 3, n: f.n, b: f.b, v: f.v, raw: bits(dw[3], f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
        } else {
          var a = bits(dw2, 31, 2);
          rows.push({
            l: 'DW2', f: [
              { n: 'Address[31:2]', b: 30, v: '0x' + ('00000000' + (a << 2).toString(16).toUpperCase()).slice(-8), hi: 31, lo: 2, c: C.addr, d: '32-bit 地址 (4B 对齐)' },
              { n: 'PH', b: 2, v: bits(dw2, 1, 0).toString(2).padStart(2, '0'), hi: 1, lo: 0, c: C.ph, d: 'Processing Hints' }
            ]
          });
          var d2f = rows[rows.length - 1].f;
          d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: bits(dw2, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
        }
      }

      // ====== OHC 详细解析函数 ======
      function parseOHC(type8, nameStr, ohc, dw, startIdx, fields, rows, idxRef) {
        var idx = idxRef.value;
        var baseOff = startIdx;  // DW offset in 'dw' array where OHC begins
        var consumed = 0;
        var ohcRows = [];

        // 根据 TLP 类型决定 OHC-A 子类型
        var isMemory = (nameStr.indexOf('MRd') === 0 || nameStr.indexOf('MWr') === 0 || nameStr.indexOf('FetchAdd') === 0 || nameStr.indexOf('Swap') === 0 || nameStr.indexOf('CAS') === 0 || nameStr.indexOf('DMWr') === 0);
        var isIO = (nameStr.indexOf('IORd') === 0 || nameStr.indexOf('IOWr') === 0);
        var isCfg = (nameStr.indexOf('Cfg') === 0);
        var isCompletion = (nameStr.indexOf('Cpl') === 0);
        var isMsgID = (nameStr.indexOf('Msg (Routed by ID)') === 0 || nameStr.indexOf('MsgDToID') === 0);
        var isMsg = (nameStr.indexOf('Msg') === 0);

        var aSubType = 'A1';  // default
        if (isIO) aSubType = 'A2';
        else if (isCfg) aSubType = 'A3';
        else if (isMsgID) aSubType = 'A4';
        else if (isCompletion) aSubType = 'A5';
        // else A1 for Memory

        // 解析 OHC-A (bit 0)
        if (ohc & 1) {
          var dwA = dw[baseOff + consumed];
          if (dwA !== undefined) {
            var fbe = bits(dwA, 3, 0);
            var lbe = bits(dwA, 7, 4);
            var pasid = bits(dwA, 27, 8);  // 20 bits
            var routing = bits(dwA, 31, 28); // reserved or routing
            var fieldsA = [
              { n: 'OHC-A' + aSubType + ' First DW BE', b: 4, v: '0x' + fbe.toString(16).toUpperCase(), hi: 3, lo: 0, c: C.be, d: '首 DW 字节使能' },
              { n: 'OHC-A' + aSubType + ' Last DW BE', b: 4, v: '0x' + lbe.toString(16).toUpperCase(), hi: 7, lo: 4, c: C.be, d: '末 DW 字节使能' }
            ];
            // 对需要 PASID 的子类型显示 PASID
            if (aSubType === 'A1' || aSubType === 'A4' || aSubType === 'A5') {
              fieldsA.push({ n: 'PASID', b: 20, v: '0x' + ('00000' + pasid.toString(16).toUpperCase()).slice(-5), hi: 27, lo: 8, c: C.tag, d: 'Process Address Space ID (20-bit)' });
            }
            // 对 A4 还有 Segment? 这里简化
            fieldsA.forEach(function (f) {
              fields.push({ idx: idx++, dw: baseOff + consumed, n: f.n, b: f.b, v: f.v, raw: bits(dwA, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo });
            });
            ohcRows.push({ l: 'OHC-A (DW' + (baseOff + consumed) + ')', f: fieldsA });
            consumed++;
          }
        }

        // OHC-B (bit 1)
        if (ohc & 2) {
          var dwB = dw[baseOff + consumed];
          if (dwB !== undefined) {
            var st = bits(dwB, 15, 0);
            var ph = bits(dwB, 17, 16);
            var hv = bits(dwB, 19, 18);
            var ama = bits(dwB, 20, 20); // 假设
            var fieldsB = [
              { n: 'TPH Steering Tag', b: 16, v: '0x' + ('0000' + st.toString(16).toUpperCase()).slice(-4), hi: 15, lo: 0, c: C.tag, d: 'TPH Steering Tag (16-bit)' },
              { n: 'PH', b: 2, v: ph.toString(2).padStart(2, '0'), hi: 17, lo: 16, c: C.ph, d: 'Processing Hint: ' + ['双向', '', '', ''][ph] },
              { n: 'HV', b: 2, v: hv.toString(2).padStart(2, '0'), hi: 19, lo: 18, c: C.attr, d: 'HV[1:0] 控制 PH/ST 有效性' },
              { n: 'AMA', b: 1, v: ama.toString(), hi: 20, lo: 20, c: C.r, d: 'AMA (Application Memory Attribute?)' }
            ];
            fieldsB.forEach(function (f) {
              fields.push({ idx: idx++, dw: baseOff + consumed, n: f.n, b: f.b, v: f.v, raw: bits(dwB, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo });
            });
            ohcRows.push({ l: 'OHC-B (DW' + (baseOff + consumed) + ')', f: fieldsB });
            consumed++;
          }
        }

        // OHC-C (bit 2)
        if (ohc & 4) {
          var dwC = dw[baseOff + consumed];
          if (dwC !== undefined) {
            var streamId = bits(dwC, 15, 0);
            var reqSeg = bits(dwC, 31, 16);
            var fieldsC = [
              { n: 'IDE Stream ID', b: 16, v: '0x' + ('0000' + streamId.toString(16).toUpperCase()).slice(-4), hi: 15, lo: 0, c: C.td, d: 'IDE Stream Identifier' },
              { n: 'Requester Segment', b: 16, v: '0x' + ('0000' + reqSeg.toString(16).toUpperCase()).slice(-4), hi: 31, lo: 16, c: C.reqid, d: 'Requester Segment (用于路由)' }
            ];
            fieldsC.forEach(function (f) {
              fields.push({ idx: idx++, dw: baseOff + consumed, n: f.n, b: f.b, v: f.v, raw: bits(dwC, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo });
            });
            ohcRows.push({ l: 'OHC-C (DW' + (baseOff + consumed) + ')', f: fieldsC });
            consumed++;
          }
        }

        // OHC-E (bits 3 and 4)
        var eSize = 0;
        if (ohc & 0x18) {
          if (ohc & 0x08) eSize = 1;  // E1
          else if (ohc & 0x10) {
            // E2 or E4, 需要根据其他信息？假设 E2=2, E4=4，但这里简化，按 E2 处理
            eSize = 2;
          }
          // 更精细：如果 OHC bit4=1 且 bit3=0 则为 E2，若 bit4=1 且 bit3=1 则为 E4，但这里我们尽可能
          if ((ohc & 0x18) == 0x10) eSize = 2;
          else if ((ohc & 0x18) == 0x18) eSize = 4;
          else if ((ohc & 0x08) == 0x08) eSize = 1;
        }

        if (eSize > 0) {
          for (var e = 0; e < eSize; e++) {
            var dwE = dw[baseOff + consumed + e];
            if (dwE !== undefined) {
              var eType = (eSize == 1) ? 'E1' : (eSize == 2) ? 'E2' : 'E4';
              var fieldsE = [
                { n: 'OHC-' + eType + ' DW' + e, b: 32, v: '0x' + dwStr(dwE), hi: 31, lo: 0, c: C.ohc, d: 'End-End TLP Prefix 数据 (替代 EPrfx)' }
              ];
              // 可以进一步解析，但简化
              fieldsE.forEach(function (f) {
                fields.push({ idx: idx++, dw: baseOff + consumed + e, n: f.n, b: f.b, v: f.v, raw: bits(dwE, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo });
              });
              ohcRows.push({ l: 'OHC-' + eType + ' (DW' + (baseOff + consumed + e) + ')', f: fieldsE });
            }
          }
          consumed += eSize;
        }

        idxRef.value = idx;
        return ohcRows;
      }

      // ====== Flit Mode ======
      function doDecodeFlit(dw, bytes) {
        var dw0 = dw[0];
        var type8 = bits(dw0, 31, 24);
        var tc = bits(dw0, 23, 21);
        var ohc = bits(dw0, 20, 16);
        var ts = bits(dw0, 15, 13);
        var attr = bits(dw0, 12, 10);
        var lenH = bits(dw0, 9, 8);
        var lenL = bits(dw0, 7, 0);
        var len = (lenH << 8) | lenL;
        var lenDW = len === 0 ? 1024 : len;

        var typeHex = ('00' + type8.toString(16).toUpperCase()).slice(-2);
        var p = FLIT_DB[type8];
        var isUnsupported = (p === undefined);
        var nameStr, hdrDW, hasData, desc;
        if (isUnsupported) {
          nameStr = 'Unsupported Flit Type (0x' + typeHex + ')';
          hdrDW = 3;
          hasData = false;
          desc = '⚠️ 此 Flit Type 在 PCIe 6.0 Table 2-5 中为 Reserved';
        } else {
          nameStr = p.n;
          hdrDW = p.h;
          hasData = p.d;
          desc = p.desc;
        }

        var rows = [], fields = [], idx = 0;

        var tsDesc = ['无 Trailer', '1DW ECRC', '1DW Reserved', '2DW Reserved', '2DW Reserved', '3DW IDE MAC', '4DW IDE+PCRC', '5DW Reserved'];
        var ohcParts = [];
        if (ohc & 1) ohcParts.push('OHC-A');
        if (ohc & 2) ohcParts.push('OHC-B');
        if (ohc & 4) ohcParts.push('OHC-C');
        if (ohc & 8) ohcParts.push('OHC-E1');
        if (ohc & 16) ohcParts.push('OHC-E2/E4');

        var dw0f = [
          { n: 'Type', b: 8, v: '0x' + typeHex + ' → ' + nameStr, hi: 31, lo: 24, c: C.type, d: 'Flit 8-bit 类型编码。' + desc },
          { n: 'TC', b: 3, v: 'TC' + tc, hi: 23, lo: 21, c: C.tc, d: 'Traffic Class: TC' + tc + ' (3-bit)' },
          { n: 'OHC', b: 5, v: ('00000' + ohc.toString(2)).slice(-5), hi: 20, lo: 16, c: C.ohc, d: 'OHC 存在位图 [4:0]。' + (ohcParts.length ? ohcParts.join(' | ') : '无 OHC') },
          { n: 'TS', b: 3, v: ts.toString() + ' (' + tsDesc[ts] + ')', hi: 15, lo: 13, c: C.td, d: 'Trailer Size: ' + tsDesc[ts] + ' (替代 Non-Flit TD)' },
          { n: 'Attr[2:0]', b: 3, v: ('000' + attr.toString(2)).slice(-3), hi: 12, lo: 10, c: C.attr, d: 'Attr[2]=IDO, Attr[1]=RO, Attr[0]=NS' },
          { n: 'Length', b: 10, v: lenDW + ' DW', hi: 9, lo: 0, c: C.len, d: '数据负载: ' + lenDW + ' DW (' + (lenDW * 4) + ' B)' + (len === 0 ? ' (编码0=1024DW)' : '') }
        ];
        dw0f.forEach(function (f) { fields.push({ idx: idx++, dw: 0, n: f.n, b: f.b, v: f.v, raw: bits(dw0, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
        rows.push({ l: 'DW0', f: dw0f });

        if (!isUnsupported) {
          // DW1: Requester ID + Tag/Control
          if (dw.length >= 2) {
            var dw1 = dw[1];
            var reqId = bits(dw1, 31, 16);
            var tagCtrl = bits(dw1, 15, 0);
            var d1f = [{ n: 'Requester ID', b: 16, v: ('0000' + reqId.toString(16)).toUpperCase().slice(-4), hi: 31, lo: 16, c: C.reqid, d: '请求者 BDF (Bus:Device:Function)' }];
            if (hdrDW >= 3) {
              var tagVal = bits(dw1, 13, 0);
              d1f.push({
                n: 'Tag/Control', b: 16, v: '0x' + ('0000' + tagCtrl.toString(16).toUpperCase()).slice(-4), hi: 15, lo: 0, c: C.tag,
                d: 'Flit Tag(14-bit) + 控制位。Tag=0x' + ('0000' + tagVal.toString(16).toUpperCase()).slice(-4) + ' (14-bit扩展)'
              });
            } else {
              d1f.push({ n: 'Tag/Control', b: 16, v: '0x' + ('0000' + tagCtrl.toString(16).toUpperCase()).slice(-4), hi: 15, lo: 0, c: C.r, d: 'NOP/前缀类型: 控制信息' });
            }
            d1f.forEach(function (f) { fields.push({ idx: idx++, dw: 1, n: f.n, b: f.b, v: f.v, raw: bits(dw1, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
            rows.push({ l: 'DW1', f: d1f });
          }

          // DW2/DW3: Address / Routing / Config (仅当 hdrDW>=3)
          if (dw.length >= 3 && hdrDW >= 3) {
            var dw2 = dw[2];
            if (hdrDW === 4 && dw.length >= 4) {
              var dw3 = dw[3];
              rows.push({ l: 'DW2', f: [{ n: 'Address[63:32]', b: 32, v: '0x' + dwStr(dw2), hi: 31, lo: 0, c: C.addr, d: '64-bit 地址高32位' }] });
              rows.push({
                l: 'DW3', f: [
                  { n: 'Address[31:2]', b: 30, v: '0x' + ('00000000' + ((bits(dw3, 31, 2) << 2) >>> 0).toString(16).toUpperCase()).slice(-8), hi: 31, lo: 2, c: C.addr2, d: '64-bit 地址低30位' },
                  { n: 'R', b: 2, v: bits(dw3, 1, 0).toString(2).padStart(2, '0'), hi: 1, lo: 0, c: C.r, d: 'Reserved' }
                ]
              });
              var d2f = rows[rows.length - 2].f;
              var d3f = rows[rows.length - 1].f;
              d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: bits(dw2, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
              d3f.forEach(function (f) { fields.push({ idx: idx++, dw: 3, n: f.n, b: f.b, v: f.v, raw: bits(dw3, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
            } else if (hdrDW === 3) {
              // 3DW header: 根据类型解析
              if (type8 === 0x04 || type8 === 0x05 || type8 === 0x44 || type8 === 0x45) {
                // 配置
                var bus = bits(dw2, 31, 24);
                var dev = bits(dw2, 23, 19);
                var fnc = bits(dw2, 18, 16);
                var er = bits(dw2, 11, 8);
                var rg = bits(dw2, 7, 2);
                var d2f = [
                  { n: 'Bus', b: 8, v: '0x' + bus.toString(16).toUpperCase(), hi: 31, lo: 24, c: C.reqid, d: '总线: ' + bus },
                  { n: 'Device', b: 5, v: dev.toString(), hi: 23, lo: 19, c: C.reqid, d: '设备: ' + dev },
                  { n: 'Function', b: 3, v: fnc.toString(), hi: 18, lo: 16, c: C.reqid, d: '功能: ' + fnc },
                  { n: 'R', b: 4, v: '0', hi: 15, lo: 12, c: C.r, d: 'Reserved' },
                  { n: 'ExtRegNo', b: 4, v: '0x' + er.toString(16).toUpperCase(), hi: 11, lo: 8, c: C.tc, d: '扩展寄存器号' },
                  { n: 'RegNo', b: 6, v: '0x' + rg.toString(16).toUpperCase(), hi: 7, lo: 2, c: C.tag, d: '寄存器号 偏移 0x' + (((er << 6) | rg) << 2).toString(16).toUpperCase() },
                  { n: 'R', b: 2, v: '00', hi: 1, lo: 0, c: C.r, d: 'Reserved' }
                ];
                d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: bits(dw2, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
                rows.push({ l: 'DW2', f: d2f });
              } else if (type8 === 0x30 || type8 === 0x32 || type8 === 0x33 || type8 === 0x34 || type8 === 0x35 || type8 === 0x36 || type8 === 0x37 ||
                type8 === 0x5B || type8 === 0x70 || type8 === 0x72 || type8 === 0x73 || type8 === 0x74 || type8 === 0x75 || type8 === 0x76 || type8 === 0x77) {
                // 消息类型
                var d2f = [{ n: 'Msg Routing/Data', b: 32, v: '0x' + dwStr(dw2), hi: 31, lo: 0, c: C.msg, d: '消息路由或数据' }];
                d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: dw2, c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
                rows.push({ l: 'DW2', f: d2f });
              } else if (type8 === 0x02 || type8 === 0x42) {
                // I/O
                var addr = bits(dw2, 31, 2);
                var d2f = [
                  { n: 'Address[31:2]', b: 30, v: '0x' + ('00000000' + (addr << 2).toString(16).toUpperCase()).slice(-8), hi: 31, lo: 2, c: C.addr, d: 'I/O 地址' },
                  { n: 'R', b: 2, v: bits(dw2, 1, 0).toString(2).padStart(2, '0'), hi: 1, lo: 0, c: C.r, d: 'Reserved' }
                ];
                d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: bits(dw2, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
                rows.push({ l: 'DW2', f: d2f });
              } else {
                // Memory / Atomic: 地址
                var addr = bits(dw2, 31, 2);
                var d2f = [
                  { n: 'Address[31:2]', b: 30, v: '0x' + ('00000000' + (addr << 2).toString(16).toUpperCase()).slice(-8), hi: 31, lo: 2, c: C.addr, d: '32-bit 地址 (4B对齐)' },
                  { n: 'R', b: 2, v: bits(dw2, 1, 0).toString(2).padStart(2, '0'), hi: 1, lo: 0, c: C.r, d: 'Reserved' }
                ];
                d2f.forEach(function (f) { fields.push({ idx: idx++, dw: 2, n: f.n, b: f.b, v: f.v, raw: bits(dw2, f.hi, f.lo), c: f.c, d: f.d, hi: f.hi, lo: f.lo }); });
                rows.push({ l: 'DW2', f: d2f });
              }
            }
          }

          // ====== 解析 OHC ======
          if (ohc > 0) {
            var ohcStart = hdrDW;  // OHC 从第 hdrDW 个 DW 开始
            var idxRef = { value: idx };
            var ohcRows = parseOHC(type8, nameStr, ohc, dw, ohcStart, fields, rows, idxRef);
            idx = idxRef.value;
            // 将 ohcRows 添加到 rows 中
            ohcRows.forEach(function (row) { rows.push(row); });
          }
        }

        renderAll(nameStr, 'Flit Mode Type=0x' + typeHex, hasData, lenDW, hdrDW, dw, rows, fields, bytes, true, isUnsupported);
      }

      // ====== 渲染 ======
      function renderAll(name, fDesc, hasData, lenDW, hdrDW, dw, rows, fields, bytes, flit, unsupported) {
        res.classList.add('on');

        var payloadB = hasData && bytes.length > hdrDW * 4 ? bytes.length - hdrDW * 4 : 0;
        var rawHex = dw.map(dwStr).join(' ');
        var sumEl = document.getElementById('summaryBox');
        sumEl.className = 'summary on';

        var keyFields = {};
        fields.forEach(function (f) { keyFields[f.n] = f; });

        var addrStr = '';
        if (keyFields['Address[63:32]']) {
          addrStr = keyFields['Address[63:32]'].v + ' ' + (keyFields['Address[31:2]'] ? keyFields['Address[31:2]'].v : '');
        } else if (keyFields['Address[31:2]']) {
          addrStr = keyFields['Address[31:2]'].v;
        } else if (keyFields['Lower Address']) {
          addrStr = keyFields['Lower Address'].v;
        }

        var reqStr = keyFields['Requester ID'] ? keyFields['Requester ID'].v : (keyFields['Completer ID'] ? keyFields['Completer ID'].v : '');
        var tagStr = keyFields['Tag'] ? keyFields['Tag'].v : '';
        var lenStr = keyFields['Length'] ? keyFields['Length'].v : '';
        var statusStr = keyFields['Status'] ? keyFields['Status'].v : '';
        var msgCodeStr = keyFields['Message Code'] ? keyFields['Message Code'].v : '';
        var busStr = keyFields['Bus'] ? 'B:' + keyFields['Bus'].v + ' D:' + keyFields['Device'].v + ' F:' + keyFields['Function'].v : '';
        var typeStr = keyFields['Type'] ? keyFields['Type'].v : '';
        var modeLabel = flit ? 'FLIT' : 'Non-FLIT';

        var summaryHTML = '<div class="top">';
        summaryHTML += '<div class="name">' + name + ' <span class="mode">' + modeLabel + '</span></div>';
        summaryHTML += '<div class="badges">';
        summaryHTML += '<span class="badge">' + (hasData ? '📦 有数据' : '📄 无数据') + '</span>';
        summaryHTML += '<span class="badge">Header: <b>' + hdrDW + ' DW</b></span>';
        if (lenStr) summaryHTML += '<span class="badge">Payload: <b>' + lenStr + '</b></span>';
        if (payloadB > 0) summaryHTML += '<span class="badge" style="background:#dc2626">Data: <b>' + payloadB + ' B</b></span>';
        if (unsupported) summaryHTML += '<span class="badge" style="background:#dc2626;color:#fff">⚠️ 不支持的 TLP 类型</span>';
        summaryHTML += '</div></div><div class="grid">';

        var gridItems = [];
        if (flit) {
          gridItems.push({ l: 'Flit Type', v: typeStr });
          gridItems.push({ l: 'TC', v: keyFields['TC'] ? keyFields['TC'].v : '' });
          gridItems.push({ l: 'OHC', v: keyFields['OHC'] ? keyFields['OHC'].v : '' });
          gridItems.push({ l: 'TS', v: keyFields['TS'] ? keyFields['TS'].v : '' });
        } else {
          gridItems.push({ l: 'Fmt', v: fields.length > 0 ? fields[0].v : '' });
          gridItems.push({ l: 'Type', v: typeStr });
        }
        if (tagStr) gridItems.push({ l: 'Tag', v: tagStr });
        if (reqStr) gridItems.push({ l: 'ReqID', v: reqStr });
        if (statusStr) gridItems.push({ l: 'Status', v: statusStr });
        if (msgCodeStr) gridItems.push({ l: 'Msg Code', v: msgCodeStr });
        if (busStr) gridItems.push({ l: 'Config', v: busStr });
        if (lenStr) gridItems.push({ l: 'Length', v: lenStr });
        if (addrStr) gridItems.push({ l: 'Address', v: addrStr });

        gridItems.forEach(function (item) {
          summaryHTML += '<div class="item"><div class="lbl">' + item.l + '</div><div class="val">' + item.v + '</div></div>';
        });
        summaryHTML += '</div><div class="raw">RAW: ' + rawHex + '</div>';

        // 描述
        var descLines = [];
        if (unsupported) {
          descLines.push('⚠️ 此 TLP 类型在 PCIe 6.0 Table 2-5 中为 Reserved，请检查数据是否正确。');
        } else {
          if (flit) {
            descLines.push('⚡ FLIT 模式 · 类型: ' + name);
            descLines.push('• 头长: ' + hdrDW + ' DW' + (hasData ? ' · 数据负载: ' + lenDW + ' DW (' + (lenDW * 4) + ' B)' : ' · 无数据负载'));
            if (addrStr) descLines.push('• 目标地址: ' + addrStr);
            if (reqStr) descLines.push('• 请求者 ID: ' + reqStr);
            if (addrStr && name.indexOf('Write') >= 0) descLines.push('• 操作: 写入地址 ' + addrStr + '，长度 ' + lenDW + ' DW');
            if (addrStr && name.indexOf('Read') >= 0) descLines.push('• 操作: 读取地址 ' + addrStr + '，请求 ' + lenDW + ' DW');
          } else {
            var desc = '';
            if (name.indexOf('MRd') === 0) desc = '读存储器地址 ' + addrStr + '，请求读取 ' + lenDW + ' DW (' + (lenDW * 4) + ' B)';
            else if (name.indexOf('MWr') === 0) desc = '写存储器地址 ' + addrStr + '，数据长度 ' + lenDW + ' DW (' + (lenDW * 4) + ' B)';
            else if (name.indexOf('CfgRd') === 0) {
              var busV = keyFields['Bus'] ? keyFields['Bus'].v : '';
              var devV = keyFields['Device'] ? keyFields['Device'].v : '';
              var fnV = keyFields['Function'] ? keyFields['Function'].v : '';
              var regNum = keyFields['Register No'] ? parseInt(keyFields['Register No'].raw) : -1;
              desc = '读取配置空间 B:' + busV + ' D:' + devV + ' F:' + fnV + '，寄存器偏移 0x' + (regNum >= 0 ? (regNum << 2).toString(16).toUpperCase() : '??');
            } else if (name.indexOf('CfgWr') === 0) {
              var busV = keyFields['Bus'] ? keyFields['Bus'].v : '';
              var devV = keyFields['Device'] ? keyFields['Device'].v : '';
              var fnV = keyFields['Function'] ? keyFields['Function'].v : '';
              var regNum = keyFields['Register No'] ? parseInt(keyFields['Register No'].raw) : -1;
              desc = '写入配置空间 B:' + busV + ' D:' + devV + ' F:' + fnV + '，寄存器偏移 0x' + (regNum >= 0 ? (regNum << 2).toString(16).toUpperCase() : '??');
            } else if (name.indexOf('Cpl') === 0) desc = '完成包' + (hasData ? '，返回数据长度 ' + lenDW + ' DW' : '') + (statusStr ? '，状态: ' + statusStr : '');
            else if (name.indexOf('Msg') === 0) desc = '消息 ' + (msgCodeStr ? '编码: ' + msgCodeStr : '') + ' 路由到目标';
            else if (name.indexOf('IORd') === 0) desc = '读 I/O 端口地址 ' + addrStr;
            else if (name.indexOf('IOWr') === 0) desc = '写 I/O 端口地址 ' + addrStr;
            else if (name.indexOf('FetchAdd') === 0 || name.indexOf('Swap') === 0 || name.indexOf('CAS') === 0) desc = '原子操作 ' + name + ' 地址 ' + addrStr;
            else desc = name + ' TLP';
            descLines.push('📦 ' + desc);
            var epVal = keyFields['EP'] ? keyFields['EP'].v : '';
            if (epVal === '1') descLines.push('⚠️ 数据中毒 (Poisoned)');
            var tdVal = keyFields['TD'] ? keyFields['TD'].v : '';
            if (tdVal === '1') descLines.push('含 ECRC');
          }
        }
        summaryHTML += '<div style="margin-top:10px;padding:10px 12px;background:rgba(255,255,255,.07);border-radius:6px;font-size:13px;line-height:1.6;color:rgba(255,255,255,.9)">';
        descLines.forEach(function (l) { if (l) summaryHTML += '<div>' + l + '</div>'; });
        summaryHTML += '</div>';
        sumEl.innerHTML = summaryHTML;

        // Diagram
        var html = '<div class="dia-t">📊 TLP 帧结构 <span class="s">(MSB左→LSB右, Byte0先传)</span></div>';
        html += '<div style="display:flex;margin-bottom:2px"><div style="width:70px;min-width:70px"></div><div style="display:flex;flex:1">';
        for (var b = 0; b < 4; b++) html += '<div style="flex:1;text-align:center;font-size:10px;color:#888;font-weight:600;padding:1px 0;border-bottom:2px solid #000">Byte ' + b + '</div>';
        html += '</div></div>';
        html += '<div style="display:flex;margin-bottom:4px"><div style="width:70px;min-width:70px"></div><div style="display:flex;flex:1">';
        for (var b = 0; b < 4; b++) for (var i = 7; i >= 0; i--) html += '<div style="flex:1;text-align:center;font-size:8px;color:#bbb;font-family:Consolas,monospace">' + i + '</div>';
        html += '</div></div>';

        rows.forEach(function (row) {
          html += '<div class="dr"><div class="dl">' + row.l + '</div><div class="fd">';
          var bitPos = 31;
          row.f.forEach(function (f) {
            var dk = f.c === '#95a5a6' || f.c === '#bdc3c7' || f.c === '#1abc9c' || f.c === '#2ecc71';
            var dn = f.n.length > 12 ? f.n.substr(0, 10) + '…' : f.n;
            html += '<div class="fb' + (dk ? ' dk' : '') + '" style="flex:' + f.b + ' 0 0;background:' + f.c + '" onclick="highlightField(\'' + f.n + '\')">';
            html += '<span class="fn">' + dn + '</span>';
            html += '<span class="fv">' + f.v + '</span></div>';
            bitPos -= f.b;
            if (bitPos % 8 === 0 && bitPos > 0) {
              html += '<div style="width:2px;flex-shrink:0;background:rgba(0,0,0,.08);border-radius:1px"></div>';
            }
          });
          html += '</div></div>';
        });

        html += '<div class="lg">';
        [['#2980b9', 'Fmt'], ['#1abc9c', 'Type'], ['#9b59b6', 'Tag'], ['#c0392b', 'TC'],
        ['#2ecc71', 'Attr'], ['#f39c12', 'ReqID'], ['#34495e', 'Length'], ['#3498db', 'AT'],
        ['#2c3e50', 'Address'], ['#8e44ad', 'TH'], ['#16a085', 'TD'], ['#e74c3c', 'EP']]
          .forEach(function (x) { html += '<div><span class="sw" style="background:' + x[0] + '"></span>' + x[1] + '</div>'; });
        html += '</div>';
        document.getElementById('diagram').innerHTML = html;

        // Table
        var tb = document.getElementById('fieldBody');
        tb.innerHTML = '';
        fields.forEach(function (f) {
          var bw = Math.ceil(f.b / 4);
          var rh = '0x' + ('00000000' + ((f.raw >>> 0).toString(16).toUpperCase())).slice(-Math.max(bw, 1));
          tb.innerHTML += '<tr><td style="color:#8899b4;width:28px">' + f.idx + '</td>' +
            '<td class="n"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + f.c + ';vertical-align:middle;margin-right:4px"></span>' + f.n + '</td>' +
            '<td class="v" style="color:#8899b4">' + f.b + ' bit</td>' +
            '<td class="v" style="color:#8899b4">DW' + f.dw + ' [' + f.hi + ':' + f.lo + ']</td>' +
            '<td class="v">' + rh + '</td><td style="font-family:inherit;color:#374151;font-size:13px">' + f.d + '</td></tr>';
        });

        res.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      // ====== Setup ======
      btn.onclick = doDecode;
      clr.onclick = function () { inp.value = ''; err.style.display = 'none'; res.classList.remove('on'); inp.focus(); };
      inp.onkeydown = function (e) { if (e.key === 'Enter') doDecode(); };

      function loadExamples(flit) {
        exEl.innerHTML = '';
        var list = flit ? FLIT_EXAMPLES : EXAMPLES;
        list.forEach(function (ex) {
          var s = document.createElement('span');
          s.textContent = ex;
          s.onclick = function () { inp.value = ex; doDecode(); };
          exEl.appendChild(s);
        });
      }
      loadExamples(false);

      updHistUI();
      (function autoDecode() {
        var list = isFlitMode() ? FLIT_EXAMPLES : EXAMPLES;
        if (list.length > 0) { inp.value = list[0]; doDecode(); }
      })();

      window.addEventListener('load', function () { window.scrollTo(0, 0); });
    })();

    function highlightField(name) {
      var els = document.querySelectorAll('.fb');
      els.forEach(function (e) { e.style.outline = ''; });
      var found = false;
      els.forEach(function (e) {
        if (e.textContent.indexOf(name) >= 0 && !found) {
          e.style.outline = '2px solid #000';
          e.style.outlineOffset = '1px';
          found = true;
        }
      });
      var rows = document.querySelectorAll('#fieldBody tr');
      rows.forEach(function (r) {
        if (r.textContent.indexOf(name) >= 0) {
          r.scrollIntoView({ behavior: 'smooth', block: 'center' });
          r.style.background = '#fff9c4';
          setTimeout(function () { r.style.background = ''; }, 1500);
        }
      });
    }
  </script>
  <script src="./../UI/particles.js"></script>
</body>

</html>
