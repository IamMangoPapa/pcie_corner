<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCIe LTSSM 状态跳转图</title>
  <style>
    /* ===== 全局：高级科技感浅色主题 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', 'PingFang SC', system-ui, -apple-system, sans-serif;
      background: #e6ecf6;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(26, 86, 219, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 90% 70%, rgba(124, 58, 237, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(0, 180, 255, 0.02) 0%, transparent 70%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
    }

    /* 细微网格纹理（科技感） */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(26, 86, 219, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 86, 219, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== 主容器 ===== */
    .app {
      max-width: 1560px;
      width: 100%;
      background: rgba(255, 255, 255, 0.60);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 1px solid rgba(26, 86, 219, 0.15);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.04),
        0 10px 30px rgba(0, 0, 0, 0.02),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      overflow: hidden;
      padding: 18px 24px 14px;
      position: relative;
      z-index: 1;
    }
    .app::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -10%;
      width: 60%;
      height: 70%;
      background: radial-gradient(circle at 70% 30%, rgba(26, 86, 219, 0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .app > * {
      position: relative;
      z-index: 1;
    }

    /* ===== 头部 ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(26, 86, 219, 0.08);
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #1a56db, #7c3aed, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(26, 86, 219, 0.08);
    }

    /* ===== 三栏布局（调整宽度比例） ===== */
    .main-layout {
      display: flex;
      gap: 14px;
      height: 72vh;
      min-height: 340px;
    }

    .left-panel,
    .mid-panel,
    .right-panel {
      background: rgba(255, 255, 255, 0.50);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      border: 1px solid rgba(26, 86, 219, 0.10);
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.02),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      padding: 14px 12px 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    /* 面板科技网格 */
    .left-panel::after,
    .mid-panel::after,
    .right-panel::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle at 20% 30%, rgba(26, 86, 219, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }
    .left-panel > *,
    .mid-panel > *,
    .right-panel > * {
      position: relative;
      z-index: 1;
    }
    /* 调整宽度：左35%，中35%，右30% */
    .left-panel {
      width: 39%;
    }
    .mid-panel {
      width: 39%;
    }
    .right-panel {
      width: 22%;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 800;
      color: #1a2332;
      padding: 0 2px 8px;
      flex-shrink: 0;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, #1a2332, #3b4a6a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .panel-title small {
      font-weight: 400;
      color: #5a7a9a;
      font-size: 13px;
      margin-left: 8px;
      -webkit-text-fill-color: #5a7a9a;
    }

    /* ===== SVG 容器 ===== */
    .svg-wrap {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
      border-radius: 14px;
    }
    .svg-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* ===== 主状态节点 ===== */
    .state-node {
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
      transform-box: fill-box;
      transform-origin: center;
      cursor: pointer;
    }
    .state-node:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 0 18px rgba(26, 86, 219, 0.20));
    }
    .state-node.active {
      transform: scale(1.25);
      filter: drop-shadow(0 0 0 4px rgba(26, 86, 219, 0.15)) drop-shadow(0 0 30px rgba(26, 86, 219, 0.10));
    }
    .state-node.playing ellipse {
      fill: #ffd700 !important;
      stroke: #e6a800 !important;
      stroke-width: 3 !important;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5)) !important;
      transition: fill 0.3s;
    }
    .state-node.playing .state-label {
      fill: #1a2332 !important;
    }

    /* ===== 主状态标签 ===== */
    .state-label {
      font-size: 24px;
      font-weight: 900;
      dominant-baseline: central;
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      letter-spacing: 0.3px;
    }
    .state-label.dark {
      fill: #1a2332;
    }
    .state-label.light {
      fill: #fff;
    }

    /* ===== 主箭头 ===== */
    .tx-arrow {
      stroke: #4a8aba;
      stroke-width: 2.5;
      fill: none;
      marker-end: url(#ahd);
      transition: stroke 0.3s, stroke-width 0.3s, filter 0.3s;
      cursor: pointer;
    }
    .tx-arrow.highlight {
      stroke: #1a5a8a;
      stroke-width: 3.5;
      filter: drop-shadow(0 0 10px rgba(26, 90, 138, 0.35));
    }
    .tx-arrow.dim {
      opacity: 0.15;
    }

    /* ===== 子状态图容器 ===== */
    .sub-graph {
      background: transparent;
      border-radius: 14px;
      padding: 2px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
    }
    .sub-graph svg {
      width: 100%;
      height: auto;
      max-height: 540px;
      overflow: visible;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(2px);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
    }

    /* ===== 子状态节点 ===== */
    .sub-node-internal,
    .sub-node-external {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s;
      transform-box: fill-box;
      transform-origin: center;
      cursor: pointer;
    }
    .sub-node-internal:hover,
    .sub-node-external:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 0 14px rgba(26, 86, 219, 0.15));
    }
    .sub-node-external {
      opacity: 0.80;
    }
    .sub-node-external:hover {
      opacity: 1;
    }
    .sub-hl {
      transform: scale(1.10) !important;
      filter: drop-shadow(0 0 20px rgba(26, 86, 219, 0.20)) !important;
    }
    .sub-node-internal.playing ellipse {
      fill: #ffd700 !important;
      stroke: #e6a800 !important;
      stroke-width: 2.5 !important;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4)) !important;
    }
    .sub-node-internal.playing text {
      fill: #1a2332 !important;
    }

    /* ===== 子箭头 ===== */
    .sub-arrow {
      cursor: pointer;
      stroke-width: 2.2;
      stroke: #4a8aba;
      transition: stroke 0.3s, stroke-width 0.3s, opacity 0.3s, filter 0.3s;
    }
    .sub-arrow-hl {
      stroke: #1a5a8a !important;
      stroke-width: 3 !important;
      filter: drop-shadow(0 0 8px rgba(26, 90, 138, 0.30));
    }
    .sub-arrow-dim {
      opacity: 0.10 !important;
    }

    /* ===== 子状态文本 ===== */
    .sub-label {
      dominant-baseline: central;
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      font-weight: 700;
    }

    /* ===== 底部释义 ===== */
    .bottom-desc {
      height: 7vh;
      min-height: 48px;
      max-height: 100px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 18px;
      border: 1px solid rgba(26, 86, 219, 0.08);
      padding: 8px 20px;
      margin-top: 12px;
      font-size: 18px;
      line-height: 1.7;
      color: #1a2332;
      overflow-y: auto;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    .bottom-desc .dl {
      font-weight: 800;
      color: #1a3a6a;
      font-size: 17px;
      margin-right: 6px;
    }

    /* ===== 右侧轨迹面板 ===== */
    .pt-item {
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      white-space: nowrap;
      flex-shrink: 0;
      box-sizing: border-box;
      margin: 1px 0;
      gap: 6px;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .pt-item.done {
      color: #3a5a7a;
      background: rgba(200, 215, 235, 0.4);
      border-left: 3px solid #4a7aaa;
    }
    .pt-item.current {
      color: #fff;
      background: linear-gradient(135deg, #1a56db, #3b82f6);
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(26, 86, 219, 0.30);
      border-left: 3px solid #8ab8ff;
    }
    .pt-gen {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 8px;
      border-radius: 12px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.25);
      color: #1a2332;
    }

    /* ===== 选择框、按钮统一风格 ===== */
    select,
    button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #3b82f6;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 24px;
      padding: 4px 16px;
      color: #1a2332;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      outline: none;
    }
    select:hover,
    button:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: #1a56db;
      box-shadow: 0 0 0 2px rgba(26, 86, 219, 0.10);
    }
    select:focus,
    button:focus {
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.15);
    }
    #playBtn {
      background: linear-gradient(135deg, #1a56db, #3b82f6);
      color: #fff;
      border: none;
      box-shadow: 0 4px 16px rgba(26, 86, 219, 0.25);
      padding: 4px 18px;
      font-weight: 800;
    }
    #playBtn:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 24px rgba(26, 86, 219, 0.35);
      border-color: transparent;
    }

    /* ===== 复制和清空按钮增强可见性 ===== */
    #traceExportBtn,
    #traceClearBtn {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(26, 86, 219, 0.15);
      color: #1a56db;
      font-weight: 700;
      padding: 4px 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      border-radius: 20px;
    }
    #traceExportBtn:hover,
    #traceClearBtn:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: #1a56db;
      box-shadow: 0 0 0 2px rgba(26, 86, 219, 0.10);
    }

    /* ===== 右侧控制条（允许换行） ===== */
    .right-panel .control-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #1a3a5a;
      flex-shrink: 0;
      padding: 1px 0 4px;
    }
    .right-panel .control-bar select,
    .right-panel .control-bar button {
      flex-shrink: 0;
    }
    .right-panel .control-bar .spacer {
      flex: 1;
      min-width: 4px;
    }

    /* ===== 轨迹容器 ===== */
    .right-panel .pt-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: rgba(255, 255, 255, 0.30);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      border: 1px solid rgba(26, 86, 219, 0.06);
      margin: 2px 0 4px;
      overflow: hidden;
      padding: 4px 0;
    }
    #playTrace {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 2px 4px;
      scroll-behavior: smooth;
    }
    #playTrace::-webkit-scrollbar {
      width: 4px;
    }
    #playTrace::-webkit-scrollbar-track {
      background: transparent;
    }
    #playTrace::-webkit-scrollbar-thumb {
      background: #b0c4d8;
      border-radius: 10px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 1100px) {
      .main-layout {
        flex-direction: column;
        height: auto;
      }
      .left-panel,
      .mid-panel,
      .right-panel {
        width: 100% !important;
        height: 380px;
        flex-shrink: 0;
      }
      .right-panel {
        height: auto;
        min-height: 200px;
      }
    }
    @media (max-width: 720px) {
      body {
        padding: 12px;
      }
      .app {
        padding: 14px;
        border-radius: 24px;
      }
      .header h1 {
        font-size: 22px;
      }
      .panel-title {
        font-size: 15px;
      }
      .state-label {
        font-size: 20px;
      }
      .bottom-desc {
        font-size: 13px;
      }
      .left-panel,
      .mid-panel {
        height: 300px;
      }
      .right-panel {
        min-height: 160px;
      }
      .right-panel .control-bar {
        gap: 4px;
      }
      .right-panel .control-bar select,
      .right-panel .control-bar button {
        font-size: 11px;
        padding: 2px 10px;
      }
    }

    /* ===== 标记箭头颜色 ===== */
    #ahd path {
      fill: #4a8aba;
    }
    #ahdHl path {
      fill: #1a5a8a;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <h1>PCIe LTSSM 状态跳转图</h1>
    </div>
    <div class="main-layout">
      <!-- 左：主状态图 35% -->
      <div class="left-panel">
        <div class="panel-title">主状态转移图</div>
        <div class="svg-wrap" id="mainSvgWrap">
          <svg id="mainSvg" viewBox="0 0 820 730" preserveAspectRatio="xMidYMid meet">
            <defs>
              <marker id="ahd" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
                <path d="M0,0 L9,3.5 L0,7 L3,3.5 Z" />
              </marker>
              <marker id="ahdHl" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
                <path d="M0,0 L11,4.5 L0,9 L3.5,4.5 Z" />
              </marker>
              <filter id="shSub">
                <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08" />
              </filter>
            </defs>
            <rect x="4" y="4" width="812" height="722" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
            <g transform="translate(-23,44) translate(433,321) scale(1.3) translate(-433,-321)">
              <g id="arrowsGroup"></g>
              <g id="nodesGroup"></g>
            </g>
          </svg>
        </div>
      </div>
      <!-- 中：子状态图 35% -->
      <div class="mid-panel">
        <div class="panel-title">子状态转移图 <small id="subTitleExtra">点击主状态</small></div>
        <div class="sub-graph" id="subGraph">
          <div style="color:#6a8aaa;font-size:13px;text-align:center;padding:20px;">🔍 点击左侧主状态</div>
        </div>
      </div>
      <!-- 右：状态轨迹 30% -->
      <div class="right-panel">
        <div class="panel-title" style="padding-bottom:2px">状态轨迹</div>
        <div class="control-bar">
          <select id="modeSelectSvg">
            <option value="Gen1" selected>Gen1</option>
            <option value="Gen2">Gen2</option>
            <option value="Gen3">Gen3</option>
            <option value="Gen4">Gen4</option>
            <option value="Gen5">Gen5</option>
          </select>
          <select id="eqModeSelect">
            <option value="full">Full Eq</option>
            <option value="noeq">NoEq</option>
            <option value="bypass">Bypass</option>
          </select>
          <button id="playBtn">▶ 播放</button>
          <span class="spacer"></span>
          <button id="traceExportBtn">复制</button>
          <button id="traceClearBtn">清空</button>
        </div>
        <div class="pt-container">
          <div id="playTrace"><span style="color:#8a9aaa;font-size:13px;font-weight:600;">就绪</span></div>
        </div>
      </div>
    </div>
    <!-- 底部：状态释义 15% -->
    <div class="bottom-desc" id="bottomDesc">
      <span class="dl" id="descLabel">L0</span>
      <span id="descText">：L0 全速工作状态。数据正常传输，链路处于全活动状态。</span>
    </div>
  </div>

  <script>
    // ====================================================================
    // 1. DOT数据（完全不变）
    // ====================================================================
    const MAIN_STATE_IDS = [
      'detect',
      'polling',
      'configuration',
      'l0',
      'l0s',
      'l1',
      'l2',
      'recovery',
      'loopback',
      'hotreset',
      'disabled'
    ];
    const SUB_STATE_MAP = {
      detect: ['Detect.Quiet', 'Detect.Active'],
      polling: ['Polling.Active', 'Polling.Compliance', 'Polling.Configuration'],
      configuration: ['Config.Linkwidth.Start', 'Config.Linkwidth.Accept', 'Config.Lanenum.Wait', 'Config.Lanenum.Accept', 'Config.Complete', 'Config.Idle'],
      l0: ['L0'],
      l0s: ['Tx_L0s.Entry', 'Tx_L0s.Idle', 'Tx_L0s.FTS', 'Rx_L0s.Entry', 'Rx_L0s.Idle', 'Rx_L0s.FTS'],
      l1: ['L1.Entry', 'L1.Idle'],
      l2: ['L2.Idle', 'L2.TransmitWake'],
      recovery: ['Recovery.RcvrLock', 'Recovery.RcvrCfg', 'Recovery.Equalization', 'Recovery.Speed', 'Recovery.Idle'],
      loopback: ['Loopback.Entry', 'Loopback.Active', 'Loopback.Exit'],
      hotreset: ['Hot Reset'],
      disabled: ['Disable']
    };
    const COLOR_MAP = {
      detect: '#8bc34a',
      polling: '#ffc107',
      configuration: '#ce93d8',
      l0: '#f8bbd0',
      l0s: '#ff9800',
      l1: '#ef9a9a',
      l2: '#4caf50',
      recovery: '#d4c45a',
      loopback: '#f0b8b0',
      hotreset: '#e53935',
      disabled: '#9e9e9e'
    };

    const MAIN_LABEL_MAP = {
      detect: 'Detect',
      polling: 'Polling',
      configuration: 'Configuration',
      l0: 'L0',
      l0s: 'L0s',
      l1: 'L1',
      l2: 'L2',
      recovery: 'Recovery',
      loopback: 'Loopback',
      hotreset: 'Hot Reset',
      disabled: 'Disable'
    };

    function isLight(c) { const h = c.replace('#', ''); return (parseInt(h.substr(0, 2), 16) * 0.299 + parseInt(h.substr(2, 2), 16) * 0.587 + parseInt(h.substr(4, 2), 16) * 0.114) > 170; }

    const DESC_MAP = {
      detect: '链路检测状态。检测对端是否存在，并准备进行链路训练。',
      polling: '轮询状态。发送TS1/TS2序列，进行位锁定和符号锁定。',
      configuration: '链路配置状态。依次经过 Linkwidth.Start→Accept→Lanenum.Wait→Accept→Complete→Idle。',
      l0: 'L0 全速工作状态。数据正常传输，链路处于全活动状态。',

          if (vert) { const off = 32, my = (fp.y + tp.y) / 2; const p1 = ePt(fp.x, fp.y, fp.x + off * 2, my, fp.rx2, fp.ry2), p2 = ePt(tp.x, tp.y, tp.x + off * 2, my, tp.rx2, tp.ry2); svgC += '<path d="M ' + p1.x + ' ' + p1.y + ' Q ' + ((fp.x + tp.x) / 2 + off) + ' ' + my + ' ' + p2.x + ' ' + p2.y + '" class="sub-arrow" stroke="' + sc + '" marker-end="url(#sAC)" fill="none"/>'; const p3 = ePt(tp.x, tp.y, tp.x - off * 2, my, tp.rx2, tp.ry2), p4 = ePt(fp.x, fp.y, fp.x - off * 2, my, fp.rx2, fp.ry2); svgC += '<path d="M ' + p3.x + ' ' + p3.y + ' Q ' + ((fp.x + tp.x) / 2 - off) + ' ' + my + ' ' + p4.x + ' ' + p4.y + '" class="sub-arrow" stroke="' + sc + '" marker-end="url(#sAC)" fill="none"/>'; }
          else if (hor) { const off = 28, mx = (fp.x + tp.x) / 2; const p1 = ePt(fp.x, fp.y, mx, fp.y - off * 2, fp.rx2, fp.ry2), p2 = ePt(tp.x, tp.y, mx, tp.y - off * 2, tp.rx2, tp.ry2); svgC += '<path d="M ' + p1.x + ' ' + p1.y + ' Q ' + mx + ' ' + ((fp.y + tp.y) / 2 - off) + ' ' + p2.x + ' ' + p2.y + '" class="sub-arrow" stroke="' + sc + '" marker-end="url(#sAC)" fill="none"/>'; const p3 = ePt(tp.x, tp.y, mx, tp.y + off * 2, tp.rx2, tp.ry2), p4 = ePt(fp.x, fp.y, mx, fp.y + off * 2, fp.rx2, fp.ry2); svgC += '<path d="M ' + p3.x + ' ' + p3.y + ' Q ' + mx + ' ' + ((fp.y + tp.y) / 2 + off) + ' ' + p4.x + ' ' + p4.y + '" class="sub-arrow" stroke="' + sc + '" marker-end="url(#sAC)" fill="none"/>'; }
          else { const mx = (fp.x + tp.x) / 2, my = (fp.y + tp.y) / 2, off = 22; const p1 = ePt(fp.x, fp.y, mx - off, my - off, fp.rx2, fp.ry2), p2 = ePt(tp.x, tp.y, mx - off, my - off, tp.rx2, tp.ry2); svgC += '<path d="M ' + p1.x + ' ' + p1.y + ' Q ' + (mx - off) + ' ' + (my - off) + ' ' + p2.x + ' ' + p2.y + '" class="sub-arrow" stroke="' + sc + '" marker-end="url(#sAC)" fill="none"/>'; const p3 = ePt(tp.x, tp.y, mx + off, my + off, tp.rx2, tp.ry2), p4 = ePt(fp.x, fp.y, mx + off, my + off, fp.rx2, fp.ry2); svgC += '<path d="M ' + p3.x + ' ' + p3.y + ' Q ' + (mx + off) + ' ' + (my + off) + ' ' + p4.x + ' ' + p4.y + '" class="sub-arrow" stroke="' + sc + '" marker-end="url(#sAC)" fill="none"/>'; }
        } else {
          const p1 = ePt(fp.x, fp.y, tp.x, tp.y, fp.rx2, fp.ry2), p2 = ePt(tp.x, tp.y, fp.x, fp.y, tp.rx2, tp.ry2); const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2; let blocked = false;
          for (const [n, pos] of Object.entries(posMap)) { if (n === e.from || n === e.to) continue; const d = Math.sqrt((mx - pos.x) ** 2 + (my - pos.y) ** 2); if (d < Math.max(pos.rx2, 30) + 8) { blocked = true; break; } }
          if (blocked) { const cx2 = (fp.x + tp.x) / 2, cy2 = (fp.y + tp.y) / 2 - 22; svgC += '<path d="M ' + p1.x + ' ' + p1.y + ' Q ' + cx2 + ' ' + cy2 + ' ' + p2.x + ' ' + p2.y + '" class="sub-arrow" stroke="' + sc + '" marker-end="url(#sAC)" fill="none"/>'; }
          else svgC += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p2.x + '" y2="' + p2.y + '" class="sub-arrow" stroke="' + sc + '" marker-end="url(#sA)"/>';
        }
      }
      for (const [nm, pos] of Object.entries(posMap)) {
        const isHL = (hs === nm), isInt = (pos.type === 'int'); const rx2 = pos.rx2, ry2 = pos.ry2;
        const cls = isInt ? 'sub-node-internal' : 'sub-node-external'; const ext = isInt ? '' : 'data-mid="' + pos.mid + '"';
        const sc2 = isHL ? '#1a5a8a' : 'rgba(0,0,0,.06)'; const sw = isHL ? '2.5' : '1.2';
        svgC += '<g class="' + cls + '" data-subname="' + nm + '" ' + ext + '>';
        svgC += '<ellipse cx="' + pos.x + '" cy="' + pos.y + '" rx="' + rx2 + '" ry="' + ry2 + '" fill="' + pos.color + '" stroke="' + sc2 + '" stroke-width="' + sw + '" filter="url(#shSub)"/>';
        const tc2 = isInt ? (isLight(pos.color) ? '#1a2332' : '#fff') : '#1a2332'; const parts = nm.split('.'); const mp = parts[0], sp = parts.slice(1).join('.');
        const subFs = (mid === 'configuration' || mid === 'loopback' || mid === 'recovery') ? 13 : 15;
        const extFs = (mid === 'configuration' || mid === 'loopback' || mid === 'recovery') ? 12 : 14;
        if (isInt) {
          if (sp) svgC += '<text x="' + pos.x + '" y="' + pos.y + '" font-size="' + subFs + '" font-weight="700" fill="' + tc2 + '" text-anchor="middle" dominant-baseline="central" class="sub-label">' + nm + '</text>';
          else svgC += '<text x="' + pos.x + '" y="' + pos.y + '" font-size="' + subFs + '" font-weight="700" fill="' + tc2 + '" text-anchor="middle" dominant-baseline="central">' + mp + '</text>';
        } else {
          svgC += '<text x="' + pos.x + '" y="' + pos.y + '" font-size="' + extFs + '" font-weight="700" fill="#1a2332" text-anchor="middle" dominant-baseline="central">' + pos.label + '</text>';
        }
        svgC += '</g>';
      } svgC += '</g></svg>'; return svgC;
    }

    // ====================================================================
    // 7. 播放控制 + 轨迹
    // ====================================================================
    function getSeq() { return buildSeq(curMode, eqModeSelect.value); }
    function startPlay()
    {
        if (isPlaying && !isPaused)
        {
            isPaused = true;
            if (playTimer)
            {
                clearTimeout(playTimer);
                playTimer = null;
            }
            playBtn.textContent = '⟳ 重置';
            return;
        }
        if (isPaused)
        {
            stopPlay();
            playIdx = 0;
            playTrace.innerHTML = '<span style="color:#8a9aaa;font-size:13px;font-weight:600;">就绪</span>';
            playBtn.textContent = '▶ 播放';
            return;
        }
        playIdx = 0;
        curSeq = getSeq();
        if (!curSeq.length)
            return;
        isPlaying = true;
        isPaused = false;
        playBtn.textContent = '⏸ 暂停';
        playTrace.innerHTML = '';
        clearHLs();
        doStep();
    }
    function doStep()
    {
        if (!isPlaying || isPaused)
            return;
        if (playIdx >= curSeq.length)
        {
            stopPlay();
            return;
        }
        const st2 = curSeq[playIdx], mid = st2.main, sid = st2.sub || null;
        if (STATES[mid])
        {
            selectState(mid, sid);
            highlightNode(mid);
            highlightSubPlaying(mid, sid);
        }
        updateTrace();
        playIdx++;
        playTimer = setTimeout(doStep, 700);
    }
    function updateTrace()
    {
        let html = '';
        const total = curSeq.length;
        let cnt = 0;
        for (let i = 0; i < total; i++)
        {
            const s = curSeq[i], mid = s.main, st = STATES[mid];
            if (!st)
                continue;
            let label = st.label;
            if (s.sub)
                label += '.' + s.sub.split('.').slice(1).join('.');
            const gen = s.gen || '';
            const gc = {'Gen1' : '#8bc34a', 'Gen2' : '#ffc107', 'Gen3' : '#ce93d8', 'Gen4' : '#f8bbd0', 'Gen5' : '#4caf50'}[gen] || '';
            const genTag = gen ? '<span class="pt-gen" style="background:' + gc + '">' + gen + '</span>' : '';
            if (i < playIdx)
            {
                html += '<span class="pt-item done" style="border-left:3px solid ' + st.color + '">' + label + genTag + '</span>';
                cnt++;
            }
            else if (i===playIdx)
            {
                html += '<span class="pt-item current" id="ptCurr" style="border-left:3px solid ' + st.color + '">' + label + genTag + '</span>';
                cnt++;
                break;
            }
            else
                break;
        }
        if (!cnt)
            html = '<span style="color:#8a9aaa;font-size:13px;font-weight:600;">就绪</span>';
        playTrace.innerHTML = html;
        const curr = document.getElementById('ptCurr');
        if (curr)
        {
            const ct = curr.offsetTop, ch = curr.offsetHeight, contH = playTrace.clientHeight;
            if (ct + ch > contH - 2 || ct < playTrace.scrollTop)
                playTrace.scrollTop = Math.max(0, ct - contH * 0.3);
        }
    }
    function highlightNode(id)
    {
        nodesGroup.querySelectorAll('.state-node').forEach(el => el.classList.remove('playing'));
        const el = nodesGroup.querySelector('.state-node[data-id="' + id + '"]');
        if (el)
            el.classList.add('playing');
    }
    function highlightSubPlaying(mid, sid)
    {
        subGraph.querySelectorAll('.sub-node-internal').forEach(el => el.classList.remove('playing'));
        if (!sid)
            return;
        const el = subGraph.querySelector('[data-subname="' + sid + '"]');
        if (el)
            el.classList.add('playing');
    }
    function clearHLs()
    {
        nodesGroup.querySelectorAll('.state-node').forEach(el => el.classList.remove('playing'));
        subGraph.querySelectorAll('.sub-node-internal').forEach(el => el.classList.remove('playing'));
    }
    function stopPlay()
    {
        isPlaying = false;
        isPaused = false;
        if (playTimer)
        {
            clearTimeout(playTimer);
            playTimer = null;
        }
        playBtn.textContent = '▶ 播放';
        clearHLs();
        selectState(selectedId || 'detect', null);
    }
    function clearTrace()
    {
        playTrace.innerHTML = '<span style="color:#8a9aaa;font-size:13px;font-weight:600;">就绪</span>';
        stopPlay();
    }
    function exportTrace()
    {
        let seq = '';
        const items = playTrace.querySelectorAll('.pt-item');
        if (!items.length)
        {
            seq = '（空）';
        }
        else
        {
            items.forEach(el => {
                const label = el.childNodes[0] ?.textContent ?.trim() || el.textContent.trim().replace(/Gen[1-5]/g, '').trim();
                const genSpan = el.querySelector('.pt-gen');
                const gen = genSpan ? genSpan.textContent.trim() : '';
                const s = gen ? label + ' (' + gen + ')' : label;
                if (seq)
                    seq += ' -> ' + s;
                else
                    seq = s;
            });
        }
        const mode = document.getElementById('modeSelectSvg').value;
        const eq = document.getElementById('eqModeSelect').value;
        const now = new Date();
        const text = 'LTSSM Trace [' + mode + ' ' + eq + '] ' + now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate() + ' ' + now.getHours() + ':' + now.getMinutes() + '\n' + seq;
        navigator.clipboard.writeText(text).then(() => {
                                               const orig = traceExportBtn.textContent;
                                               traceExportBtn.textContent = '✅ 已复制';
                                               setTimeout(() => { traceExportBtn.textContent = orig; }, 1500);
                                           }).catch(() => { alert('复制失败，请手动复制'); });
    }

    // ====================================================================
    // 8. 事件绑定
    // ====================================================================
    playBtn.addEventListener('click', startPlay);
    traceClearBtn.addEventListener('click', clearTrace);
    traceExportBtn.addEventListener('click', exportTrace);
    modeSelect.addEventListener('change', function () { curMode = this.value; if (!isPlaying) selectState(selectedId || 'l0', null); });
    eqModeSelect.addEventListener('change', function () { if (!isPlaying) selectState(selectedId || 'l0', null); });
    buildGraph(); curMode = 'Gen1';
  </script>
