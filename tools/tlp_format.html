<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCIe TLP 帧格式编辑器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1400px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid #e8eaf6;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 28px;
            color: #1a237e;
        }
        .version {
            font-size: 16px;
            color: #78909c;
            font-weight: 500;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
            background: #f5f7fa;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .toolbar-left { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .toolbar-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
        .toolbar label { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
        .toolbar select, .toolbar input[type="number"] {
            padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; background: white;
        }
        .btn {
            background: #3f51b5; color: white; border: none; padding: 8px 16px; border-radius: 4px;
            font-size: 15px; cursor: pointer; transition: background 0.2s; white-space: nowrap;
        }
        .btn:hover { background: #283593; }
        .btn-secondary { background: #78909c; }
        .btn-secondary:hover { background: #546e7a; }
        .btn-success { background: #43a047; }
        .btn-success:hover { background: #2e7d32; }
        .btn-danger { background: #e53935; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-endian {
            background: #90a4ae;
            min-width: 60px;
            text-align: center;
        }
        .btn-endian.active {
            background: #3f51b5;
        }
        .btn-recolor {
            background: #ffb74d;
            color: #37474f;
        }
        .btn-recolor:hover {
            background: #ffa726;
        }
        .btn-whitebg {
            background: #e0e0e0;
            color: #333;
        }
        .btn-whitebg.active {
            background: #333;
            color: white;
        }

        .grid-area {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 0;
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }
        .bit-grid { display: flex; flex-direction: column; gap: 0; user-select: none; }
        .dw-row { display: flex; gap: 0; align-items: center; padding: 0; margin: 0; }
        .dw-label {
            font-weight: 600; font-size: 14px; color: #546e7a; width: 48px;
            text-align: right; padding-right: 10px; flex-shrink: 0;
        }
        .byte-group { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 0; margin: 0; flex: 0 0 auto; }
        .byte-label {
            font-size: 12px; font-weight: 600; color: #37474f; text-align: center;
            padding: 2px 4px; width: 100%; border-left: 1px solid #b0bec5;
            border-right: 1px solid #b0bec5; border-top: none; border-bottom: none;
            background: transparent; margin: 0; line-height: 1.4;
        }
        .bit-container { display: flex; gap: 0; margin: 0; padding: 0; }
        .bit-cell {
            width: 34px; height: 34px; background: #eceff1; border: 1px solid #b0bec5;
            border-radius: 0; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.05s;
            position: relative; color: #263238; box-sizing: border-box; margin: 0; flex-shrink: 0;
        }
        .bit-cell:hover { border-color: #3f51b5; z-index: 1; }
        .bit-cell.selected { border: 3px solid #ff5722 !important; background: #ffe0b2 !important; z-index: 2; }
        .bit-cell.field { color: white; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .bit-cell .bit-index { font-size: 14px; font-weight: 600; color: rgba(0,0,0,0.35); line-height: 1; pointer-events: none; }
        .bit-cell.field .bit-index { display: none; }
        .bit-cell .field-text {
            text-align: center; line-height: 1.2; word-break: keep-all; white-space: nowrap;
            padding: 1px; pointer-events: none; font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .bit-index-row .bit-cell {
            background: transparent; border: none; height: 20px; font-size: 10px;
            color: #90a4ae; cursor: default; font-weight: 400;
            border-left: 1px solid #b0bec5; border-right: 1px solid #b0bec5;
            border-top: none; border-bottom: none; width: 34px; flex-shrink: 0;
        }
        .bit-index-row .bit-cell:hover { border-color: #b0bec5; z-index: auto; }

        .field-list-container {
            margin-top: 12px; padding: 0 0;
            display: none;
            width: 100%;
        }
        .field-list-container.visible { display: block; }
        .field-list-inner {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 8px 12px;
            min-height: 40px;
            max-height: 120px;
            overflow-y: auto;
            margin: 0 0;
        }
        .field-list-title { font-size: 14px; font-weight: 600; color: #37474f; margin-bottom: 4px; text-align: left; }
        .field-list-items { display: flex; flex-wrap: wrap; gap: 6px; }
        .field-tag {
            display: inline-flex; align-items: center; background: #e8eaf6; border-radius: 12px;
            padding: 2px 8px 2px 10px; font-size: 13px; color: #1a237e; gap: 4px;
        }
        .field-tag .color-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
        .field-tag .del-btn {
            background: none; border: none; color: #e53935; cursor: pointer;
            font-size: 16px; line-height: 1; padding: 0 2px;
        }
        .field-tag .del-btn:hover { color: #b71c1c; }

        .action-bar {
            display: flex; justify-content: flex-end; margin-top: 12px;
            gap: 8px; flex-wrap: wrap; padding: 0 0;
            align-items: center;
        }

        .status-bar-wrapper {
            margin-top: 10px; padding: 0 0; box-sizing: border-box;
        }
        .status-bar {
            font-size: 14px; color: #455a64; padding: 6px 12px; background: #e8eaf6;
            border-radius: 4px; text-align: left; width: 100%; box-sizing: border-box;
        }
        .file-input-hidden { display: none !important; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white; border-radius: 12px; padding: 24px 28px;
            max-width: 450px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-box h2 { font-size: 22px; color: #1a237e; margin-bottom: 12px; }
        .modal-box label { display: block; font-size: 15px; margin-top: 12px; }
        .modal-box input, .modal-box select {
            width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 15px; margin-top: 4px;
        }
        .modal-box .modal-actions { display: flex; gap: 12px; margin-top: 18px; justify-content: flex-end; }
        .modal-box .info-bit {
            font-size: 15px; color: #37474f; background: #f5f5f5;
            padding: 6px 10px; border-radius: 4px; margin-top: 8px;
        }
        @media (max-width: 960px) {
            .bit-cell { width: 28px; height: 28px; font-size: 12px; }
            .bit-cell .bit-index { font-size: 12px; }
            .bit-index-row .bit-cell { height: 18px; font-size: 9px; width: 28px; }
            .toolbar-right { margin-left: 0; width: 100%; justify-content: flex-end; }
            .field-list-container, .action-bar, .status-bar-wrapper { padding: 0 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>PCIe TLP 帧格式编辑器</h1>
        <span class="version" id="versionDisplay">v1.0</span>
    </div>

    <div class="toolbar">
        <div class="toolbar-left">
            <label>DW数量:
                <select id="dwCountSelect">
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4" selected>4</option><option value="5">5</option><option value="6">6</option>
                    <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                    <option value="10">10</option><option value="11">11</option><option value="12">12</option>
                    <option value="13">13</option><option value="14">14</option><option value="15">15</option>
                    <option value="16">16</option>
                </select>
            </label>
            <button class="btn btn-endian" id="endianToggle">小端</button>
            <button class="btn" id="applyBtn">应用</button>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-secondary" id="clearFieldsBtn">清空</button>
            <button class="btn btn-success" id="editSelectionBtn">编辑</button>
            <button class="btn btn-secondary" id="importFieldBtn">导入字段</button>
            <input type="file" id="fieldFileInput" class="file-input-hidden" accept=".json">
            <button class="btn btn-secondary" id="importTlpBtn">导入TLP</button>
            <input type="file" id="tlpFileInput" class="file-input-hidden" accept=".json">
        </div>
    </div>

    <div class="grid-area">
        <div id="bitGridContainer"></div>
    </div>

    <div class="field-list-container" id="fieldListContainer">
        <div class="field-list-inner">
            <div class="field-list-title">已定义字段</div>
            <div class="field-list-items" id="fieldListItems">
                <span style="color:#999; font-size:13px;">暂无字段</span>
            </div>
        </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="action-bar">
        <button class="btn btn-whitebg" id="toggleWhiteBgBtn">白底</button>
        <button class="btn btn-recolor" id="recolorBtn">🎨重新配色</button>
        <button class="btn btn-secondary" id="previewSvgBtn">预览</button>
        <button class="btn btn-success" id="exportSvgBtn">导出SVG</button>
        <button class="btn btn-secondary" id="exportJsonBtn">导出JSON</button>
    </div>

    <div class="status-bar-wrapper">
        <div class="status-bar" id="statusBar">当前操作：就绪</div>
    </div>
</div>

<!-- 编辑字段模态框 -->
<div class="modal-overlay" id="fieldModal">
    <div class="modal-box">
        <h2>编辑字段</h2>
        <div class="info-bit" id="modalBitInfo">选中范围: ...</div>
        <div id="fieldLibSelectWrapper" style="display:none;">
            <label>从库中选择: <select id="fieldLibSelect"><option value="">— 选择 —</option></select></label>
        </div>
        <label>字段名 (原始): <input type="text" id="modalFieldName" placeholder="如: Fmt"></label>
        <label>显示文字: <input type="text" id="modalFieldDisplay" placeholder="如: Fmt"></label>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="modalCancelBtn">取消</button>
            <button class="btn btn-success" id="modalConfirmBtn">确认</button>
        </div>
    </div>
</div>

<!-- SVG预览模态框（无标题） -->
<div class="modal-overlay" id="previewModal">
    <div class="modal-box" style="max-width: 90%; max-height: 90%; overflow: auto; padding: 12px;">
        <div id="previewContainer" style="text-align: center;"></div>
        <div class="modal-actions" style="justify-content: center; margin-top: 12px;">
            <button class="btn btn-success" id="previewExportBtn">导出 SVG</button>
            <button class="btn btn-secondary" id="previewCloseBtn">关闭</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ===== 静态版本号 =====
        const version = 1.0;
        document.getElementById('versionDisplay').textContent = 'v' + version.toFixed(1);

        // ===== 全局状态 =====
        let dwCount = 4;
        let endianness = 'little';
        let fields = [];
        let selectedBits = [];
        let bitElements = {};
        let visualToGlobal = {};
        let globalToVisual = {};
        let fieldLibrary = [];
        let whiteBg = false; // 白底模式开关

        // ===== 高饱和度颜色调色板（32种） =====
        const COLORS = [
            '#F94144', '#F8961E', '#F9C74F', '#90BE6D', '#43AA8B', '#4D908E', '#577590', '#277DA1',
            '#5E4B8C', '#9C89B8', '#F4845F', '#F2A65A', '#F2C14E', '#A7C957', '#6A994E', '#386641',
            '#247BA0', '#1B98A0', '#E8D44D', '#FF6B6B', '#FF8C42', '#F9C74F', '#90BE6D', '#43AA8B',
            '#4D908E', '#577590', '#277DA1', '#5E4B8C', '#9C89B8', '#F4845F', '#F2A65A', '#F2C14E'
        ];

        const RESERVED_COLOR = '#B0B0B0';
        let colorIndex = 0;

        // DOM 引用
        const container = document.getElementById('bitGridContainer');
        const statusBar = document.getElementById('statusBar');
        const fieldListContainer = document.getElementById('fieldListContainer');
        const fieldListItems = document.getElementById('fieldListItems');
        const dwCountSelect = document.getElementById('dwCountSelect');
        const endianToggle = document.getElementById('endianToggle');
        const applyBtn = document.getElementById('applyBtn');
        const clearFieldsBtn = document.getElementById('clearFieldsBtn');
        const editSelectionBtn = document.getElementById('editSelectionBtn');
        const previewSvgBtn = document.getElementById('previewSvgBtn');
        const exportSvgBtn = document.getElementById('exportSvgBtn');
        const exportJsonBtn = document.getElementById('exportJsonBtn');
        const importFieldBtn = document.getElementById('importFieldBtn');
        const fieldFileInput = document.getElementById('fieldFileInput');
        const importTlpBtn = document.getElementById('importTlpBtn');
        const tlpFileInput = document.getElementById('tlpFileInput');
        const recolorBtn = document.getElementById('recolorBtn');
        const toggleWhiteBgBtn = document.getElementById('toggleWhiteBgBtn');
        const fieldLibSelectWrapper = document.getElementById('fieldLibSelectWrapper');
        const fieldLibSelect = document.getElementById('fieldLibSelect');

        const modalOverlay = document.getElementById('fieldModal');
        const modalBitInfo = document.getElementById('modalBitInfo');
        const modalFieldName = document.getElementById('modalFieldName');
        const modalFieldDisplay = document.getElementById('modalFieldDisplay');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');

        const previewModal = document.getElementById('previewModal');
        const previewContainer = document.getElementById('previewContainer');
        const previewCloseBtn = document.getElementById('previewCloseBtn');
        const previewExportBtn = document.getElementById('previewExportBtn');

        // ===== 判断是否为保留字段 =====
        function isReservedField(name) {
            if (!name) return false;
            const lower = name.toLowerCase();
            return lower.includes('reserved') || lower.includes('rsvd');
        }

        // ===== 获取颜色（保留字段返回灰色） =====
        function getColorForField(name) {
            if (isReservedField(name)) {
                return RESERVED_COLOR;
            }
            for (let f of fields) if (f.name === name) return f.color;
            const color = COLORS[colorIndex % COLORS.length];
            colorIndex++;
            return color;
        }

        function updateStatus(msg) { statusBar.textContent = '当前操作：' + msg; }

        function clearSelection() {
            selectedBits.forEach(idx => { const el = bitElements[idx]; if (el) el.classList.remove('selected'); });
            selectedBits = [];
        }

        function globalToPosition(globalBit) {
            const dw = Math.floor(globalBit / 32);
            const offset = globalBit % 32;
            return { dw, byte: Math.floor(offset / 8), bit: offset % 8 };
        }

        function formatPosition(globalBit) {
            const p = globalToPosition(globalBit);
            return `DW${p.dw} Byte${p.byte} bit${p.bit}`;
        }

        function getSelectedVisIndices() {
            const visSet = new Set();
            selectedBits.forEach(g => {
                const v = globalToVisual[g];
                if (v !== undefined) visSet.add(v);
            });
            return Array.from(visSet).sort((a,b) => a-b);
        }

        // ===== 重新配色函数（保留字段固定灰色） =====
        function recolorFields() {
            if (fields.length === 0) {
                updateStatus('没有字段需要配色');
                return;
            }

            const reservedIndices = [];
            const normalIndices = [];
            for (let i = 0; i < fields.length; i++) {
                if (isReservedField(fields[i].name)) {
                    reservedIndices.push(i);
                } else {
                    normalIndices.push(i);
                }
            }

            const n = normalIndices.length;
            const adj = Array.from({ length: n }, () => []);
            const idxMap = {};
            normalIndices.forEach((orig, idx) => { idxMap[orig] = idx; });

            const fieldVisSets = normalIndices.map(orig => new Set(fields[orig].visIndices));

            for (let i = 0; i < n; i++) {
                for (let j = i + 1; j < n; j++) {
                    let adjacent = false;
                    const setA = fieldVisSets[i];
                    const setB = fieldVisSets[j];
                    for (let v of setA) {
                        if (setB.has(v) || setB.has(v - 1) || setB.has(v + 1)) {
                            adjacent = true;
                            break;
                        }
                    }
                    if (adjacent) {
                        adj[i].push(j);
                        adj[j].push(i);
                    }
                }
            }

            const assignedColors = new Array(n).fill(null);
            const shuffledColors = [...COLORS];
            for (let i = shuffledColors.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledColors[i], shuffledColors[j]] = [shuffledColors[j], shuffledColors[i]];
            }

            for (let i = 0; i < n; i++) {
                const usedColors = new Set();
                for (let j of adj[i]) {
                    if (assignedColors[j] !== null) {
                        usedColors.add(assignedColors[j]);
                    }
                }
                let chosen = null;
                for (let c of shuffledColors) {
                    if (!usedColors.has(c)) {
                        chosen = c;
                        break;
                    }
                }
                if (chosen === null) {
                    const allUsed = new Set(assignedColors.filter(c => c !== null));
                    for (let c of shuffledColors) {
                        if (!allUsed.has(c)) {
                            chosen = c;
                            break;
                        }
                    }
                }
                if (chosen === null) chosen = shuffledColors[0];
                assignedColors[i] = chosen;
            }

            const colorSet = new Set();
            for (let i = 0; i < n; i++) {
                if (colorSet.has(assignedColors[i])) {
                    const allUsed = new Set(assignedColors);
                    for (let c of shuffledColors) {
                        if (!allUsed.has(c)) {
                            assignedColors[i] = c;
                            break;
                        }
                    }
                }
                colorSet.add(assignedColors[i]);
            }

            for (let i = 0; i < n; i++) {
                const origIdx = normalIndices[i];
                fields[origIdx].color = assignedColors[i];
            }

            for (let i of reservedIndices) {
                fields[i].color = RESERVED_COLOR;
            }

            refreshAllFields();
            updateStatus(`重新配色完成 (${fields.length} 个字段，其中 ${reservedIndices.length} 个保留字段为灰色)`);
        }

        // ===== 端序按钮 =====
        function updateEndianButton() {
            endianToggle.textContent = endianness === 'little' ? '小端' : '大端';
            endianToggle.classList.toggle('active', endianness === 'big');
        }
        endianToggle.addEventListener('click', function() {
            endianness = endianness === 'little' ? 'big' : 'little';
            updateEndianButton();
            updateStatus('端序已切换，请点击“应用”生效');
        });

        // ===== 渲染网格 =====
        function renderGrid() {
            dwCount = parseInt(dwCountSelect.value);
            container.innerHTML = '';
            bitElements = {};
            visualToGlobal = {};
            globalToVisual = {};

            const gridDiv = document.createElement('div');
            gridDiv.className = 'bit-grid';

            // ---- Byte 标签行 ----
            const headerRow = document.createElement('div');
            headerRow.className = 'dw-row';
            const emptyLabel = document.createElement('span');
            emptyLabel.className = 'dw-label';
            emptyLabel.textContent = '';
            headerRow.appendChild(emptyLabel);

            const byteOrder = (endianness === 'little') ? [0,1,2,3] : [3,2,1,0];
            for (let bIdx of byteOrder) {
                const byteGroup = document.createElement('div');
                byteGroup.className = 'byte-group';
                const label = document.createElement('span');
                label.className = 'byte-label';
                let byteNum = bIdx;
                label.textContent = `Byte${byteNum}`;
                byteGroup.appendChild(label);
                const phContainer = document.createElement('div');
                phContainer.className = 'bit-container';
                phContainer.style.height = '0';
                phContainer.style.overflow = 'hidden';
                for (let i = 0; i < 8; i++) {
                    const ph = document.createElement('span');
                    ph.style.width = '34px';
                    ph.style.height = '34px';
                    ph.style.display = 'inline-block';
                    ph.style.flexShrink = '0';
                    phContainer.appendChild(ph);
                }
                byteGroup.appendChild(phContainer);
                headerRow.appendChild(byteGroup);
            }
            gridDiv.appendChild(headerRow);

            // ---- bit 序号行 ----
            const indexRow = document.createElement('div');
            indexRow.className = 'dw-row bit-index-row';
            const emptyLabel2 = document.createElement('span');
            emptyLabel2.className = 'dw-label';
            emptyLabel2.textContent = '';
            indexRow.appendChild(emptyLabel2);

            for (let bIdx of byteOrder) {
                const byteGroup = document.createElement('div');
                byteGroup.className = 'byte-group';
                const bitContainer = document.createElement('div');
                bitContainer.className = 'bit-container';
                for (let bitInByte = 7; bitInByte >= 0; bitInByte--) {
                    const cell = document.createElement('div');
                    cell.className = 'bit-cell';
                    cell.textContent = bitInByte;
                    bitContainer.appendChild(cell);
                }
                byteGroup.appendChild(bitContainer);
                indexRow.appendChild(byteGroup);
            }
            gridDiv.appendChild(indexRow);

            // ---- DW 行 ----
            let visualIndex = 0;
            const byteOrderDw = (endianness === 'little') ? [0,1,2,3] : [3,2,1,0];
            for (let dw = 0; dw < dwCount; dw++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'dw-row';
                const label = document.createElement('span');
                label.className = 'dw-label';
                label.textContent = `DW${dw}`;
                rowDiv.appendChild(label);

                for (let bIdx of byteOrderDw) {
                    const byteGroup = document.createElement('div');
                    byteGroup.className = 'byte-group';
                    const bitContainer = document.createElement('div');
                    bitContainer.className = 'bit-container';
                    for (let bitInByte = 7; bitInByte >= 0; bitInByte--) {
                        let absBit;
                        if (endianness === 'little') {
                            absBit = dw * 32 + bIdx * 8 + bitInByte;
                        } else {
                            absBit = dw * 32 + (3 - bIdx) * 8 + bitInByte;
                        }
                        const cell = document.createElement('div');
                        cell.className = 'bit-cell';
                        cell.dataset.bitIndex = absBit;
                        cell.dataset.visualIndex = visualIndex;
                        const idxSpan = document.createElement('span');
                        idxSpan.className = 'bit-index';
                        idxSpan.textContent = bitInByte;
                        cell.appendChild(idxSpan);
                        bitElements[absBit] = cell;
                        visualToGlobal[visualIndex] = absBit;
                        globalToVisual[absBit] = visualIndex;
                        visualIndex++;
                        bitContainer.appendChild(cell);

                        cell.addEventListener('mousedown', function(e) {
                            e.preventDefault();
                            const idx = parseInt(this.dataset.bitIndex);
                            const visIdx = parseInt(this.dataset.visualIndex);

                            if (e.ctrlKey || e.metaKey) {
                                if (selectedBits.includes(idx)) {
                                    selectedBits = selectedBits.filter(i => i !== idx);
                                    this.classList.remove('selected');
                                } else {
                                    selectedBits.push(idx);
                                    this.classList.add('selected');
                                }
                                updateStatus(`选中 ${selectedBits.length} 个bit`);
                                return;
                            }

                            if (e.shiftKey && selectedBits.length > 0) {
                                const firstVis = globalToVisual[selectedBits[0]];
                                const startVis = Math.min(firstVis, visIdx);
                                const endVis = Math.max(firstVis, visIdx);
                                selectedBits.forEach(i => { const el = bitElements[i]; if (el) el.classList.remove('selected'); });
                                selectedBits = [];
                                for (let v = startVis; v <= endVis; v++) {
                                    const gIdx = visualToGlobal[v];
                                    selectedBits.push(gIdx);
                                    const el = bitElements[gIdx];
                                    if (el) el.classList.add('selected');
                                }
                            } else {
                                clearSelection();
                                selectedBits = [idx];
                                this.classList.add('selected');
                            }
                            updateStatus(`选中 ${selectedBits.length} 个bit`);
                        });
                        cell.addEventListener('dblclick', function(e) {
                            e.preventDefault();
                            openEditModal();
                        });
                    }
                    byteGroup.appendChild(bitContainer);
                    rowDiv.appendChild(byteGroup);
                }
                gridDiv.appendChild(rowDiv);
            }
            container.appendChild(gridDiv);
            refreshAllFields();
            updateFieldList();
            updateStatus('网格已更新');
        }

        // ===== 字段样式（根据 whiteBg 决定底色和边框） =====
        function refreshAllFields() {
            for (let idx in bitElements) {
                const el = bitElements[idx];
                el.classList.remove('field');
                el.style.background = '';
                el.style.borderColor = '';
                el.style.color = '';
                el.style.border = '1px solid #b0bec5';
                el.style.borderRadius = '0';
                const idxSpan = el.querySelector('.bit-index');
                if (idxSpan) idxSpan.style.display = 'block';
                const textSpan = el.querySelector('.field-text');
                if (textSpan) textSpan.remove();
            }

            if (fields.length === 0) return;

            for (let f of fields) {
                const visIndices = f.visIndices.slice().sort((a,b) => a-b);
                if (visIndices.length === 0) continue;
                const color = f.color;
                // 白底模式：底色白色，边框黑色，文字黑色
                const fillColor = whiteBg ? '#FFFFFF' : color;
                const borderColor = whiteBg ? '#000000' : color;
                const textColor = whiteBg ? '#000000' : '#FFFFFF';

                const segments = [];
                let start = visIndices[0];
                let end = visIndices[0];
                for (let i = 1; i < visIndices.length; i++) {
                    if (visIndices[i] === end + 1) {
                        end = visIndices[i];
                    } else {
                        segments.push({ start, end });
                        start = visIndices[i];
                        end = visIndices[i];
                    }
                }
                segments.push({ start, end });

                for (let seg of segments) {
                    const { start: segStart, end: segEnd } = seg;
                    const bitList = [];
                    for (let v = segStart; v <= segEnd; v++) {
                        const g = visualToGlobal[v];
                        if (g !== undefined && bitElements[g]) {
                            bitList.push(bitElements[g]);
                        }
                    }
                    if (bitList.length === 0) continue;

                    const minVis = segStart;
                    const maxVis = segEnd;
                    bitList.forEach((el, index) => {
                        const globalIdx = parseInt(el.dataset.bitIndex);
                        const visIdx = parseInt(el.dataset.visualIndex);
                        const col = visIdx % 32;
                        const isFirstOfRow = (col === 0);
                        const isLastOfRow = (col === 31);
                        const isFirstVis = (visIdx === minVis);
                        const isLastVis = (visIdx === maxVis);

                        el.classList.add('field');
                        el.style.background = fillColor;
                        el.style.color = textColor;
                        el.style.borderTop = `1px solid ${borderColor}`;
                        el.style.borderBottom = `1px solid ${borderColor}`;
                        if (isFirstOfRow || isFirstVis) {
                            el.style.borderLeft = `1px solid ${borderColor}`;
                        } else {
                            el.style.borderLeft = 'none';
                        }
                        if (isLastOfRow || isLastVis) {
                            el.style.borderRight = `1px solid ${borderColor}`;
                        } else {
                            el.style.borderRight = 'none';
                        }
                        if (isFirstVis && isFirstOfRow) {
                            el.style.borderRadius = '2px 0 0 2px';
                        } else if (isLastVis && isLastOfRow) {
                            el.style.borderRadius = '0 2px 2px 0';
                        } else {
                            el.style.borderRadius = '0';
                        }
                        const idxSpan = el.querySelector('.bit-index');
                        if (idxSpan) idxSpan.style.display = 'none';
                    });

                    // 在段中间位置显示文字
                    const midVis = Math.ceil((segStart + segEnd) / 2);
                    let midGlobal = visualToGlobal[midVis];
                    if (midGlobal === undefined) {
                        for (let v = midVis; v <= segEnd; v++) {
                            if (visualToGlobal[v] !== undefined) { midGlobal = visualToGlobal[v]; break; }
                        }
                        if (midGlobal === undefined) {
                            for (let v = midVis; v >= segStart; v--) {
                                if (visualToGlobal[v] !== undefined) { midGlobal = visualToGlobal[v]; break; }
                            }
                        }
                    }
                    if (midGlobal !== undefined && bitElements[midGlobal]) {
                        const elMid = bitElements[midGlobal];
                        const text = document.createElement('span');
                        text.className = 'field-text';
                        text.textContent = f.display || f.name;
                        text.style.color = textColor;
                        const len = text.textContent.length;
                        if (len > 6) text.style.fontSize = '9px';
                        else if (len > 4) text.style.fontSize = '10px';
                        else text.style.fontSize = '12px';
                        elMid.appendChild(text);
                    }
                }
            }

            selectedBits.forEach(idx => { const el = bitElements[idx]; if (el) el.classList.add('selected'); });
            updateFieldList();
        }

        // ===== 字段列表管理（只显示字段名） =====
        function updateFieldList() {
            fieldListItems.innerHTML = '';
            if (fields.length === 0) {
                fieldListContainer.classList.remove('visible');
                fieldListItems.innerHTML = '<span style="color:#999; font-size:13px;">暂无字段</span>';
            } else {
                fieldListContainer.classList.add('visible');
                for (let f of fields) {
                    const tag = document.createElement('span');
                    tag.className = 'field-tag';
                    const dot = document.createElement('span');
                    dot.className = 'color-dot';
                    dot.style.background = f.color;
                    tag.appendChild(dot);
                    const text = document.createTextNode(f.name);
                    tag.appendChild(text);
                    const delBtn = document.createElement('button');
                    delBtn.className = 'del-btn';
                    delBtn.textContent = '×';
                    delBtn.title = '删除此字段';
                    delBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        deleteField(f.name);
                    });
                    tag.appendChild(delBtn);
                    fieldListItems.appendChild(tag);
                }
            }
        }

        // ===== 字段操作 =====
        function addFieldFromVisIndices(name, display, visIndices) {
            if (!name) return false;
            if (visIndices.length === 0) return false;
            const unique = Array.from(new Set(visIndices)).sort((a,b) => a-b);
            let toRemove = [];
            for (let f of fields) {
                for (let v of unique) {
                    if (f.visIndices.includes(v)) {
                        toRemove.push(f.name);
                        break;
                    }
                }
            }
            for (let name of toRemove) {
                fields = fields.filter(f => f.name !== name);
            }
            const color = getColorForField(name);
            fields.push({ name, display: display || name, visIndices: unique, color });
            refreshAllFields();
            clearSelection();
            updateStatus(`字段 "${name}" 已添加`);
            return true;
        }

        function deleteField(name) {
            fields = fields.filter(f => f.name !== name);
            refreshAllFields();
            updateStatus(`字段 "${name}" 已删除`);
        }

        function clearAllFields() {
            fields = [];
            colorIndex = 0;
            refreshAllFields();
            updateStatus('所有字段已清空');
        }

        function handleClear() {
            if (selectedBits.length === 0) {
                clearAllFields();
                return;
            }
            const visIndices = getSelectedVisIndices();
            if (visIndices.length === 0) return;
            let toRemove = [];
            for (let f of fields) {
                for (let v of visIndices) {
                    if (f.visIndices.includes(v)) {
                        toRemove.push(f.name);
                        break;
                    }
                }
            }
            if (toRemove.length === 0) {
                updateStatus('未找到与选中范围重叠的字段');
                return;
            }
            for (let name of toRemove) {
                deleteField(name);
            }
            clearSelection();
            updateStatus(`已删除 ${toRemove.length} 个字段`);
        }

        // ===== 导入 =====
        function importFieldLibraryFromFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.fields && Array.isArray(data.fields)) {
                        const libMap = new Map();
                        for (let imp of data.fields) {
                            libMap.set(imp.name, { name: imp.name, display: imp.display || imp.name });
                        }
                        fieldLibrary = Array.from(libMap.values());
                        updateFieldLibSelect();
                        updateStatus(`导入字段库成功 (${fieldLibrary.length} 个字段名称)`);
                    } else {
                        updateStatus('无效的字段库 JSON 格式');
                    }
                } catch (err) {
                    updateStatus('解析 JSON 失败: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function importTlpFromFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.dwCount !== undefined && data.endianness !== undefined && data.fields) {
                        dwCountSelect.value = data.dwCount;
                        endianness = data.endianness;
                        updateEndianButton();
                        fields = [];
                        colorIndex = 0;
                        const libMap = new Map();
                        for (let imp of data.fields) {
                            let visIndices = [];
                            if (imp.visIndices) {
                                visIndices = imp.visIndices;
                            } else if (imp.startBit !== undefined && imp.endBit !== undefined) {
                                for (let g = imp.startBit; g <= imp.endBit; g++) {
                                    const v = globalToVisual[g];
                                    if (v !== undefined) visIndices.push(v);
                                }
                            } else if (imp.start && imp.end) {
                                const startGlobal = imp.start.dw * 32 + imp.start.byte * 8 + imp.start.bit;
                                const endGlobal = imp.end.dw * 32 + imp.end.byte * 8 + imp.end.bit;
                                for (let g = startGlobal; g <= endGlobal; g++) {
                                    const v = globalToVisual[g];
                                    if (v !== undefined) visIndices.push(v);
                                }
                            } else if (imp.positions && Array.isArray(imp.positions)) {
                                for (let pos of imp.positions) {
                                    const g = pos.dw * 32 + pos.byte * 8 + pos.bit;
                                    const v = globalToVisual[g];
                                    if (v !== undefined) visIndices.push(v);
                                }
                            }
                            if (visIndices.length === 0) continue;
                            const color = getColorForField(imp.name);
                            fields.push({
                                name: imp.name,
                                display: imp.display || imp.name,
                                visIndices: visIndices.sort((a,b) => a-b),
                                color: imp.color || color
                            });
                            libMap.set(imp.name, { name: imp.name, display: imp.display || imp.name });
                        }
                        fieldLibrary = Array.from(libMap.values());
                        updateFieldLibSelect();
                        renderGrid();
                        updateStatus(`导入 TLP 成功 (${fields.length} 个字段)`);
                    } else {
                        updateStatus('无效的 TLP JSON 格式');
                    }
                } catch (err) {
                    updateStatus('解析 JSON 失败: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function updateFieldLibSelect() {
            const select = fieldLibSelect;
            select.innerHTML = '<option value="">— 选择 —</option>';
            fieldLibrary.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.name;
                opt.textContent = `${f.name} (${f.display})`;
                select.appendChild(opt);
            });
            fieldLibSelectWrapper.style.display = fieldLibrary.length > 0 ? 'block' : 'none';
        }

        // ===== SVG 导出（根据 whiteBg 决定填充色和边框色） =====
        function getSvgString() {
            const cellWidth = 34;
            const cellHeight = 34;
            const leftMargin = 60;
            const topOffset = 40;
            const rowHeight = cellHeight;
            const totalWidth = leftMargin + 32 * cellWidth + 20;
            const totalHeight = topOffset + dwCount * rowHeight + 10;

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalWidth} ${totalHeight}" font-family="'Microsoft YaHei', Arial, sans-serif">\n`;

            const byteOrder = (endianness === 'little') ? [0,1,2,3] : [3,2,1,0];

            // Byte 标签
            let xOff = leftMargin;
            for (let bIdx of byteOrder) {
                let byteNum = bIdx;
                const xCenter = xOff + (8 * cellWidth) / 2;
                svg += `  <line x1="${xOff}" y1="0" x2="${xOff}" y2="20" stroke="#b0bec5" stroke-width="1"/>\n`;
                svg += `  <line x1="${xOff + 8*cellWidth}" y1="0" x2="${xOff + 8*cellWidth}" y2="20" stroke="#b0bec5" stroke-width="1"/>\n`;
                svg += `  <text x="${xCenter}" y="15" text-anchor="middle" font-size="12" font-weight="600" fill="#546e7a">Byte${byteNum}</text>\n`;
                xOff += 8 * cellWidth;
            }

            // bit 序号行
            const yIndex = 20;
            xOff = leftMargin;
            for (let bIdx of byteOrder) {
                for (let bitInByte = 7; bitInByte >= 0; bitInByte--) {
                    const x = xOff + (7 - bitInByte) * cellWidth;
                    svg += `  <line x1="${x}" y1="${yIndex}" x2="${x}" y2="${yIndex + 20}" stroke="#b0bec5" stroke-width="1"/>\n`;
                    svg += `  <line x1="${x + cellWidth}" y1="${yIndex}" x2="${x + cellWidth}" y2="${yIndex + 20}" stroke="#b0bec5" stroke-width="1"/>\n`;
                    svg += `  <text x="${x + cellWidth/2}" y="${yIndex + 14}" text-anchor="middle" font-size="10" fill="#90a4ae">${bitInByte}</text>\n`;
                }
                xOff += 8 * cellWidth;
            }

            // 背景格子（DW行）
            const dwStartY = 40;
            for (let dw = 0; dw < dwCount; dw++) {
                const yBase = dwStartY + dw * rowHeight;
                svg += `  <text x="10" y="${yBase + cellHeight/2 + 5}" font-size="12" fill="#546e7a">DW${dw}</text>\n`;
                for (let col = 0; col < 32; col++) {
                    const x = leftMargin + col * cellWidth;
                    svg += `  <rect x="${x}" y="${yBase}" width="${cellWidth}" height="${cellHeight}" fill="#f5f5f5" stroke="#ccc" stroke-width="0.5"/>\n`;
                }
            }

            // 字段色块
            for (let f of fields) {
                const visIndices = f.visIndices.slice().sort((a,b) => a-b);
                if (visIndices.length === 0) continue;
                const color = f.color;
                const fillColor = whiteBg ? '#FFFFFF' : color;
                const borderColor = whiteBg ? '#000000' : color;
                const textColor = whiteBg ? '#000000' : '#FFFFFF';

                const segments = [];
                let start = visIndices[0], end = visIndices[0];
                for (let i = 1; i < visIndices.length; i++) {
                    if (visIndices[i] === end + 1) {
                        end = visIndices[i];
                    } else {
                        segments.push({ start, end });
                        start = visIndices[i];
                        end = visIndices[i];
                    }
                }
                segments.push({ start, end });

                for (let seg of segments) {
                    const { start: segStart, end: segEnd } = seg;
                    const startRow = Math.floor(segStart / 32);
                    const endRow = Math.floor(segEnd / 32);
                    const startCol = segStart % 32;
                    const endCol = segEnd % 32;
                    if (startRow === endRow) {
                        const x = leftMargin + startCol * cellWidth;
                        const y = dwStartY + startRow * rowHeight;
                        const width = (endCol - startCol + 1) * cellWidth;
                        svg += `  <rect x="${x}" y="${y}" width="${width}" height="${cellHeight}" fill="${fillColor}" stroke="${borderColor}" stroke-width="1"/>\n`;
                    } else {
                        const x1 = leftMargin + startCol * cellWidth;
                        const y1 = dwStartY + startRow * rowHeight;
                        const width1 = (32 - startCol) * cellWidth;
                        svg += `  <rect x="${x1}" y="${y1}" width="${width1}" height="${cellHeight}" fill="${fillColor}" stroke="${borderColor}" stroke-width="1"/>\n`;
                        for (let r = startRow + 1; r < endRow; r++) {
                            const yMid = dwStartY + r * rowHeight;
                            svg += `  <rect x="${leftMargin}" y="${yMid}" width="${32 * cellWidth}" height="${cellHeight}" fill="${fillColor}" stroke="${borderColor}" stroke-width="1"/>\n`;
                        }
                        const xLast = leftMargin;
                        const yLast = dwStartY + endRow * rowHeight;
                        const widthLast = (endCol + 1) * cellWidth;
                        svg += `  <rect x="${xLast}" y="${yLast}" width="${widthLast}" height="${cellHeight}" fill="${fillColor}" stroke="${borderColor}" stroke-width="1"/>\n`;
                    }
                }
            }

            // 字段文字（绝对居中）
            for (let f of fields) {
                const visIndices = f.visIndices.slice().sort((a,b) => a-b);
                if (visIndices.length === 0) continue;
                const segments = [];
                let start = visIndices[0], end = visIndices[0];
                for (let i = 1; i < visIndices.length; i++) {
                    if (visIndices[i] === end + 1) {
                        end = visIndices[i];
                    } else {
                        segments.push({ start, end });
                        start = visIndices[i];
                        end = visIndices[i];
                    }
                }
                segments.push({ start, end });

                const textColor = '#000000';
                for (let seg of segments) {
                    const { start: segStart, end: segEnd } = seg;
                    const avgVis = (segStart + segEnd) / 2;
                    const col = avgVis - Math.floor(avgVis / 32) * 32;
                    const row = Math.floor(avgVis / 32);
                    const x = leftMargin + col * cellWidth + cellWidth / 2;
                    const y = dwStartY + row * rowHeight + cellHeight/2 + 3;
                    const text = f.display || f.name;
                    const fontSize = text.length > 6 ? 10 : 14;
                    svg += `  <text x="${x}" y="${y}" text-anchor="middle" font-size="${fontSize}" font-weight="bold" fill="${textColor}" text-shadow="0 1px 2px rgba(255,255,255,0.3)">${text}</text>\n`;
                }
            }

            svg += '</svg>';
            return svg;
        }

        // ===== 导出 SVG =====
        function exportSvgFile() {
            let fileName = prompt('请输入SVG文件名（不含扩展名）:', 'tlp');
            if (fileName === null) fileName = 'tlp';
            if (fileName.trim() === '') fileName = 'tlp';
            const svgStr = getSvgString();
            const blob = new Blob([svgStr], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName + '.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            updateStatus('SVG 导出成功');
        }

        function previewSvg() {
            const svgStr = getSvgString();
            previewContainer.innerHTML = svgStr;
            previewModal.classList.add('active');
        }

        function closePreview() { previewModal.classList.remove('active'); }

        // ===== 导出 JSON =====
        function exportJson() {
            let fileName = prompt('请输入JSON文件名（不含扩展名）:', 'tlp');
            if (fileName === null) fileName = 'tlp';
            if (fileName.trim() === '') fileName = 'tlp';
            const exportFields = fields.map(f => {
                const positions = f.visIndices.map(v => {
                    const g = visualToGlobal[v];
                    if (g === undefined) return null;
                    const p = globalToPosition(g);
                    return { dw: p.dw, byte: p.byte, bit: p.bit };
                }).filter(p => p !== null);
                return {
                    name: f.name,
                    display: f.display,
                    positions: positions,
                    color: f.color
                };
            });
            const data = { dwCount, endianness, fields: exportFields };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            updateStatus('JSON 导出成功');
        }

        // ===== 编辑模态框 =====
        function openEditModal() {
            const visIndices = getSelectedVisIndices();
            if (visIndices.length === 0) {
                updateStatus('请先选中至少一个bit');
                return;
            }
            const firstVis = visIndices[0];
            const lastVis = visIndices[visIndices.length-1];
            const startGlobal = visualToGlobal[firstVis];
            const endGlobal = visualToGlobal[lastVis];
            const startStr = formatPosition(startGlobal);
            const endStr = formatPosition(endGlobal);
            modalBitInfo.textContent = `选中 ${visIndices.length} 个视觉格子 (${startStr} → ${endStr})`;
            modalFieldName.value = '';
            modalFieldDisplay.value = '';
            fieldLibSelectWrapper.style.display = fieldLibrary.length > 0 ? 'block' : 'none';
            if (fieldLibrary.length > 0) fieldLibSelect.value = '';
            modalOverlay.classList.add('active');
            setTimeout(() => modalFieldName.focus(), 100);
        }

        function closeModal() { modalOverlay.classList.remove('active'); }

        fieldLibSelect.addEventListener('change', function() {
            const selected = this.value;
            if (selected) {
                const found = fieldLibrary.find(f => f.name === selected);
                if (found) {
                    modalFieldName.value = found.name;
                    modalFieldDisplay.value = found.display || found.name;
                }
            }
        });

        modalConfirmBtn.addEventListener('click', function() {
            const visIndices = getSelectedVisIndices();
            if (visIndices.length === 0) {
                updateStatus('请先选中bit');
                closeModal();
                return;
            }
            const name = modalFieldName.value.trim();
            const display = modalFieldDisplay.value.trim() || name;
            if (!name) {
                updateStatus('请输入字段名');
                return;
            }
            if (addFieldFromVisIndices(name, display, visIndices)) {
                closeModal();
            }
        });

        modalCancelBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        previewCloseBtn.addEventListener('click', closePreview);
        previewExportBtn.addEventListener('click', function() { exportSvgFile(); closePreview(); });
        previewModal.addEventListener('click', function(e) { if (e.target === this) closePreview(); });

        document.addEventListener('keydown', function(e) {
            if (modalOverlay.classList.contains('active')) {
                if (e.key === 'Escape') closeModal();
                else if (e.key === 'Enter' && (document.activeElement === modalFieldName || document.activeElement === modalFieldDisplay || document.activeElement === fieldLibSelect)) {
                    modalConfirmBtn.click();
                }
            }
            if (previewModal.classList.contains('active') && e.key === 'Escape') closePreview();
        });

        // ===== 点击空白取消选中 =====
        container.addEventListener('mousedown', function(e) {
            if (e.target === this || e.target === container) {
                clearSelection();
                updateStatus('已取消选中');
            }
        });

        // ===== 白底切换按钮 =====
        function toggleWhiteBg() {
            whiteBg = !whiteBg;
            toggleWhiteBgBtn.textContent = whiteBg ? '恢复配色' : '白底';
            toggleWhiteBgBtn.classList.toggle('active', whiteBg);
            refreshAllFields();
            updateStatus(whiteBg ? '已切换到白底+黑边框模式' : '已恢复正常配色');
        }
        toggleWhiteBgBtn.addEventListener('click', toggleWhiteBg);

        // ===== 事件绑定 =====
        applyBtn.addEventListener('click', function() {
            renderGrid();
            updateStatus('配置已应用');
        });
        clearFieldsBtn.addEventListener('click', handleClear);
        editSelectionBtn.addEventListener('click', openEditModal);
        previewSvgBtn.addEventListener('click', previewSvg);
        exportSvgBtn.addEventListener('click', exportSvgFile);
        exportJsonBtn.addEventListener('click', exportJson);

        importFieldBtn.addEventListener('click', function() { fieldFileInput.click(); });
        fieldFileInput.addEventListener('change', function() {
            if (this.files[0]) { importFieldLibraryFromFile(this.files[0]); this.value = ''; }
        });

        importTlpBtn.addEventListener('click', function() { tlpFileInput.click(); });
        tlpFileInput.addEventListener('change', function() {
            if (this.files[0]) { importTlpFromFile(this.files[0]); this.value = ''; }
        });

        recolorBtn.addEventListener('click', recolorFields);

        // 初始化
        updateEndianButton();
        renderGrid();

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'e') { e.preventDefault(); openEditModal(); }
        });
    })();
</script>
</body>
</html>
