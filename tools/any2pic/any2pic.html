                                            if (xx < 0 || xx >= width) continue;
                                            const idx2 = (yy * width + xx) * 4;
                                            rSum += corrected.data[idx2];
                                            gSum += corrected.data[idx2 + 1];
                                            bSum += corrected.data[idx2 + 2];
                                            cnt++;
                                        }
                                    }
                                    const rAvg = Math.min(255, (rSum / cnt) * colorGains.r),
                                        gAvg = Math.min(255, (gSum / cnt) * colorGains.g),
                                        bAvg = Math.min(255, (bSum / cnt) * colorGains.b);
                                    let minDist = Infinity,
                                        bestIdx = 0;
                                    for (let p = 0; p < palette.length; p++) {
                                        const dr = rAvg - palette[p][0];
                                        const dg = gAvg - palette[p][1];
                                        const db = bAvg - palette[p][2];
                                        const dist = dr * dr + dg * dg + db * db;
                                        if (dist < minDist) { minDist = dist;
                                            bestIdx = p; }
                                    }
                                    const bpp = BPP[mode];
                                    for (let i = bpp - 1; i >= 0; i--) {
                                        bits[idx++] = (bestIdx >> i) & 1;
                                    }
                                }
                            }
                        }

                        log(`位流长度: ${bits.length} bits`);
                        const debugImages = {
                            original: rawImageData,
                            oriented: cameraPreprocess?.stages.oriented,
                            enhanced: cameraPreprocess?.stages.enhanced || cameraPreprocess?.stages.lensCorrected,
                            cropped: corrected,
                            denoised: binToImageData(opened, width, height),
                            samplingMarked: markSamplingPoints(corrected, points, '#ff4d4f')
                        };
                        displayDebugImages(debugImages, rulerData);

                        // ---------- 定位页头 ----------
                        let foundOffset = -1;
                        let bestTotalPages = 0,
                            bestPageIdx = 0,
                            bestDataLen = 0,
                            bestCrc = 0,
                            bestEccLen = 0;
                        let bestDataBytes = null;

                        let syncPos = -1;
                        for (let i = 0; i <= Math.min(bits.length - SYNC_BITS, 16); i++) {
                            let match = true;
                            for (let j = 0; j < SYNC_BITS; j++) {
                                if (bits[i + j] !== ((SYNC_PATTERN >> (SYNC_BITS - 1 - j)) & 1)) {
                                    match = false;
                                    break;
                                }
                            }
                            if (match) { syncPos = i; break; }
                        }
                        let startOffset = (syncPos !== -1) ? syncPos + SYNC_BITS : 0;
                        if (syncPos !== -1) log(`同步头位置: ${syncPos}`);
                        else log('未找到同步头，尝试位偏移CRC定位');

                        for (let off = 0; off < 16; off++) {
                            const absOff = startOffset + off;
                            if (bits.length < absOff + 128) break;
                            const candidateBits = bits.slice(absOff);
                            const headerBytes = bitsToBytes(candidateBits.slice(0, 128));
                            const dv = new DataView(headerBytes.buffer);
                            const totalPages = dv.getUint16(0, false);
                            const pageIdx = dv.getUint16(2, false);
                            const dataLen = dv.getUint32(4, false);
                            const crcStored = dv.getUint32(8, false);
                            const eccLen = dv.getUint16(12, false);
                            const sessionTag = dv.getUint16(14, false);

                            if (totalPages < 1 || totalPages > 1000) continue;
                            if (pageIdx >= totalPages) continue;
                            if (dataLen === 0 || dataLen > bits.length * 8) continue;

                            const dataBytesLen = Math.floor(dataLen / 8);
                            const totalBytesLen = dataBytesLen + eccLen;
                            if (candidateBits.length < 128 + totalBytesLen * 8) continue;

                            const dataWithEccBytes = bitsToBytes(candidateBits.slice(128, 128 + totalBytesLen * 8));
                            const rsResult = rsDecode(dataWithEccBytes, eccLen);
                            let dataBytes = rsResult.data;
                            if (dataBytes.length > dataBytesLen) dataBytes = dataBytes.slice(0, dataBytesLen);
                            const crcCalc = crc32(dataBytes);
                            if (crcCalc === crcStored) {
                                foundOffset = absOff;
                                bestTotalPages = totalPages;
                                bestPageIdx = pageIdx;
                                bestDataLen = dataLen;
                                bestCrc = crcStored;
                                bestEccLen = eccLen;
                                var bestSessionTag = sessionTag;
                                bestDataBytes = dataBytes;
                                log(`CRC校验通过，偏移 ${absOff}${rsResult.corrected ? `，RS 已纠正 ${rsResult.corrected} 字节` : ''}`);
                                break;
                            }
                        }

                        if (foundOffset === -1) {
                            throw new Error('所有偏移尝试均未通过CRC校验');
                        }

                        const totalPages = bestTotalPages;
                        const pageIdx = bestPageIdx;
                        const dataLen = bestDataLen;
                        const eccLen = bestEccLen;
                        let dataBytes = bestDataBytes;

                        log(`总页数: ${totalPages}, 当前页: ${pageIdx}, 数据长度: ${dataLen} bits, ECC: ${eccLen} bytes`);

                        // ---------- 第0页解析（正确提取全部数据） ----------
                        let fileName = null,
                            fileSize = 0,
                            transportSize = 0,
                            compression = 'none',
                            originalSha = null,
                            sessionId = null,
                            protocolVersion = 1;
                        if (pageIdx === 0) {
                            console.log('===== 第0页详细诊断 =====');
                            console.log('dataBytes 总长度:', dataBytes.length);

                            // 在 dataBytes 中搜索魔数 0xDEADBEEF
                            const magicBytes = new Uint8Array(4);
                            new DataView(magicBytes.buffer).setUint32(0, MAGIC, false);
                            let magicOffset = -1;
                            for (let i = 0; i <= dataBytes.length - 4; i++) {
                                let match = true;
                                for (let j = 0; j < 4; j++) {
                                    if (dataBytes[i + j] !== magicBytes[j]) { match = false; break; }
                                }
                                if (match) { magicOffset = i; break; }
                            }
                            console.log('魔数偏移:', magicOffset);
                            if (magicOffset === -1) throw new Error('未找到魔数 0xDEADBEEF');

                            const magicStart = magicOffset;
                            console.log('magicStart:', magicStart);
                            const dv2 = new DataView(dataBytes.buffer, dataBytes.byteOffset + magicStart, dataBytes
                                .byteLength - magicStart);
                            const magic = dv2.getUint32(0, false);
                            if (magic !== MAGIC) throw new Error(`魔数不匹配: 0x${magic.toString(16)}`);

                            let nameLen = dv2.getUint16(4, false);
                            console.log('nameLenBytes:', nameLen);
                            const v3EnvelopeBytes = 6 + PROTOCOL_SIGNATURE.length + 1 + SESSION_ID_BYTES + 4 + 4 + 32;
                            const legacyEnvelopeBytes = 6 + 4 + 32;
                            const maxNameLen = dataBytes.length - legacyEnvelopeBytes - magicStart;
                            if (nameLen > maxNameLen || nameLen < 0) {
                                console.warn(`nameLen 异常，截断至 ${Math.max(0, maxNameLen)}`);
                                nameLen = Math.max(0, Math.min(nameLen, maxNameLen));
                            }
                            const nameBytes = dataBytes.slice(magicStart + 6, magicStart + 6 + nameLen);
                            fileName = new TextDecoder().decode(nameBytes) || 'restored_file';
                            const metaStart = magicStart + 6 + nameLen;
                            const signatureMatches = PROTOCOL_SIGNATURE.every((value, index) => dataBytes[metaStart + index] === value);
                            const isV3Envelope = signatureMatches && dataBytes.length >= magicStart + nameLen + v3EnvelopeBytes;
                            if (isV3Envelope) {
                                const compressionType = dataBytes[metaStart + PROTOCOL_SIGNATURE.length];
                                const sessionStart = metaStart + PROTOCOL_SIGNATURE.length + 1;
                                sessionId = dataBytes.slice(sessionStart, sessionStart + SESSION_ID_BYTES);
                                const metadataView = new DataView(dataBytes.buffer, dataBytes.byteOffset + sessionStart + SESSION_ID_BYTES, 8);
                                fileSize = metadataView.getUint32(0, false);
                                transportSize = metadataView.getUint32(4, false);
                                const shaStart = sessionStart + SESSION_ID_BYTES + 8;
                                originalSha = dataBytes.slice(shaStart, shaStart + 32);
                                dataBytes = dataBytes.slice(shaStart + 32);
                                compression = compressionType === 1 ? 'lzss' : 'none';
                                protocolVersion = 3;
                                console.log('v3 传输元数据:', { compression, fileSize, transportSize, sessionId: Array.from(sessionId) });
                            } else {
                                // 兼容此前生成的页面：名称后直接是文件大小、数据和末尾 SHA-256。
                                if (dataBytes.length < magicStart + nameLen + legacyEnvelopeBytes) throw new Error('旧版文件元数据不完整');
                                fileSize = new DataView(dataBytes.buffer, dataBytes.byteOffset + metaStart, 4).getUint32(0, false);
                                transportSize = fileSize;
                                dataBytes = dataBytes.slice(metaStart + 4);
                                compression = 'none';
                                originalSha = null;
                                console.log('旧版传输元数据:', { fileSize, transportSize });
                            }
                        }

                        log('========== 解码成功 ==========');
                        return {
                            fileName,
                            fileSize,
                            pageIdx,
                            totalPages,
                            fileData: dataBytes,
                            transportSize,
                            compression,
                            originalSha,
                            sessionId,
                            sessionTag: bestSessionTag || 0,
                            protocolVersion,
                            crcOk: true,
                            shaOk: false
                        };
                    } catch (err) {
                        log('解码异常: ' + err.message);
                        throw err;
                    }
                }

                // ---------- 辅助函数 ----------
                function getImageDataFromSource(source) {
                    let canvas, ctx, w, h;
                    if (source instanceof HTMLImageElement) {
                        w = source.naturalWidth || source.width;
                        h = source.naturalHeight || source.height;
                        canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        ctx = canvas.getContext('2d');
                        ctx.drawImage(source, 0, 0);
                    } else if (source instanceof HTMLCanvasElement) {
                        canvas = source;
                        w = canvas.width;
                        h = canvas.height;
                        ctx = canvas.getContext('2d');
                    } else {
                        throw new Error('不支持的图片源');
                    }
                    if (w === 0 || h === 0) throw new Error('图片尺寸为零');
                    return ctx.getImageData(0, 0, w, h);
                }

                function binarize(imageData) {
                    const { width, height, data } = imageData;
                    const bin = new Uint8Array(width * height);
                    for (let i = 0; i < width * height; i++) {
                        const idx = i * 4;
                        const gray = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                        bin[i] = gray > 128 ? 1 : 0;
                    }
                    return bin;
                }

                function erode5x5(bin, width, height) {
                    const eroded = new Uint8Array(bin.length);
                    const half = 2;
                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            let allOnes = true;
                            for (let dy = -half; dy <= half; dy++) {
                                for (let dx = -half; dx <= half; dx++) {
                                    const px = Math.min(Math.max(x + dx, 0), width - 1);
                                    const py = Math.min(Math.max(y + dy, 0), height - 1);
                                    if (bin[py * width + px] === 0) { allOnes = false; break; }
                                }
                                if (!allOnes) break;
                            }
                            eroded[y * width + x] = allOnes ? 1 : 0;
                        }
                    }
                    return eroded;
                }

                function dilate5x5(bin, width, height) {
                    const dilated = new Uint8Array(bin.length);
                    const half = 2;
                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            let anyOne = false;
                            for (let dy = -half; dy <= half; dy++) {
                                for (let dx = -half; dx <= half; dx++) {
                                    const px = Math.min(Math.max(x + dx, 0), width - 1);
                                    const py = Math.min(Math.max(y + dy, 0), height - 1);
                                    if (bin[py * width + px] === 1) { anyOne = true; break; }
                                }
                                if (anyOne) break;
                            }
                            dilated[y * width + x] = anyOne ? 1 : 0;
                        }
                    }
                    return dilated;
                }

                function opening5x5(bin, width, height) {
                    const eroded = erode5x5(bin, width, height);
                    return dilate5x5(eroded, width, height);
                }

                function binToImageData(bin, width, height) {
                    const imageData = new ImageData(width, height);
                    const data = imageData.data;
                    for (let i = 0; i < width * height; i++) {
                        const val = bin[i] * 255;
                        const idx = i * 4;
                        data[idx] = val;
                        data[idx + 1] = val;
                        data[idx + 2] = val;
                        data[idx + 3] = 255;
                    }
                    return imageData;
                }

                function markSamplingPoints(imageData, points, color) {
                    const canvas = document.createElement('canvas');
                    canvas.width = imageData.width;
                    canvas.height = imageData.height;
                    const ctx = canvas.getContext('2d');
                    ctx.putImageData(imageData, 0, 0);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    for (const p of points) {
                        ctx.beginPath();
                        ctx.moveTo(p.x - 4, p.y);
                        ctx.lineTo(p.x + 4, p.y);
                        ctx.moveTo(p.x, p.y - 4);
                        ctx.lineTo(p.x, p.y + 4);
                        ctx.stroke();
                    }
                    return ctx.getImageData(0, 0, canvas.width, canvas.height);
                }

                function displayDebugImages(images, rulerData) {
                    debugSection.style.display = 'block';
                    const grid = debugGrid;
                    grid.innerHTML = '';
                    const labels = [
                        { key: 'original', label: '原始图像' },
                        { key: 'oriented', label: '方向归一化' },
                        { key: 'enhanced', label: '颜色与镜头校正' },
                        { key: 'cropped', label: '边框归一化裁剪' },
                        { key: 'denoised', label: '数据区去噪' },
                        { key: 'samplingMarked', label: '采样点标记' }
                    ].filter(item => images[item.key]);
                    for (const item of labels) {
                        const div = document.createElement('div');
                        div.className = 'debug-item';
                        const canvas = document.createElement('canvas');
                        canvas.width = 300;
                        canvas.height = 300;
                        const ctx = canvas.getContext('2d');
                        const imgData = images[item.key];
                        if (imgData) {
                            const tempCanvas = document.createElement('canvas');
                            tempCanvas.width = imgData.width;
                            tempCanvas.height = imgData.height;
                            tempCanvas.getContext('2d').putImageData(imgData, 0, 0);
                            ctx.drawImage(tempCanvas, 0, 0, 300, 300);
                        }
                        div.appendChild(canvas);
                        const label = document.createElement('div');
                        label.className = 'label';
                        label.textContent = item.label;
                        div.appendChild(label);
                        grid.appendChild(div);
                    }
                    if (rulerData) {
                        const { leftEdges, rightEdges, topEdges, bottomEdges, totalCols, totalRows, spread, stripeDepth, minRun, samplingMode } = rulerData;
                        const ok = spread <= Math.max(4, Math.round(Math.max(totalCols, totalRows) * 0.08));
                        debugRulerInfo.classList.remove('hidden');
                        debugRulerInfo.innerHTML = `
                            <span>标尺跳变计数：左=${leftEdges} 右=${rightEdges} 上=${topEdges} 下=${bottomEdges}</span>
                            <span class="${ok ? 'ok' : 'err'}">→ 采用稳健统计网格: ${totalCols}×${totalRows} ${ok ? '✅' : '❌ 不稳定'}</span>
                            <span>${samplingMode}；采样深度=${stripeDepth}px，最短色段=${minRun}px</span>
                        `;
                    }
                    if (!debugVisible) {
                        debugGrid.style.display = 'none';
                        debugToggle.textContent = '🔍 显示调试图像';
                    } else {
                        debugGrid.style.display = 'grid';
                        debugToggle.textContent = '🔍 隐藏调试图像';
                    }
                }

                let debugVisible = false;
                debugToggle.addEventListener('click', function() {
                    debugVisible = !debugVisible;
                    debugGrid.style.display = debugVisible ? 'grid' : 'none';
                    this.textContent = debugVisible ? '🔍 隐藏调试图像' : '🔍 显示调试图像';
                });

                function loadImageFromBlob(blob) {
                    return new Promise((resolve, reject) => {
                        const url = URL.createObjectURL(blob);
                        const img = new Image();
                        img.onload = () => { resolve(img);
                            URL.revokeObjectURL(url); };
                        img.onerror = () => { reject(new Error('图片加载失败'));
                            URL.revokeObjectURL(url); };
                        img.src = url;
                    });
                }

                // ---------- 状态管理 ----------
                let collectedPages = [];
                let failedItems = [];
                let lastScanFailureKey = '';
                let lastScanFailureAt = 0;

                function getKnownTotalPages() {
                    const totals = collectedPages.map(item => item.totalPages).filter(Number.isInteger);
                    return totals.length ? Math.max(...totals) : 0;
                }

                function renderPageMatrix() {
                    const total = getKnownTotalPages();
                    decodePageMatrix.innerHTML = '';
                    const header = document.createElement('div');
                    header.className = 'page-matrix-header';
                    if (!total) {
                        header.textContent = '页状态将在成功读取任意一张传输页后显示。';
                        decodePageMatrix.appendChild(header);
                        return;
                    }
                    const successIndexes = new Set(collectedPages.map(item => item.pageIdx));
                    const failedByIndex = new Map();
                    for (const item of failedItems) {
                        if (Number.isInteger(item.pageIdx) && item.pageIdx >= 0 && item.pageIdx < total) failedByIndex.set(item.pageIdx, item);
                    }
                    const successCount = successIndexes.size;
                    const failedCount = failedByIndex.size;
                    header.innerHTML = `<span>页状态：✅ 已收集 ${successCount} · 🟠 未检测 ${total - successCount - failedCount} · ❌ 有错误 ${failedCount}</span><span>共 ${total} 页</span>`;
                    const grid = document.createElement('div');
                    grid.className = 'page-matrix-grid';
                    for (let index = 0; index < total; index++) {
                        const cell = document.createElement('div');
                        const state = successIndexes.has(index) ? 'success' : failedByIndex.has(index) ? 'failed' : 'missing';
                        cell.className = `page-cell ${state}`;
                        cell.title = state === 'success' ? `第 ${index + 1} 页已收集` : state === 'failed' ? `第 ${index + 1} 页检测有错误：${failedByIndex.get(index).errorMsg}` : `第 ${index + 1} 页尚未检测到`;
                        cell.innerHTML = `<span class="page-number">${String(index + 1).padStart(2, '0')}</span><span>${state === 'success' ? '✅' : state === 'failed' ? '❌' : '🟠'}</span>`;
                        grid.appendChild(cell);
                    }
                    decodePageMatrix.append(header, grid);
                }

                function updateDecodeUI() {
                    try {
                        const list = decodeCollectedList;
                        list.innerHTML = '';
                        for (const item of collectedPages) {
                            const div = document.createElement('div');
                            div.className = 'collected-item';
                            const pageSpan = document.createElement('span');
                            pageSpan.className = 'page-badge';
                            pageSpan.textContent = `第 ${item.pageIdx+1}/${item.totalPages} 页`;
                            div.appendChild(pageSpan);

                            if (item.pageIdx === 0 && item.fileName) {
                                const nameSpan = document.createElement('span');
                                nameSpan.className = 'file-name';
                                nameSpan.textContent = `📎 ${item.fileName}`;
                                div.appendChild(nameSpan);
                                if (item.fileSize) {
                                    const sizeSpan = document.createElement('span');
                                    sizeSpan.className = 'file-size';
                                    sizeSpan.textContent = `(${formatSize(item.fileSize)})`;
                                    div.appendChild(sizeSpan);
                                }
                            } else {
                                const dataLabel = document.createElement('span');
                                dataLabel.textContent = `📦 数据块`;
                                dataLabel.style.color = '#5b6f87';
                                div.appendChild(dataLabel);
                            }
                            if (item.fileData) {
                                const lenSpan = document.createElement('span');
                                lenSpan.className = 'data-len';
                                lenSpan.textContent = `📊 ${item.fileData.length} bytes`;
                                div.appendChild(lenSpan);
                            }
                            const crcSpan = document.createElement('span');
                            crcSpan.textContent = item.crcOk ? '✅' : '❌';
                            crcSpan.style.fontSize = '14px';
                            div.appendChild(crcSpan);

                            const removeBtn = document.createElement('span');
                            removeBtn.className = 'remove';
                            removeBtn.textContent = '×';
                            removeBtn.addEventListener('click', () => {
                                const idx = collectedPages.indexOf(item);
                                if (idx > -1) {
                                    collectedPages.splice(idx, 1);
                                    updateDecodeUI();
                                }
                            });
                            div.appendChild(removeBtn);
                            list.appendChild(div);
                        }

                        renderPageMatrix();
                        const missingList = decodeMissingList;
                        missingList.innerHTML = '';
                        if (collectedPages.length > 0) {
                            const total = collectedPages[0].totalPages;
                            const existing = new Set(collectedPages.map(p => p.pageIdx));
                            const missing = [];
                            for (let i = 0; i < total; i++) {
                                if (!existing.has(i)) missing.push(i);
                            }
                            if (missing.length > 0) {
                            const label = document.createElement('span');
                            label.textContent = `下一步：补传第 ${missing.slice(0, 8).map(index => index + 1).join('、')}${missing.length > 8 ? ' 等' : ''} 页`;
                            label.style.fontWeight = 'bold';
                            missingList.appendChild(label);
                                for (const m of missing) {
                                    const badge = document.createElement('span');
                                    badge.className = 'missing-badge';
                                    badge.textContent = m + 1;
                                    missingList.appendChild(badge);
                                }
                            } else {
                                const label = document.createElement('span');
                                label.textContent = '✅ 所有页已收集';
                                label.style.color = '#1d7a4f';
                                missingList.appendChild(label);
                            }
                        } else {
                            const label = document.createElement('span');
                            label.textContent = '尚未收集任何页';
                            label.style.color = '#5b6f87';
                            missingList.appendChild(label);
                        }

                        const failedList = decodeFailedList;
                        failedList.innerHTML = '';
                        if (failedItems.length > 0) {
                            const header = document.createElement('div');
                            header.textContent = '⚠️ 失败记录';
                            header.style.fontWeight = 'bold';
                            failedList.appendChild(header);
                            for (const item of failedItems) {
                                const div = document.createElement('div');
                                div.className = 'failed-item';
                                const msg = document.createElement('span');
                                msg.className = 'error-msg';
                                msg.textContent = `页 ${item.pageIdx !== undefined ? item.pageIdx+1 : '?'}: ${item.errorMsg}`;
                                div.appendChild(msg);
                                const retryBtn = document.createElement('button');
                                retryBtn.className = 'btn-retry';
                                retryBtn.textContent = '重试';
                                retryBtn.addEventListener('click', () => {
                                    retryFailedItem(item);
                                });
                                div.appendChild(retryBtn);
                                const ignoreBtn = document.createElement('button');
                                ignoreBtn.className = 'btn-ignore';
                                ignoreBtn.textContent = '忽略';
                                ignoreBtn.addEventListener('click', () => {
                                    const idx = failedItems.indexOf(item);
                                    if (idx > -1) { failedItems.splice(idx, 1);
                                        updateDecodeUI(); }
                                });
                                div.appendChild(ignoreBtn);
                                failedList.appendChild(div);
                            }
                        }

                        const successCount = collectedPages.length;
                        decodeSuccessCount.textContent = successCount;
                        const totalPages = collectedPages.length > 0 ? collectedPages[0].totalPages : 0;
                        decodeMissingCount.textContent = totalPages > 0 ? (totalPages - successCount) : '-';
                        decodeFailCount.textContent = failedItems.length;

                        const complete = collectedPages.length > 0 && collectedPages.length === collectedPages[0]?.totalPages && collectedPages.every(item => item.crcOk);
                        if (complete) queueAutomaticAssembly();
                    } catch (err) {
                        console.error('updateDecodeUI 错误:', err);
                    }
                }

                function retryFailedItem(item) {
                    const source = item.source;
                    const mode = ENCODE_MODE;
                    try {
                        const result = decodeImageFromSource(source, mode);
                        if (collectedPages.some(p => p.pageIdx === result.pageIdx)) {
                            showStatus(decodeStatus, 'warn', '⚠️ 页面已存在');
                            return;
                        }
                        const newItem = {
                            source,
                            pageIdx: result.pageIdx,
                            totalPages: result.totalPages,
                            fileName: result.fileName,
                            fileSize: result.fileSize,
                            fileData: result.fileData,
                            transportSize: result.transportSize,
                            compression: result.compression,
                            originalSha: result.originalSha,
                            sessionId: result.sessionId,
                            sessionTag: result.sessionTag,
                            protocolVersion: result.protocolVersion,
                            crcOk: result.crcOk
                        };
                        collectedPages.push(newItem);
                        collectedPages.sort((a, b) => a.pageIdx - b.pageIdx);
                        const idx = failedItems.indexOf(item);
                        if (idx > -1) failedItems.splice(idx, 1);
                        updateDecodeUI();
                        showStatus(decodeStatus, 'success', `✅ 重试成功，已添加第 ${result.pageIdx+1} 页`);
                    } catch (err) {
                        showStatus(decodeStatus, 'error', '❌ 重试失败：' + err.message);
                        item.errorMsg = err.message;
                        item.retryCount++;
                        updateDecodeUI();
                    }
                }

                async function tryAddImageSource(source, options = {}) {
                    try {
                        const result = decodeImageFromSource(source, ENCODE_MODE, options);
                        const activePageZero = collectedPages.find(item => item.pageIdx === 0);
                        const activeTag = activePageZero?.sessionTag || collectedPages[0]?.sessionTag || 0;
                        if (activeTag && result.sessionTag && activeTag !== result.sessionTag) {
                            showStatus(decodeStatus, 'warn', '⚠️ 检测到另一传输批次的页面，已忽略');
                            return { success: false, reason: 'other-session' };
                        }
                        if (collectedPages.some(item => item.pageIdx === result.pageIdx)) {
                            showStatus(decodeStatus, 'warn', '⚠️ 页面已存在');
                            return { success: false, reason: 'duplicate' };
                        }
                        const item = {
                            source,
                            pageIdx: result.pageIdx,
                            totalPages: result.totalPages,
                            fileName: result.fileName,
                            fileSize: result.fileSize,
                            fileData: result.fileData,
                            transportSize: result.transportSize,
                            compression: result.compression,
                            originalSha: result.originalSha,
                            sessionId: result.sessionId,
                            sessionTag: result.sessionTag,
                            protocolVersion: result.protocolVersion,
                            crcOk: result.crcOk
                        };
                        collectedPages.push(item);
                        collectedPages.sort((a, b) => a.pageIdx - b.pageIdx);
                        updateDecodeUI();
                        showParseDetail(item);
                        showStatus(decodeStatus, 'success', `✅ 成功解析第 ${result.pageIdx+1} 页`);
                        return { success: true, pageIdx: result.pageIdx, totalPages: result.totalPages };
                    } catch (err) {
                        log(`❌ 添加失败: ${err.message}`);
                        const failureKey = err.message;
                        const now = Date.now();
                        const suppressFailure = options.silentFailure || (failureKey === lastScanFailureKey && now - lastScanFailureAt < 2500);
                        lastScanFailureKey = failureKey;
                        lastScanFailureAt = now;
                        if (!suppressFailure) {
                            showStatus(decodeStatus, 'error', '❌ 解码失败：' + err.message);
                            let pageIdx = undefined;
                            const match = err.message.match(/页\s*(\d+)/);
                            if (match) pageIdx = parseInt(match[1]) - 1;
                            failedItems.push({
                                pageIdx,
                                errorMsg: err.message,
                                source,
                                retryCount: 0,
                                timestamp: now
                            });
                            updateDecodeUI();
                        }
                        return { success: false, reason: err.message };
                    }
                }

                function showParseDetail(item) {
                    const toast = document.createElement('div');
                    toast.className = 'parse-detail-toast';
                    const time = new Date().toLocaleTimeString();
                    let html = `<span class="label">✅ 解析成功</span>`;
                    html += `<span>页 ${item.pageIdx+1}/${item.totalPages}</span>`;
                    if (item.fileName) {
                        html += `<span>📎 <strong>${item.fileName}</strong></span>`;
                    }
                    if (item.fileSize) {
                        html += `<span>📦 ${formatSize(item.fileSize)}</span>`;
                    }
                    if (item.fileData) {
                        html += `<span>📊 数据长度 ${item.fileData.length} bytes</span>`;
                    }
                    html += `<span class="time">⏱️ ${time}</span>`;
                    toast.innerHTML = html;
                    const list = decodeCollectedList;
                    list.parentNode.insertBefore(toast, list);
                    setTimeout(() => {
                        if (toast.parentNode) toast.remove();
                    }, 5000);
                }

                // ---------- 自动拼接与还原 ----------
                let assemblyInProgress = false;
                let assemblyCompleted = false;

                function queueAutomaticAssembly() {
                    if (assemblyInProgress || assemblyCompleted) return;
                    const total = collectedPages[0]?.totalPages || 0;
                    if (!total || collectedPages.length !== total || !collectedPages.every(item => item.crcOk)) return;
                    showStatus(decodeStatus, 'info', `✅ 已收集全部 ${total} 页，正在自动还原…`);
                    setTimeout(() => assemblePages(), 0);
                }

                async function assemblePages() {
                    if (assemblyInProgress || assemblyCompleted) return;
                    const first = collectedPages.find(item => item.pageIdx === 0);
                    const total = first?.totalPages || 0;
                    const sessionMismatch = first.protocolVersion >= 3 && collectedPages.some(item => item.sessionTag !== first.sessionTag);
                    if (!first || collectedPages.length !== total || !collectedPages.every(item => item.totalPages === total && item.crcOk) || sessionMismatch) {
                        showStatus(decodeStatus, 'warn', sessionMismatch ? '⚠️ 检测到混入另一传输批次的页面，暂不自动还原' : '⚠️ 页面未全部通过校验，暂不自动还原');
                        return;
                    }
                    assemblyInProgress = true;
                    setProgress(decodeProgressWrap, decodeProgressBar, 20);
                    try {
                        const ordered = [...collectedPages].sort((a, b) => a.pageIdx - b.pageIdx);
                        const transportSize = first.transportSize || first.fileSize;
                        const chunks = ordered.map(item => item.fileData);
                        const combined = new Uint8Array(chunks.reduce((sum, chunk) => sum + chunk.length, 0));
                        let pos = 0;
                        for (const chunk of chunks) { combined.set(chunk, pos); pos += chunk.length; }
                        const requiredBytes = transportSize + (first.protocolVersion < 3 ? 32 : 0);
                        if (combined.length < requiredBytes) throw new Error(`传输数据不完整：${combined.length}/${requiredBytes} B`);
                        const transportData = combined.slice(0, transportSize);
                        const expectedSha = first.protocolVersion < 3 ? combined.slice(transportSize, transportSize + 32) : first.originalSha;
                        setProgress(decodeProgressWrap, decodeProgressBar, 55);
                        const restored = first.compression === 'lzss' ? lzssDecompress(transportData, first.fileSize) : transportData;
                        if (restored.length !== first.fileSize) throw new Error(`还原长度异常：${restored.length}/${first.fileSize} B`);
                        const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', restored));
                        const shaOk = expectedSha && digest.length === expectedSha.length && digest.every((byte, index) => byte === expectedSha[index]);
                        if (!shaOk) throw new Error('SHA-256 校验失败，请重新收集异常页');
                        const blob = new Blob([restored]);
                        decodeResultArea.classList.add('active');
                        decodeResultFileName.textContent = `文件：${first.fileName}`;
                        decodeResultFileSize.textContent = `大小：${formatSize(first.fileSize)}`;
                        decodeResultSha.textContent = `校验通过 · ${first.compression === 'lzss' ? `LZSS 已解压（传输 ${formatSize(transportSize)}）` : '原始传输'}`;
                        decodeResultDownloadBtn.textContent = `⬇️ 下载 ${first.fileName}`;
                        decodeResultDownloadBtn._blob = blob;
                        decodeResultDownloadBtn._fileName = first.fileName;
                        assemblyCompleted = true;
                        setProgress(decodeProgressWrap, decodeProgressBar, 100);
                        showStatus(decodeStatus, 'success', '✅ 文件已自动还原，下载链接已置顶');
                        decodeResultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } catch (err) {
                        showStatus(decodeStatus, 'error', '❌ 自动还原失败：' + err.message);
                    } finally {
                        assemblyInProgress = false;
                    }
                }

                decodeResultDownloadBtn.addEventListener('click', () => {
                    const blob = decodeResultDownloadBtn._blob;
                    const name = decodeResultDownloadBtn._fileName || 'restored_file';
                    if (!blob) return;
                    const link = document.createElement('a');
                    link.download = name;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(link.href), 5000);
                });

                decodeClearBtn.addEventListener('click', () => {
                    collectedPages = [];
                    failedItems = [];
                    assemblyInProgress = false;
                    assemblyCompleted = false;
                    decodeResultArea.classList.remove('active');
                    stopAutoScan();
                    updateDecodeUI();
                    hideStatus(decodeStatus);
                    showStatus(decodeStatus, 'info', '🗑️ 已清空');
                });

                // ---------- 摄像头 ----------
                let camStream = null;
                let camActive = false;
                let autoScanRunning = false;
                let autoScanFrameId = null;

                async function startCamera() {
                    if (camActive) return;
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                        camStream = stream;
                        camVideo.srcObject = stream;
                        await camVideo.play();
                        camArea.classList.add('active');
                        camActive = true;
                        decodeCamToggle.textContent = '📷 摄像头开';
                        decodeCamToggle.classList.add('btn-danger');
                        decodeAutoScanBtn.disabled = false;
                        hideStatus(decodeStatus);
                        showStatus(decodeStatus, 'info', '📷 摄像头已开启，点击「自动扫描」开始智能识别');
                    } catch (err) {
                        showStatus(decodeStatus, 'error', '❌ 摄像头启动失败：' + err.message);
                    }
                }

                function stopCamera() {
                    stopAutoScan();
                    if (camStream) {
                        camStream.getTracks().forEach(t => t.stop());
                        camStream = null;
                    }
                    camVideo.srcObject = null;
                    camArea.classList.remove('active');
                    camActive = false;
                    decodeCamToggle.textContent = '📷 打开摄像头';
                    decodeCamToggle.classList.remove('btn-danger');
                    decodeAutoScanBtn.disabled = true;
                    decodeAutoScanBtn.textContent = '🔍 自动扫描';
                }

                function stopAutoScan() {
                    autoScanRunning = false;
                    if (autoScanFrameId) {
                        cancelAnimationFrame(autoScanFrameId);
                        autoScanFrameId = null;
                    }
                    decodeAutoScanBtn.textContent = '🔍 自动扫描';
                }

                function startAutoScan() {
                    if (!camActive || !camVideo.videoWidth) {
                        showStatus(decodeStatus, 'error', '⚠️ 摄像头未就绪');
                        return;
                    }
                    if (autoScanRunning) {
                        stopAutoScan();
                        return;
                    }
                    autoScanRunning = true;
                    decodeAutoScanBtn.textContent = '⏹ 停止扫描';
                    showStatus(decodeStatus, 'info', '🔍 实时扫描中...');

                    function scanFrame() {
                        if (!autoScanRunning || !camActive) {
                            stopAutoScan();
                            return;
                        }
                        try {
                            const w = camVideo.videoWidth;
                            const h = camVideo.videoHeight;
                            if (w > 0 && h > 0) {
                                const canvas = document.createElement('canvas');
                                canvas.width = w;
                                canvas.height = h;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(camVideo, 0, 0);
                                tryAddImageSource(canvas, { ...getCameraDecodeOptions(), silentFailure: true }).then(result => {
                                    if (result.success) {
                                        showStatus(decodeStatus, 'success', `📥 自动捕获页 ${result.pageIdx+1}/${result.totalPages}`);
                                        if (collectedPages.length === collectedPages[0]?.totalPages) {
                                            showStatus(decodeStatus, 'success', '✅ 已收集全部页面，停止扫描');
                                            stopAutoScan();
                                            return;
                                        }
                                    }
                                }).catch(() => {});
                            }
                        } catch (e) {}
                        autoScanFrameId = requestAnimationFrame(scanFrame);
                    }
                    scanFrame();
                }

                decodeAutoScanBtn.addEventListener('click', () => {
                    if (!camActive) {
                        showStatus(decodeStatus, 'warn', '⚠️ 请先打开摄像头');
                        return;
                    }
                    if (autoScanRunning) {
                        stopAutoScan();
                    } else {
                        startAutoScan();
                    }
                });

                function getCameraDecodeOptions() {
                    return { camera: { enhance: cameraEnhanceInput.checked, lensK1: Number(cameraLensInput.value) || 0 } };
                }

                camCaptureBtn.addEventListener('click', () => {
                    if (!camActive || !camVideo.videoWidth) {
                        showStatus(decodeStatus, 'error', '⚠️ 摄像头未就绪');
                        return;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = camVideo.videoWidth;
                    canvas.height = camVideo.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(camVideo, 0, 0);
                    tryAddImageSource(canvas, getCameraDecodeOptions()).then(result => {
                        if (result.success) {
                            showStatus(decodeStatus, 'success', `已添加第 ${result.pageIdx+1} 页`);
                        } else {
                            showStatus(decodeStatus, 'error', '❌ 拍照解码失败：' + result.reason);
                        }
                    });
                });

                camCloseBtn.addEventListener('click', stopCamera);

                // ---------- 屏幕选区 ----------
                let screenStream = null;
                let isSelecting = false;
                let startX, startY, endX, endY;
                let screenScanRunning = false;
                let screenScanFrameId = null;
                let selectedRegion = null;
                let screenDecodeInFlight = false;
                let screenFrameSignature = '';
                let screenFrameChangedAt = 0;
                let screenSlowWarningAt = 0;

                async function startScreenSelection() {
                    try {
                        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                        screenVideo.srcObject = screenStream;
                        await screenVideo.play();
                        screenOverlay.classList.add('active');
                        selectionBox.style.display = 'none';
                        screenScanStatus.textContent = '拖拽框选区域';
                        isSelecting = false;
                        startX = startY = endX = endY = 0;
                        selectedRegion = null;
                        screenVideo.addEventListener('mousedown', onMouseDown);
                        screenVideo.addEventListener('mousemove', onMouseMove);
                        screenVideo.addEventListener('mouseup', onMouseUp);
                        screenVideo.addEventListener('touchstart', onTouchStart, { passive: false });
                        screenVideo.addEventListener('touchmove', onTouchMove, { passive: false });
                        screenVideo.addEventListener('touchend', onTouchEnd, { passive: false });
                    } catch (err) {
                        showStatus(decodeStatus, 'error', '❌ 屏幕共享失败：' + err.message);
                    }
                }

                function closeScreenSelection() {
                    stopScreenScan();
                    screenOverlay.classList.remove('active');
                    if (screenStream) {
                        screenStream.getTracks().forEach(t => t.stop());
                        screenStream = null;
                    }
                    screenVideo.srcObject = null;
                    screenVideo.removeEventListener('mousedown', onMouseDown);
                    screenVideo.removeEventListener('mousemove', onMouseMove);
                    screenVideo.removeEventListener('mouseup', onMouseUp);
                    screenVideo.removeEventListener('touchstart', onTouchStart);
                    screenVideo.removeEventListener('touchmove', onTouchMove);
                    screenVideo.removeEventListener('touchend', onTouchEnd);
                    selectionBox.style.display = 'none';
                    screenScanStatus.textContent = '已关闭';
                }

                let isDragging = false,
                    dragOffsetX, dragOffsetY;
                screenDragHandle.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.controls')) return;
                    isDragging = true;
                    const rect = screenOverlay.getBoundingClientRect();
                    dragOffsetX = e.clientX - rect.left;
                    dragOffsetY = e.clientY - rect.top;
                    document.addEventListener('mousemove', onDragMove);
                    document.addEventListener('mouseup', onDragEnd);
                });

                function onDragMove(e) {
                    if (!isDragging) return;
                    screenOverlay.style.left = (e.clientX - dragOffsetX) + 'px';
                    screenOverlay.style.top = (e.clientY - dragOffsetY) + 'px';
                    screenOverlay.style.right = 'auto';
                    screenOverlay.style.bottom = 'auto';
                }

                function onDragEnd() {
                    isDragging = false;
                    document.removeEventListener('mousemove', onDragMove);
                    document.removeEventListener('mouseup', onDragEnd);
                }

                function getScreenVideoGeometry() {
                    const rect = screenVideo.getBoundingClientRect();
                    const videoAspect = screenVideo.videoWidth / screenVideo.videoHeight;
                    const boxAspect = rect.width / rect.height;
                    let displayWidth = rect.width;
                    let displayHeight = rect.height;
                    let offsetX = 0;
                    let offsetY = 0;
                    if (videoAspect > boxAspect) {
                        displayHeight = rect.width / videoAspect;
                        offsetY = (rect.height - displayHeight) / 2;
                    } else {
                        displayWidth = rect.height * videoAspect;
                        offsetX = (rect.width - displayWidth) / 2;
                    }
                    return { rect, displayWidth, displayHeight, offsetX, offsetY };
                }

                function getVideoPixelPos(e) {
                    const geometry = getScreenVideoGeometry();
                    const localX = Math.min(geometry.displayWidth, Math.max(0, e.clientX - geometry.rect.left - geometry.offsetX));
                    const localY = Math.min(geometry.displayHeight, Math.max(0, e.clientY - geometry.rect.top - geometry.offsetY));
                    return {
                        x: localX * screenVideo.videoWidth / geometry.displayWidth,
                        y: localY * screenVideo.videoHeight / geometry.displayHeight
                    };
                }

                function onMouseDown(e) {
                    isSelecting = true;
                    const pos = getVideoPixelPos(e);
                    startX = pos.x;
                    startY = pos.y;
                    selectionBox.style.display = 'block';
                    const geometry = getScreenVideoGeometry();
                    const startDisplayX = geometry.offsetX + pos.x * geometry.displayWidth / screenVideo.videoWidth;
                    const startDisplayY = geometry.offsetY + pos.y * geometry.displayHeight / screenVideo.videoHeight;
                    selectionBox.style.left = startDisplayX + 'px';
                    selectionBox.style.top = startDisplayY + 'px';
                    selectionBox.style.width = '0px';
                    selectionBox.style.height = '0px';
                    screenScanStatus.textContent = '框选中...';
                }

                function onMouseMove(e) {
                    if (!isSelecting) return;
                    const pos = getVideoPixelPos(e);
                    endX = pos.x;
                    endY = pos.y;
                    const geometry = getScreenVideoGeometry();
                    const startDisplayX = geometry.rect.left + geometry.offsetX + startX * geometry.displayWidth / screenVideo.videoWidth;
                    const startDisplayY = geometry.rect.top + geometry.offsetY + startY * geometry.displayHeight / screenVideo.videoHeight;
                    const currentDisplayX = geometry.rect.left + geometry.offsetX + pos.x * geometry.displayWidth / screenVideo.videoWidth;
                    const currentDisplayY = geometry.rect.top + geometry.offsetY + pos.y * geometry.displayHeight / screenVideo.videoHeight;
                    const left = Math.min(currentDisplayX, startDisplayX) - geometry.rect.left;
                    const top = Math.min(currentDisplayY, startDisplayY) - geometry.rect.top;
                    const width = Math.abs(currentDisplayX - startDisplayX);
                    const height = Math.abs(currentDisplayY - startDisplayY);
                    selectionBox.style.left = left + 'px';
                    selectionBox.style.top = top + 'px';
                    selectionBox.style.width = width + 'px';
                    selectionBox.style.height = height + 'px';
                }

                function onMouseUp(e) {
                    if (!isSelecting) return;
                    isSelecting = false;
                    const pos = getVideoPixelPos(e);
                    endX = pos.x;
                    endY = pos.y;
                    const x = Math.min(startX, endX);
                    const y = Math.min(startY, endY);
                    const w = Math.abs(endX - startX);
                    const h = Math.abs(endY - startY);
                    if (w > 10 && h > 10) {
                        selectedRegion = { x, y, w, h };
                        screenScanStatus.textContent = '选区已固定，点击「开始扫描选区」';
                        screenStartScanBtn.textContent = '▶ 开始扫描选区';
                    } else {
                        selectedRegion = null;
                        screenScanStatus.textContent = '选区太小，请重新框选';
                    }
                }

                function onTouchStart(e) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    onMouseDown(mouseEvent);
                }

                function onTouchMove(e) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    onMouseMove(mouseEvent);
                }

                function onTouchEnd(e) {
                    e.preventDefault();
                    const touch = e.changedTouches[0];
                    const mouseEvent = new MouseEvent('mouseup', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    onMouseUp(mouseEvent);
                }

                function getFrameSignature(canvas) {
                    const sampleWidth = 32;
                    const sampleHeight = 32;
                    const probe = document.createElement('canvas');
                    probe.width = sampleWidth;
                    probe.height = sampleHeight;
                    const probeCtx = probe.getContext('2d', { willReadFrequently: true });
                    probeCtx.drawImage(canvas, 0, 0, sampleWidth, sampleHeight);
                    const pixels = probeCtx.getImageData(0, 0, sampleWidth, sampleHeight).data;
                    let hash = 2166136261;
                    for (let i = 0; i < pixels.length; i += 16) hash = Math.imul(hash ^ pixels[i] ^ pixels[i + 1] ^ pixels[i + 2], 16777619);
                    return (hash >>> 0).toString(16);
                }

                function startScreenScan() {
                    if (!selectedRegion) {
                        screenScanStatus.textContent = '⚠️ 请先框选一个区域';
                        return;
                    }
                    if (screenScanRunning) {
                        stopScreenScan();
                        return;
                    }
                    screenScanRunning = true;
                    screenDecodeInFlight = false;
                    screenFrameSignature = '';
                    let stableSignature = '';
                    let stableFrames = 0;
                    screenFrameChangedAt = 0;
                    screenSlowWarningAt = 0;
                    screenStartScanBtn.textContent = '⏹ 停止扫描';
                    screenScanStatus.textContent = '扫描中，等待传输页稳定...';

                    function scanLoop() {
                        if (!screenScanRunning) return;
                        try {
                            const { x, y, w, h } = selectedRegion;
                            const canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(screenVideo, x, y, w, h, 0, 0, w, h);
                            const signature = getFrameSignature(canvas);
                            const now = performance.now();
                            if (signature !== screenFrameSignature) {
                                if (screenDecodeInFlight && screenFrameSignature) {
                                    screenFrameChangedAt = now;
                                    if (now - screenSlowWarningAt > 1200) {
                                        screenSlowWarningAt = now;
                                        screenScanStatus.textContent = '检测到传输页在解析完成前切换，请降低编码页播放速度';
                                        showStatus(decodeStatus, 'warn', '播放过快：上一页尚未完成解析，建议将播放间隔调至 3 秒或更长');
                                    }
                                }
                                screenFrameSignature = signature;
                            }
                            if (signature === stableSignature) stableFrames++;
                            else { stableSignature = signature; stableFrames = 1; }
                            if (!screenDecodeInFlight && stableFrames >= 2) {
                                screenDecodeInFlight = true;
                                const startedSignature = signature;
                                tryAddImageSource(canvas, { silentFailure: true, source: 'screen' }).then(result => {
                                    if (result.success) {
                                        const total = result.totalPages || getKnownTotalPages();
                                        const current = collectedPages.length;
                                        screenScanStatus.textContent = `已收集 ${current}/${total} 页`;
                                        if (total > 0 && current === total) {
                                            screenScanStatus.textContent = `已收集全部 ${total} 页，正在自动还原…`;
                                            stopScreenScan();
                                            queueAutomaticAssembly();
                                            setTimeout(closeScreenSelection, 800);
                                        }
                                    }
                                }).finally(() => {
                                    screenDecodeInFlight = false;
                                    if (startedSignature !== screenFrameSignature && performance.now() - screenFrameChangedAt < 1500) {
                                        screenScanStatus.textContent = '画面已变化，等待下一页稳定后继续识别';
                                    }
                                });
                            }
                        } catch (e) {
                            console.warn('屏幕扫描帧处理失败：', e);
                        }
                        screenScanFrameId = requestAnimationFrame(scanLoop);
                    }
                    scanLoop();
                }

                function stopScreenScan() {
                    screenScanRunning = false;
                    screenDecodeInFlight = false;
                    if (screenScanFrameId) {
                        cancelAnimationFrame(screenScanFrameId);
                        screenScanFrameId = null;
                    }
                    screenStartScanBtn.textContent = '▶ 开始扫描选区';
                    if (!screenScanStatus.textContent.startsWith('✅')) {
                        screenScanStatus.textContent = '已停止扫描';
                    }
                }

                screenStartScanBtn.addEventListener('click', () => {
                    if (!screenOverlay.classList.contains('active')) return;
                    if (screenScanRunning) {
                        stopScreenScan();
                    } else {
                        startScreenScan();
                    }
                });

                screenCancelBtn.addEventListener('click', () => {
                    closeScreenSelection();
                    showStatus(decodeStatus, 'info', '已取消屏幕选区');
                });

                decodeScreenBtn.addEventListener('click', startScreenSelection);

                // ---------- 事件绑定 ----------
                function applyConfig() {
                    try {
                        let bs = parseInt(blockSizeInput.value);
                        let is = parseInt(imageSizeInput.value);
                        let ecc = parseFloat(eccLevelInput.value);
                        if (isNaN(bs) || bs < 2) bs = 4;
                        if (isNaN(is) || is < 64) is = 256;
                        if (isNaN(ecc) || ecc < 0.05) ecc = 0.05;
                        if (ecc > 0.30) ecc = 0.30;
                        if (is % bs !== 0) {
                            showStatus(encodeStatus, 'error', '⚠️ 边长必须能被色块大小整除');
                            return;
                        }
                        const totalBlocks = is / bs;
                        if (totalBlocks % 2 === 0) {
                            showStatus(encodeStatus, 'error', `⚠️ 总色块数 ${totalBlocks} 必须为奇数`);
                            return;
                        }
                        BLOCK_SIZE = bs;
                        IMAGE_SIZE = is;
                        ENCODE_MODE = encodeModeSelect.value;
                        ECC_LEVEL = ecc;
                        const capacity = getPageCapacity(BLOCK_SIZE, IMAGE_SIZE, ENCODE_MODE, ECC_LEVEL);
                        capacityEstimate.textContent = `每页净载荷 ${formatSize(capacity.dataBytesPerPage)} · 页头 ${capacity.frameOverheadBytes} B · ECC ${capacity.eccBytesPerFullPage} B`;

                        const modeLabel = ENCODE_MODE === 'bw' ? '黑白 1bit' : ENCODE_MODE === 'color2' ? '色板 2bit' : '色板 3bit';
                        showStatus(encodeStatus, 'info', `配置已应用：色块 ${BLOCK_SIZE}px，边长 ${IMAGE_SIZE}px，${modeLabel}，ECC ${(ECC_LEVEL * 100).toFixed(0)}%`);
                        if (collectedPages.length > 0 || failedItems.length > 0) {
                            collectedPages = [];
                            failedItems = [];
                            assemblyInProgress = false;
                            assemblyCompleted = false;
                            decodeResultArea.classList.remove('active');
                            updateDecodeUI();
                            showStatus(decodeStatus, 'warn', '🔄 配置已更改，已清空收集的图片');
                        }
                        stopCarousel();
                        encodedPages = [];
                        encodeStateLabel.textContent = '等待文件';
                    } catch (err) {
                        console.error('applyConfig 错误:', err);
                        showStatus(encodeStatus, 'error', '配置应用失败：' + err.message);
                    }
                }

                const PRESETS = {
                    'camera-safe': { block: 12, size: 1200, mode: 'bw', ecc: 0.24, speed: '5000', label: '稳定实拍' },
                    balanced: { block: 8, size: 1208, mode: 'color2', ecc: 0.18, speed: '3000', label: '平衡传输' },
                    'screen-fast': { block: 8, size: 1208, mode: 'color3', ecc: 0.12, speed: '2000', label: '高速屏幕' }
                };
                transferPreset.addEventListener('change', () => {
                    const preset = PRESETS[transferPreset.value];
                    if (!preset) return;
                    blockSizeInput.value = preset.block;
                    imageSizeInput.value = preset.size;
                    encodeModeSelect.value = preset.mode;
                    eccLevelInput.value = preset.ecc;
                    carouselSpeedInput.value = preset.speed;
                    showStatus(encodeStatus, 'info', `已载入「${preset.label}」预设，请点击「应用配置」确认`);
                });
                configApplyBtn.addEventListener('click', applyConfig);

                // ---------- 编码 UI ----------
                let encodedPages = [];
                let carouselTimer = null;
                let carouselIndex = 0;
                let isPlaying = true;

                function startCarousel() {
                    if (!encodedPages.length) return;
                    carouselWrap.classList.add('active');
                    showCarouselPage(0);
                    if (carouselTimer) clearInterval(carouselTimer);
                    carouselTimer = setInterval(() => {
                        if (isPlaying) showCarouselPage((carouselIndex + 1) % encodedPages.length);
                    }, Number(carouselSpeedInput.value));
                    carouselPlayBtn.textContent = '暂停';
                }

                function stopCarousel() {
                    if (carouselTimer) {
                        clearInterval(carouselTimer);
                        carouselTimer = null;
                    }
                    carouselWrap.classList.remove('active');
                }

                function showCarouselPage(idx) {
                    if (!encodedPages.length) return;
                    if (idx < 0) idx = encodedPages.length - 1;
                    if (idx >= encodedPages.length) idx = 0;
                    carouselIndex = idx;
                    const canvas = carouselCanvas;
                    const srcCanvas = encodedPages[idx].canvas;
                    canvas.width = srcCanvas.width;
                    canvas.height = srcCanvas.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(srcCanvas, 0, 0);
                    carouselIndicator.textContent = `${idx+1}/${encodedPages.length}`;
                }

                carouselPrev.addEventListener('click', () => {
                    if (!encodedPages.length) return;
                    showCarouselPage(carouselIndex - 1);
                });
                carouselNext.addEventListener('click', () => {
                    if (!encodedPages.length) return;
                    showCarouselPage(carouselIndex + 1);
                });
                carouselPlayBtn.addEventListener('click', () => {
                    if (!encodedPages.length) return;
                    isPlaying = !isPlaying;
                    carouselPlayBtn.textContent = isPlaying ? '暂停' : '播放';
                });
                carouselSpeedInput.addEventListener('change', () => {
                    if (encodedPages.length && isPlaying) startCarousel();
                });

                downloadAllBtn.addEventListener('click', () => {
                    if (!encodedPages.length) {
                        showStatus(encodeStatus, 'warn', '⚠️ 没有可下载的图片');
                        return;
                    }
                    showStatus(encodeStatus, 'info', `⏳ 开始下载 ${encodedPages.length} 张图片...`);
                    let idx = 0;
                    const safeStem = (encodedPages[0].fileName || 'visual-transfer').replace(/[\\/:*?"<>|]/g, '_');

                    function downloadNext() {
                        if (idx >= encodedPages.length) {
                            showStatus(encodeStatus, 'success', `✅ 全部 ${encodedPages.length} 张图片下载完成`);
                            return;
                        }
                        const page = encodedPages[idx];
                        const link = document.createElement('a');
                        link.download = `${safeStem}_slice_${String(page.pageIndex + 1).padStart(4, '0')}_of_${String(page.totalPages).padStart(4, '0')}.png`;
                        page.canvas.toBlob((blob) => {
                            link.href = URL.createObjectURL(blob);
                            link.click();
                            setTimeout(() => URL.revokeObjectURL(link.href), 2000);
                        }, 'image/png');
                        idx++;
                        setTimeout(downloadNext, 400);
                    }
                    downloadNext();
                });

                async function handleEncodeFile(file) {
                    if (!file) return;
                    hideStatus(encodeStatus);
                    if (file.size > MAX_FILE_BYTES) {
                        showStatus(encodeStatus, 'warn', `文件为 ${formatSize(file.size)}，建议控制在 ${formatSize(MAX_FILE_BYTES)} 以内以保证传输稳定`);
                    }
                    stopCarousel();
                    encodeStateLabel.textContent = '编码中…';
                    setProgress(encodeProgressWrap, encodeProgressBar, 0);

                    try {
                        const capacity = getPageCapacity(BLOCK_SIZE, IMAGE_SIZE, ENCODE_MODE, ECC_LEVEL);
                        const estimate = estimateFilePages(file, capacity);
                        const result = await encodeFileToPages(file, BLOCK_SIZE, IMAGE_SIZE, ENCODE_MODE, ECC_LEVEL);
                        encodedPages = result.pages;
                        const transportLabel = result.compressed ? `LZSS 压缩：${formatSize(file.size)} → ${formatSize(result.transportSize)}` : '未压缩（压缩收益不足）';
                        capacityEstimate.textContent = `${transportLabel} · 协议 ${estimate.fileEnvelopeBytes} B · 实际 ${encodedPages.length} 页 · 每页净载荷 ${formatSize(capacity.dataBytesPerPage)}`;
                        encodeStateLabel.textContent = `编码完成，共 ${encodedPages.length} 页${result.compressed ? '（已压缩）' : ''}`;
                        showStatus(encodeStatus, 'success', `已生成 ${encodedPages.length} 页，${transportLabel}`);
                        startCarousel();
                    } catch (err) {
                        encodeStateLabel.textContent = '❌ 编码失败';
                        showStatus(encodeStatus, 'error', '❌ ' + err.message);
                    }
                }

                // ---------- 编码拖放 ----------
                encodeDrop.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    encodeDrop.classList.add('dragover');
                });
                encodeDrop.addEventListener('dragleave', () => {
                    encodeDrop.classList.remove('dragover');
                });
                encodeDrop.addEventListener('drop', (e) => {
                    e.preventDefault();
                    encodeDrop.classList.remove('dragover');
                    const files = e.dataTransfer.files;
                    if (files && files.length > 0) {
                        handleEncodeFile(files[0]);
                    }
                });
                encodeDrop.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        encodeFileInput.click();
                    }
                });
                encodeFileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        handleEncodeFile(e.target.files[0]);
                    }
                    e.target.value = '';
                });
                encodeSelectBtn.addEventListener('click', () => {
                    encodeFileInput.click();
                });

                // ---------- 解码拖放 ----------
                decodeDrop.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    decodeDrop.classList.add('dragover');
                });
                decodeDrop.addEventListener('dragleave', () => {
                    decodeDrop.classList.remove('dragover');
                });
                decodeDrop.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    decodeDrop.classList.remove('dragover');
                    const files = e.dataTransfer.files;
                    if (!files || files.length === 0) return;
                    for (const file of files) {
                        if (!file.type.startsWith('image/')) continue;
                        try {
                            const img = await loadImageFromBlob(file);
                            await tryAddImageSource(img);
                        } catch (err) {
                            showStatus(decodeStatus, 'error', '❌ 加载图片失败：' + err.message);
                        }
                    }
                });
                decodeDrop.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        decodeFileInput.click();
                    }
                });
                decodeFileInput.addEventListener('change', async (e) => {
                    const files = e.target.files;
                    if (!files || files.length === 0) return;
                    for (const file of files) {
                        if (!file.type.startsWith('image/')) continue;
                        try {
                            const img = await loadImageFromBlob(file);
                            await tryAddImageSource(img);
                        } catch (err) {
                            showStatus(decodeStatus, 'error', '❌ 加载图片失败：' + err.message);
                        }
                    }
                    e.target.value = '';
                });
                decodeSelectBtn.addEventListener('click', () => {
                    decodeFileInput.click();
                });

                decodeCamToggle.addEventListener('click', () => {
                    if (camActive) stopCamera();
                    else startCamera();
                });


                // ---------- Tab 切换 ----------
                tabBtns.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const appScrollTop = document.querySelector('.app').scrollTop;
                        tabBtns.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        const target = this.dataset.tab;
                        if (target === 'encode') {
                            encodePanel.classList.add('active');
                            decodePanel.classList.remove('active');
                        } else {
                            decodePanel.classList.add('active');
                            encodePanel.classList.remove('active');
                        }
                        requestAnimationFrame(() => {
                            document.querySelector('.app').scrollTop = appScrollTop;
                            this.focus({ preventScroll: true });
                        });
                    });
                });

                // ---------- 初始化 ----------
                hideStatus(encodeStatus);
                hideStatus(decodeStatus);
                updateDecodeUI();
                applyConfig();
                console.log('📡 视觉传输 · 高密度编码 (最终修正版) 已加载');

            })();
        });
    </script>
</body>
</html>
