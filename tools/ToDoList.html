<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📋 ToDoList</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #f5f7fb;
            color: #1e2a3a;
            min-height: 100vh;
            padding: 12px 16px;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 1400px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 16px 20px 20px;
            border: 1px solid #e8ecf1;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }

        /* ===== 顶部栏 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f2f5;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-left .logo {
            font-size: 26px;
        }
        .header-left h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1e2a3a;
            letter-spacing: -0.3px;
        }
        .header-left h1 span {
            color: #4A90D9;
        }

        .digital-clock {
            font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            color: #1e2a3a;
            background: #f0f2f5;
            padding: 3px 14px;
            border-radius: 10px;
            border: 1px solid #d8dfe8;
            display: inline-block;
            user-select: none;
            white-space: nowrap;
        }
        .digital-clock .date-part {
            font-weight: 500;
            color: #6b7c93;
            font-size: 18px;
        }
        .digital-clock .time-part {
            font-weight: 600;
            font-size: 18px;
            color: #1e2a3a;
        }
        .digital-clock .sep {
            color: #b0c0d0;
            font-weight: 400;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== 视图切换 & 日期导航 ===== */
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .view-tabs {
            display: flex;
            gap: 3px;
            background: #f0f2f5;
            border-radius: 10px;
            padding: 3px;
        }
        .view-tab {
            padding: 5px 14px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7c93;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .view-tab:hover {
            color: #1e2a3a;
        }
        .view-tab.active {
            background: #ffffff;
            color: #4A90D9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .date-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .date-nav .nav-btn {
            padding: 4px 10px;
            border: 1px solid #d8dfe8;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            color: #4a5568;
            transition: all 0.15s;
            font-family: inherit;
            line-height: 1.4;
        }
        .date-nav .nav-btn:hover {
            background: #f0f2f5;
        }
        .date-nav .date-label {
            font-size: 15px;
            font-weight: 600;
            color: #1e2a3a;
            min-width: 120px;
            text-align: center;
            padding: 0 6px;
            white-space: nowrap;
        }
        .date-nav .today-btn {
            padding: 4px 12px;
            border: 1px solid #d8dfe8;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            color: #4A90D9;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.15s;
            line-height: 1.4;
        }
        .date-nav .today-btn:hover {
            background: #f0f5ff;
            border-color: #4A90D9;
        }

        .granularity-wrapper {
            display: inline-block;
        }
        .granularity-wrapper.hidden {
            display: none;
        }
        .granularity-select {
            padding: 4px 10px;
            border: 1px solid #d8dfe8;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: #1e2a3a;
            background: #fff;
            cursor: pointer;
            font-family: inherit;
            outline: none;
            height: 30px;
        }
        .granularity-select:focus {
            border-color: #4A90D9;
        }

        .action-btn {
            padding: 4px 12px;
            border: 1px solid #d8dfe8;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: #4a5568;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            height: 30px;
        }
        .action-btn:hover {
            background: #f0f5ff;
            border-color: #4A90D9;
            color: #4A90D9;
        }

        .data-status {
            font-size: 11px;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid #a5d6a7;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 26px;
        }
        .data-status.empty {
            color: #6b7c93;
            background: #f0f2f5;
            border-color: #d8dfe8;
        }
        .data-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .data-status .dot.green {
            background: #2e7d32;
        }
        .data-status .dot.gray {
            background: #6b7c93;
        }

        /* ===== 主体内容 ===== */
        .main-content {
            flex: 1;
            overflow-y: auto;
            min-height: 400px;
            position: relative;
            padding-top: 12px;
        }

        /* ===== 日视图 ===== */
        .day-view {
            display: none;
            position: relative;
        }
        .day-view.active {
            display: block;
        }

        .day-layout {
            display: flex;
            gap: 16px;
            height: 100%;
            min-height: 500px;
        }

        .day-timeline-wrapper {
            flex: 0 0 66.666%;
            overflow-y: auto;
            max-height: 700px;
            border: 1px solid #e8ecf1;
            border-radius: 12px;
            background: #fafbfc;
            position: relative;
        }

        .timeline {
            padding-left: 70px;
            position: relative;
        }

        .timeline-divider {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            z-index: 6;
            pointer-events: none;
            background: linear-gradient(90deg, #e74c3c 40%, transparent 100%);
            opacity: 1;
            display: flex;
            align-items: center;
        }
        .timeline-divider::before {
            content: '⏰ 现在';
            position: absolute;
            left: 8px;
            top: -10px;
            font-size: 12px;
            color: #e74c3c;
            font-weight: 700;
            background: #fafbfc;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid #e74c3c;
            box-shadow: 0 1px 4px rgba(231, 76, 60, 0.15);
            letter-spacing: 0.3px;
        }
        .timeline-divider .divider-dot {
            position: absolute;
            left: 0;
            top: -6px;
            width: 12px;
            height: 12px;
            background: #e74c3c;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 2px #e74c3c;
        }

        .timeline-hour {
            display: flex;
            border-bottom: 1px solid #e8ecf1;
            min-height: 52px;
            position: relative;
            align-items: stretch;
        }
        .timeline-hour .time-label {
            position: absolute;
            left: -70px;
            top: 0;
            width: 60px;
            font-size: 12px;
            font-weight: 500;
            color: #8a9fb0;
            text-align: right;
            padding-right: 10px;
            line-height: 52px;
            height: 52px;
        }
        .timeline-hour .slot-content {
            flex: 1;
            padding: 2px 6px;
            min-height: 52px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* ===== 任务行（日视图） ===== */
        .task-row {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: #ffffff;
            border-radius: 6px;
            border-left: 4px solid #4A90D9;
            transition: all 0.1s;
            min-height: 32px;
            flex-wrap: nowrap;
            position: relative;
            width: 100%;
        }
        .task-row:hover {
            background: #f0f5ff;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.15);
            z-index: 2;
        }
        .task-row.past-task {
            background: #f0f2f5;
            opacity: 0.7;
            border-left-color: #8a9fb0;
        }
        .task-row.past-task .task-check {
            cursor: pointer;
            opacity: 1;
        }
        .task-row.past-task .task-title-input,
        .task-row.past-task .task-tag-select,
        .task-row.past-task .task-priority-select {
            cursor: not-allowed;
            opacity: 0.5;
            pointer-events: none;
        }
        .task-row.past-task .task-comment-input {
            cursor: not-allowed;
            opacity: 0.5;
            pointer-events: none;
        }
        .task-row.completed-task {
            opacity: 0.6;
            border-left-color: #8a9fb0;
        }
        .task-row.completed-task .task-title-input {
            text-decoration: line-through;
        }
        .task-row.active-task {
            border-left-width: 6px;
            border-left-color: #4A90D9;
            background: #e8f0fe;
        }

        .task-row .task-check {
            font-size: 16px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            width: 20px;
            text-align: center;
            line-height: 1;
        }

        .task-row .task-title-input {
            flex: 2 1 280px;
            min-width: 120px;
            max-width: 400px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-family: inherit;
            color: #1e2a3a;
            outline: none;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.15s;
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
            height: auto;
            min-height: 26px;
            resize: none;
        }
        .task-row .task-title-input:focus {
            background: #ffffff;
            box-shadow: 0 0 0 2px #4A90D9;
        }
        .task-row .task-title-input::placeholder {
            color: #b0c0d0;
        }
        .task-row .task-title-input:disabled {
            cursor: not-allowed;
        }

        .task-row .task-tag-select {
            flex: 0 1 60px;
            min-width: 40px;
            max-width: 80px;
            padding: 2px 4px;
            border: 1px solid #d8dfe8;
            border-radius: 4px;
            font-size: 10px;
            font-family: inherit;
            background: #fff;
            outline: none;
            cursor: pointer;
            height: 24px;
            appearance: none;
            -webkit-appearance: none;
            background-image: none;
            padding-right: 2px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            color: #1e2a3a;
        }
        .task-row .task-tag-select:focus {
            border-color: #4A90D9;
        }
        .task-row .task-tag-select:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .task-row .task-tag-select option.add-tag-option {
            color: #4A90D9;
            font-weight: 600;
        }
        .task-row .task-tag-select.has-tag {
            background-color: #e8f0fe;
            border-color: #b0c8e0;
            font-weight: 600;
            font-size: 10px;
        }

        .task-row .task-priority-select {
            flex: 0 0 32px;
            min-width: 28px;
            max-width: 36px;
            padding: 2px 2px 2px 4px;
            border: 1px solid #d8dfe8;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            outline: none;
            cursor: pointer;
            height: 24px;
            appearance: none;
            -webkit-appearance: none;
            background-image: none;
            text-align: center;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: clip;
        }
        .task-row .task-priority-select:focus {
            border-color: #4A90D9;
        }
        .task-row .task-priority-select:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .task-row .task-priority-select option {
            font-size: 14px;
            text-align: center;
        }
        .task-row .task-priority-select::-ms-expand {
            display: none;
        }

        .task-row .task-comment-input {
            flex: 1 1 80px;
            min-width: 40px;
            max-width: 140px;
            border: none;
            background: transparent;
            font-size: 11px;
            font-family: inherit;
            color: #6b7c93;
            outline: none;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.15s;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .task-row .task-comment-input:focus {
            background: #ffffff;
            box-shadow: 0 0 0 2px #b0c8e0;
        }
        .task-row .task-comment-input::placeholder {
            color: #c0c8d0;
            font-size: 11px;
        }

        .task-row .task-status-badge {
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 36px;
            text-align: center;
            line-height: 16px;
            height: 18px;
        }
        .task-row .task-status-badge.status-active {
            background: #d4e0f0;
            color: #1a6a8a;
        }
        .task-row .task-status-badge.status-done {
            background: #d4f0d4;
            color: #2a7a3a;
        }
        .task-row .task-status-badge.status-past {
            background: #e8e8e8;
            color: #6b7c93;
        }

        .empty-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 8px;
            color: #b0c0d0;
            font-size: 13px;
            border: 1px dashed #d8dfe8;
            border-radius: 6px;
            min-height: 34px;
            cursor: pointer;
            transition: all 0.15s;
            background: #f8f9fc;
        }
        .empty-slot:hover {
            background: #f0f5ff;
            border-color: #4A90D9;
            color: #4A90D9;
        }

        /* ===== 每日总结 ===== */
        .daily-summary-panel {
            flex: 1;
            min-width: 180px;
            max-width: 33.333%;
            background: #f8f9fc;
            border-radius: 12px;
            border: 1px solid #e8ecf1;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 700px;
            min-height: 400px;
        }
        .daily-summary-panel .summary-title {
            font-size: 14px;
            font-weight: 600;
            color: #1e2a3a;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .daily-summary-panel .summary-title .summary-date {
            font-weight: 400;
            color: #6b7c93;
            font-size: 12px;
        }
        .daily-summary-panel textarea {
            flex: 1;
            border: 1px solid #d8dfe8;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            background: #fff;
            min-height: 200px;
            transition: border-color 0.15s;
        }
        .daily-summary-panel textarea:focus {
            border-color: #4A90D9;
        }
        .daily-summary-panel .summary-save-btn {
            margin-top: 8px;
            padding: 6px;
            background: #4A90D9;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .daily-summary-panel .summary-save-btn:hover {
            background: #3a7bc8;
        }

        /* ===== 周视图 ===== */
        .week-view {
            display: none;
        }
        .week-view.active {
            display: block;
        }

        .week-sub-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            background: #f0f2f5;
            border-radius: 8px;
            padding: 3px;
            width: fit-content;
        }
        .week-sub-tab {
            padding: 4px 14px;
            border: none;
            background: transparent;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7c93;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .week-sub-tab:hover {
            color: #1e2a3a;
        }
        .week-sub-tab.active {
            background: #ffffff;
            color: #4A90D9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .week-sub-content {
            display: none;
        }
        .week-sub-content.active {
            display: block;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        .week-day {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 12px 10px;
            border: 1px solid #e8ecf1;
            min-height: 300px;
            transition: all 0.2s;
            position: relative;
            cursor: default;
        }
        .week-day:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(74, 144, 217, 0.12);
            z-index: 2;
        }
        .week-day.today-highlight {
            border-color: #4A90D9;
            border-width: 2px;
            background: #f0f5ff;
        }
        .week-day .day-header {
            font-size: 14px;
            font-weight: 600;
            color: #1e2a3a;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8ecf1;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .week-day .day-header .day-num {
            font-weight: 400;
            color: #6b7c93;
            font-size: 13px;
        }
        .week-day .day-header .day-name {
            font-size: 13px;
            color: #6b7c93;
            font-weight: 400;
        }
        .week-day .day-tasks {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 400px;
            overflow-y: auto;
        }
        .week-day .day-tasks .task-item {
            font-size: 13px;
            padding: 6px 10px;
            background: #ffffff;
            border-radius: 6px;
            border-left: 3px solid #4A90D9;
            cursor: default;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .week-day .day-tasks .task-item:hover {
            background: #f0f5ff;
            transform: scale(1.03);
            box-shadow: 0 2px 10px rgba(74, 144, 217, 0.12);
            z-index: 2;
        }
        .week-day .day-tasks .task-item .task-tag {
            font-size: 10px;
            background: #e8ecf1;
            padding: 0 6px;
            border-radius: 3px;
            color: #4a5568;
        }
        .week-day .day-tasks .task-item.completed {
            opacity: 0.5;
            text-decoration: line-through;
        }
        .week-day .day-tasks .task-item .task-time {
            font-size: 11px;
            color: #8a9fb0;
            margin-right: 4px;
        }
        .week-day .day-tasks .task-item .task-check {
            font-size: 14px;
            margin-right: 2px;
            cursor: default;
            pointer-events: none;
            opacity: 0.8;
        }
        .week-day .day-tasks .task-item .priority-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .week-day .empty-tasks {
            font-size: 13px;
            color: #b0c0d0;
            text-align: center;
            padding: 20px 0;
        }

        /* 周计划列表 */
        .week-plan-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 0;
            max-height: 500px;
            overflow-y: auto;
        }
        .week-plan-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: #f8f9fc;
            border-radius: 4px;
            border-left: 3px solid #f1c40f;
            flex-wrap: wrap;
        }
        .week-plan-item .plan-check {
            cursor: pointer;
            font-size: 16px;
        }
        .week-plan-item .plan-text {
            flex: 1;
            font-size: 13px;
        }
        .week-plan-item .plan-day {
            font-size: 11px;
            color: #6b7c93;
            font-weight: 600;
            min-width: 30px;
        }
        .week-plan-item .plan-tag {
            font-size: 10px;
            background: #e8ecf1;
            padding: 0 6px;
            border-radius: 3px;
            color: #4a5568;
        }
        .week-plan-item .plan-priority-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .week-plan-item .plan-del {
            border: none;
            background: transparent;
            color: #b04040;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
        .week-plan-item .plan-del:hover {
            color: #dc2626;
        }
        .week-plan-item.completed {
            opacity: 0.5;
            text-decoration: line-through;
        }
        .week-plan-empty {
            color: #b0c0d0;
            font-size: 13px;
            padding: 8px 0;
            text-align: center;
        }
        .week-plan-add {
            margin-top: 8px;
            padding: 4px 12px;
            border: 1px dashed #d8dfe8;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            color: #4A90D9;
            font-family: inherit;
            transition: all 0.15s;
            width: 100%;
            text-align: center;
        }
        .week-plan-add:hover {
            background: #f0f5ff;
            border-color: #4A90D9;
        }

        /* ===== 月视图 ===== */
        .month-view {
            display: none;
        }
        .month-view.active {
            display: block;
        }

        .month-sub-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            background: #f0f2f5;
            border-radius: 8px;
            padding: 3px;
            width: fit-content;
        }
        .month-sub-tab {
            padding: 4px 14px;
            border: none;
            background: transparent;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7c93;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .month-sub-tab:hover {
            color: #1e2a3a;
        }
        .month-sub-tab.active {
            background: #ffffff;
            color: #4A90D9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .month-sub-content {
            display: none;
        }
        .month-sub-content.active {
            display: block;
        }

        .month-layout {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .month-calendar-wrapper {
            flex: 1;
            min-width: 0;
        }

        .month-calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .month-calendar .month-header {
            font-size: 13px;
            font-weight: 600;
            color: #6b7c93;
            text-align: center;
            padding: 6px 0;
            background: #f8f9fc;
            border-radius: 6px;
        }
        .month-calendar .month-day {
            aspect-ratio: 1;
            min-height: 44px;
            padding: 3px 4px;
            border-radius: 6px;
            background: #fafbfc;
            border: 1px solid #e8ecf1;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
        }
        .month-calendar .month-day:hover {
            background: #f0f5ff;
            border-color: #4A90D9;
            transform: scale(1.04);
            box-shadow: 0 2px 12px rgba(74, 144, 217, 0.1);
            z-index: 2;
        }
        .month-calendar .month-day .day-number {
            font-size: 13px;
            font-weight: 500;
            color: #1e2a3a;
        }
        .month-calendar .month-day .day-number.other-month {
            color: #b0c0d0;
        }
        .month-calendar .month-day .day-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            margin-top: 2px;
        }
        .month-calendar .month-day .day-dots .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }
        .month-calendar .month-day.today-highlight {
            border-color: #4A90D9;
            border-width: 2px;
            background: #f0f5ff;
        }
        .month-calendar .month-day.has-tasks {
            border-color: #c8d8e8;
        }
        .month-calendar .month-day .task-count {
            font-size: 9px;
            color: #6b7c93;
            margin-top: 1px;
            font-weight: 500;
        }

        /* 月详情面板 */
        .month-detail-panel {
            width: 280px;
            min-width: 220px;
            max-height: 500px;
            overflow-y: auto;
            background: #f8f9fc;
            border-radius: 12px;
            border: 1px solid #e8ecf1;
            padding: 12px 14px;
            flex-shrink: 0;
            display: none;
            position: sticky;
            top: 0;
            align-self: flex-start;
        }
        .month-detail-panel.active {
            display: block;
        }

        .month-detail-panel .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #e8ecf1;
        }
        .month-detail-panel .detail-header .detail-date {
            font-size: 15px;
            font-weight: 600;
        }
        .month-detail-panel .detail-header .close-detail {
            border: none;
            background: transparent;
            font-size: 18px;
            cursor: pointer;
            color: #6b7c93;
            padding: 0 4px;
        }
        .month-detail-panel .detail-tasks {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .month-detail-panel .detail-tasks .task-item {
            padding: 5px 10px;
            background: #ffffff;
            border-radius: 6px;
            border-left: 3px solid #4A90D9;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .month-detail-panel .detail-tasks .task-item:hover {
            background: #f0f5ff;
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(74, 144, 217, 0.1);
        }
        .month-detail-panel .detail-tasks .task-item .task-check-display {
            font-size: 14px;
            cursor: default;
            pointer-events: none;
            opacity: 0.8;
            margin-left: auto;
        }

        /* 月计划列表 */
        .month-plan-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .month-plan-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: #f8f9fc;
            border-radius: 4px;
            border-left: 3px solid #f1c40f;
            flex-wrap: wrap;
        }
        .month-plan-item .plan-check {
            cursor: pointer;
            font-size: 16px;
        }
        .month-plan-item .plan-text {
            flex: 1;
            font-size: 13px;
        }
        .month-plan-item .plan-tag {
            font-size: 10px;
            background: #e8ecf1;
            padding: 0 6px;
            border-radius: 3px;
            color: #4a5568;
        }
        .month-plan-item .plan-priority-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .month-plan-item .plan-del {
            border: none;
            background: transparent;
            color: #b04040;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
        .month-plan-item .plan-del:hover {
            color: #dc2626;
        }
        .month-plan-item.completed {
            opacity: 0.5;
            text-decoration: line-through;
        }
        .month-plan-empty {
            color: #b0c0d0;
            font-size: 13px;
            padding: 8px 0;
            text-align: center;
        }
        .month-plan-add {
            margin-top: 8px;
            padding: 4px 12px;
            border: 1px dashed #d8dfe8;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            color: #4A90D9;
            font-family: inherit;
            transition: all 0.15s;
            width: 100%;
            text-align: center;
        }
        .month-plan-add:hover {
            background: #f0f5ff;
            border-color: #4A90D9;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 24px 28px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .modal .form-group {
            margin-bottom: 12px;
        }
        .modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 4px;
        }
        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d8dfe8;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus {
            border-color: #4A90D9;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        .modal .modal-actions button {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        .modal .modal-actions .btn-save {
            background: #4A90D9;
            color: #fff;
        }
        .modal .modal-actions .btn-save:hover {
            background: #3a7bc8;
        }
        .modal .modal-actions .btn-cancel {
            background: #f0f2f5;
            color: #4a5568;
        }
        .modal .modal-actions .btn-cancel:hover {
            background: #e0e4e8;
        }

        /* ===== 标签管理 ===== */
        .modal .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .modal .tag-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px 4px 16px;
            background: #f0f2f5;
            border-radius: 20px;
            font-size: 14px;
        }
        .modal .tag-item .tag-del {
            border: none;
            background: transparent;
            color: #b04040;
            cursor: pointer;
            font-size: 16px;
            padding: 0 2px;
            line-height: 1;
        }
        .modal .tag-item .tag-del:hover {
            color: #dc2626;
        }
        .modal .add-tag-row {
            display: flex;
            gap: 8px;
        }
        .modal .add-tag-row input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d8dfe8;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .modal .add-tag-row input:focus {
            border-color: #4A90D9;
        }
        .modal .add-tag-row button {
            padding: 8px 16px;
            background: #4A90D9;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .modal .modal-close {
            margin-top: 16px;
            padding: 8px;
            background: #f0f2f5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            font-family: inherit;
            transition: background 0.15s;
        }
        .modal .modal-close:hover {
            background: #e0e4e8;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1024px) {
            .day-timeline-wrapper {
                flex: 0 0 60%;
            }
            .daily-summary-panel {
                max-width: 40%;
                min-height: 300px;
            }
            .month-detail-panel {
                width: 220px;
                min-width: 160px;
            }
            .task-row .task-title-input {
                flex: 1 1 180px;
                min-width: 80px;
                max-width: 280px;
            }
        }

        @media (max-width: 900px) {
            .day-layout {
                flex-direction: column;
            }
            .day-timeline-wrapper {
                flex: 1 1 auto;
                max-height: 500px;
            }
            .daily-summary-panel {
                max-width: 100%;
                min-height: 120px;
                max-height: 200px;
            }
            .daily-summary-panel textarea {
                min-height: 80px;
            }
            .month-layout {
                flex-direction: column;
            }
            .month-detail-panel {
                width: 100%;
                min-width: auto;
                max-height: 250px;
                position: static;
            }
            .task-row {
                flex-wrap: wrap;
                padding: 6px 8px;
            }
            .task-row .task-title-input {
                flex: 1 1 100%;
                min-width: 100%;
                max-width: 100%;
            }
            .task-row .task-comment-input {
                flex: 1 1 100%;
                min-width: 100%;
                max-width: 100%;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .header-center {
                flex-wrap: wrap;
                justify-content: center;
            }
            .header-right {
                justify-content: center;
            }
            .nav-controls {
                justify-content: center;
                flex-wrap: wrap;
            }
            .month-calendar .month-day {
                min-height: 36px;
                padding: 3px 4px;
            }
            .month-calendar .month-day .day-number {
                font-size: 12px;
            }
        }

        @media (max-width: 768px) {
            .app {
                padding: 12px 10px 14px;
            }
            .header-left h1 {
                font-size: 17px;
            }
            .digital-clock {
                font-size: 15px;
                padding: 2px 10px;
            }
            .digital-clock .date-part,
            .digital-clock .time-part {
                font-size: 15px;
            }
            .date-nav .date-label {
                font-size: 13px;
                min-width: 80px;
            }
            .view-tab {
                font-size: 12px;
                padding: 4px 10px;
            }
            .week-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .week-day {
                min-height: auto;
                padding: 10px;
            }
            .month-calendar {
                font-size: 12px;
            }
            .month-calendar .month-day {
                min-height: 32px;
                padding: 2px 3px;
            }
            .month-calendar .month-day .day-number {
                font-size: 11px;
            }
            .day-timeline-wrapper {
                max-height: 450px;
            }
            .timeline {
                padding-left: 50px;
            }
            .timeline-hour .time-label {
                left: -50px;
                width: 40px;
                font-size: 11px;
                line-height: 44px;
                height: 44px;
            }
            .timeline-hour {
                min-height: 44px;
            }
            .timeline-hour .slot-content {
                min-height: 44px;
            }
            .month-detail-panel {
                max-height: 220px;
            }
            .month-sub-tabs,
            .week-sub-tabs {
                width: 100%;
                justify-content: center;
            }
            .week-plan-item,
            .month-plan-item {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .view-tabs {
                flex-wrap: wrap;
                justify-content: center;
            }
            .view-tab {
                padding: 3px 10px;
                font-size: 11px;
            }
            .month-calendar .month-day {
                min-height: 28px;
                padding: 2px 2px;
            }
            .month-calendar .month-day .day-number {
                font-size: 10px;
            }
            .month-calendar .month-day .day-dots .dot {
                width: 4px;
                height: 4px;
            }
            .digital-clock {
                font-size: 13px;
                padding: 2px 8px;
            }
            .digital-clock .date-part,
            .digital-clock .time-part {
                font-size: 13px;
            }
            .data-status {
                font-size: 10px;
                padding: 1px 8px;
            }
            .date-nav .date-label {
                font-size: 12px;
                min-width: 60px;
            }
            .date-nav .nav-btn {
                padding: 3px 8px;
                font-size: 12px;
            }
            .task-row .task-tag-select {
                flex: 0 1 40px;
                min-width: 30px;
                font-size: 9px;
            }
            .task-row .task-priority-select {
                flex: 0 0 28px;
                min-width: 24px;
                font-size: 12px;
            }
            .action-btn {
                font-size: 11px;
                padding: 3px 8px;
                height: 26px;
            }
            .granularity-select {
                font-size: 11px;
                padding: 3px 8px;
                height: 26px;
            }
            .week-plan-item,
            .month-plan-item {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">

        <!-- ===== 顶部栏 ===== -->
        <div class="header">
            <div class="header-left">
                <span class="logo">📋</span>
                <h1>ToDo<span>List</span></h1>
                <span class="digital-clock" id="digitalClock">
                    <span class="date-part" id="clockDate"></span>
                    <span class="sep"> | </span>
                    <span class="time-part" id="clockTime"></span>
                </span>
            </div>

            <div class="header-center">
                <div class="nav-controls">
                    <div class="view-tabs" id="viewTabs">
                        <button class="view-tab active" data-view="day">📅 日</button>
                        <button class="view-tab" data-view="week">📆 周</button>
                        <button class="view-tab" data-view="month">📊 月</button>
                    </div>
                    <div class="date-nav">
                        <button class="nav-btn" id="prevDate">◀</button>
                        <span class="date-label" id="dateLabel">今天</span>
                        <button class="nav-btn" id="nextDate">▶</button>
                        <button class="today-btn" id="todayBtn">今天</button>
                    </div>
                    <span class="granularity-wrapper" id="granularityWrapper">
                        <select class="granularity-select" id="granularitySelect">
                            <option value="15">15 分钟</option>
                            <option value="30">30 分钟</option>
                            <option value="60" selected>1 小时</option>
                        </select>
                    </span>
                </div>
            </div>

            <div class="header-right">
                <span class="data-status" id="dataStatus">
                    <span class="dot green" id="statusDot"></span>
                    <span id="statusText">已自动保存</span>
                </span>
                <button class="action-btn" id="saveBtn">📤 导出</button>
                <button class="action-btn" id="loadBtn">📥 导入</button>
                <input type="file" id="fileInput" accept=".json" style="display:none" />
            </div>
        </div>

        <!-- ===== 主内容 ===== -->
        <div class="main-content" id="mainContent">
            <!-- ===== 日视图 ===== -->
            <div class="day-view active" id="dayView">
                <div class="day-layout">
                    <div class="day-timeline-wrapper" id="timelineWrapper">
                        <div class="timeline" id="timeline"></div>
                    </div>
                    <div class="daily-summary-panel" id="dailySummaryPanel">
                        <div class="summary-title">
                            📝 每日总结
                            <span class="summary-date" id="summaryDate"></span>
                        </div>
                        <textarea id="dailySummaryText" placeholder="今天做了什么…"></textarea>
                        <button class="summary-save-btn" id="summarySaveBtn">💾 保存总结</button>
                    </div>
                </div>
            </div>

            <!-- ===== 周视图 ===== -->
            <div class="week-view" id="weekView">
                <div class="week-sub-tabs" id="weekSubTabs">
                    <button class="week-sub-tab active" data-sub="calendar">📆 周历</button>
                    <button class="week-sub-tab" data-sub="plan">📋 周计划</button>
                </div>
                <div class="week-sub-content active" id="weekCalendarContent">
                    <div class="week-grid" id="weekGrid"></div>
                </div>
                <div class="week-sub-content" id="weekPlanContent">
                    <div class="week-plan-list" id="weekPlanList"></div>
                    <button class="week-plan-add" id="addWeekPlanBtn">➕ 添加周计划</button>
                </div>
            </div>

            <!-- ===== 月视图 ===== -->
            <div class="month-view" id="monthView">
                <div class="month-sub-tabs" id="monthSubTabs">
                    <button class="month-sub-tab active" data-sub="calendar">📊 月历</button>
                    <button class="month-sub-tab" data-sub="plan">📋 月计划</button>
                </div>
                <div class="month-sub-content active" id="monthCalendarContent">
                    <div class="month-layout">
                        <div class="month-calendar-wrapper">
                            <div class="month-calendar" id="monthCalendar"></div>
                        </div>
                        <div class="month-detail-panel" id="monthDetailPanel">
                            <div class="detail-header">
                                <span class="detail-date" id="detailDate">2024-01-01</span>
                                <button class="close-detail" id="closeDetail">✕</button>
                            </div>
                            <div class="detail-tasks" id="detailTasks"></div>
                        </div>
                    </div>
                </div>
                <div class="month-sub-content" id="monthPlanContent">
                    <div class="month-plan-list" id="monthPlanList"></div>
                    <button class="month-plan-add" id="addMonthPlanBtn">➕ 添加月计划</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== 标签管理模态框 ===== -->
    <div class="modal-overlay" id="tagModal">
        <div class="modal">
            <div class="modal-title">🏷️ 管理标签</div>
            <div class="tag-list" id="tagList"></div>
            <div class="add-tag-row">
                <input id="newTagInput" placeholder="输入新标签名…" />
                <button id="addTagBtn">添加</button>
            </div>
            <button class="modal-close" id="closeTagModal">关闭</button>
        </div>
    </div>

    <!-- ===== 添加周计划模态框 ===== -->
    <div class="modal-overlay" id="weekPlanModal">
        <div class="modal">
            <div class="modal-title">📋 添加周计划</div>
            <div class="form-group">
                <label>星期几</label>
                <select id="weekPlanDay">
                    <option value="1">周一</option>
                    <option value="2">周二</option>

    <!-- ===== 添加月计划模态框 ===== -->
    <div class="modal-overlay" id="monthPlanModal">
        <div class="modal">
            <div class="modal-title">📋 添加月计划</div>
            <div class="form-group">
                <label>计划内容</label>
                <input id="monthPlanText" placeholder="输入计划…" />
            </div>
            <div class="form-group">
                <label>标签</label>
                <select id="monthPlanTag">
                    <option value="">无</option>
                </select>
            </div>
            <div class="form-group">
                <label>优先级</label>
                <select id="monthPlanPriority">
                    <option value="low">🟢 低</option>
                    <option value="medium" selected>🟡 中</option>
                    <option value="high">🟠 高</option>
                    <option value="urgent">🔴 紧急</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="monthPlanModalCancel">取消</button>
                <button class="btn-save" id="monthPlanModalSave">保存</button>
