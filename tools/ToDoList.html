    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  数据层
            // ============================================================
            const STORAGE_KEY = 'todo_list_data_v6';

            let data = {
                tasks: [],
                tags: ['工作', '生活', '个人', '学习'],
                settings: { granularity: 60 },
                dailySummaries: {},
                weekPlans: [],
                monthPlans: [],
            };

            // ============================================================
            //  状态
            // ============================================================
            let currentView = 'day';
            let currentDate = new Date();
            let detailDateStr = null;
            let weekSubView = 'calendar';
            let monthSubView = 'calendar';

            // ============================================================
            //  DOM 引用
            // ============================================================
            const $ = id => document.getElementById(id);
            const viewTabs = $('viewTabs');
            const granularitySelect = $('granularitySelect');
            const granularityWrapper = $('granularityWrapper');
            const dateLabel = $('dateLabel');
            const prevDate = $('prevDate');
            const nextDate = $('nextDate');
            const todayBtn = $('todayBtn');
            const dayView = $('dayView');
            const weekView = $('weekView');
            const monthView = $('monthView');
            const timeline = $('timeline');
            const timelineWrapper = $('timelineWrapper');
            const weekGrid = $('weekGrid');
            const weekPlanList = $('weekPlanList');
            const addWeekPlanBtn = $('addWeekPlanBtn');
            const weekSubTabs = $('weekSubTabs');
            const weekCalendarContent = $('weekCalendarContent');
            const weekPlanContent = $('weekPlanContent');
            const monthCalendar = $('monthCalendar');
            const monthPlanList = $('monthPlanList');
            const addMonthPlanBtn = $('addMonthPlanBtn');
            const monthSubTabs = $('monthSubTabs');
            const monthCalendarContent = $('monthCalendarContent');
            const monthPlanContent = $('monthPlanContent');
            const monthDetailPanel = $('monthDetailPanel');
            const detailDate = $('detailDate');
            const detailTasks = $('detailTasks');
            const closeDetail = $('closeDetail');
            const tagManageBtn = $('tagManageBtn');
            const tagModal = $('tagModal');
            const tagList = $('tagList');
            const newTagInput = $('newTagInput');
            const addTagBtn = $('addTagBtn');
            const closeTagModal = $('closeTagModal');
            const saveBtn = $('saveBtn');
            const loadBtn = $('loadBtn');
            const fileInput = $('fileInput');
            const dailySummaryText = $('dailySummaryText');
            const summaryDate = $('summaryDate');
            const summarySaveBtn = $('summarySaveBtn');
            const clockDate = $('clockDate');
            const clockTime = $('clockTime');
            const dataStatus = $('dataStatus');
            const statusText = $('statusText');
            const statusDot = $('statusDot');
            // 周计划模态框
            const weekPlanModal = $('weekPlanModal');
            const weekPlanDay = $('weekPlanDay');
            const weekPlanText = $('weekPlanText');
            const weekPlanTag = $('weekPlanTag');
            const weekPlanPriority = $('weekPlanPriority');
            const weekPlanModalCancel = $('weekPlanModalCancel');
            const weekPlanModalSave = $('weekPlanModalSave');
            // 月计划模态框
            const monthPlanModal = $('monthPlanModal');
            const monthPlanText = $('monthPlanText');
            const monthPlanTag = $('monthPlanTag');
            const monthPlanPriority = $('monthPlanPriority');
            const monthPlanModalCancel = $('monthPlanModalCancel');
            const monthPlanModalSave = $('monthPlanModalSave');

            // ============================================================
            //  工具函数
            // ============================================================
            function formatDate(d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }

            function parseDate(str) {
                const parts = str.split('-').map(Number);
                return new Date(parts[0], parts[1] - 1, parts[2]);
            }

            function formatTime(h, m) {
                return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            }

            function timeToMinutes(timeStr) {
                const parts = timeStr.split(':').map(Number);
                return parts[0] * 60 + parts[1];
            }

            function minutesToTime(min) {
                const h = Math.floor(min / 60) % 24;
                const m = min % 60;
                return formatTime(h, m);
            }

            function getWeekStart(d) {
                const date = new Date(d);
                const day = date.getDay();
                const diff = date.getDate() - day + (day === 0 ? -6 : 1);
                date.setDate(diff);
                date.setHours(0, 0, 0, 0);
                return date;
            }

            function getWeekEnd(d) {
                const start = getWeekStart(d);
                const end = new Date(start);
                end.setDate(end.getDate() + 6);
                return end;
            }

            function getMonthKey(d) {
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            }

            function isSameDay(d1, d2) {
                return d1.getFullYear() === d2.getFullYear() &&
                    d1.getMonth() === d2.getMonth() &&
                    d1.getDate() === d2.getDate();
            }

            function getTasksForDate(dateStr) {
                return data.tasks.filter(t => t.date === dateStr);
            }

            function getTasksForDateRange(startDate, endDate) {
                const startStr = formatDate(startDate);
                const endStr = formatDate(endDate);
                return data.tasks.filter(t => t.date >= startStr && t.date <= endStr);
            }

            function generateId() {
                return 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            }

            function getCurrentTimeMinutes() {
                const now = new Date();
                return now.getHours() * 60 + now.getMinutes();
            }

            function isTaskPast(task) {
                const taskEnd = timeToMinutes(task.endTime);
                return taskEnd <= getCurrentTimeMinutes();
            }

            function isTaskActive(task) {
                const start = timeToMinutes(task.startTime);
                const end = timeToMinutes(task.endTime);
                const now = getCurrentTimeMinutes();
                return start <= now && now < end;
            }

            // ============================================================
            //  数据持久化
            // ============================================================
            function saveToLocal() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    updateStatus(true);
                } catch (e) {
                    console.warn('保存失败', e);
                    updateStatus(false);
                }
            }

            function loadFromLocal() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        data = parsed;
                        if (!data.settings) data.settings = { granularity: 60 };
                        if (!data.tags) data.tags = [];
                        if (!data.tasks) data.tasks = [];
                        if (!data.dailySummaries) data.dailySummaries = {};
                        if (!data.weekPlans) data.weekPlans = [];
                        if (!data.monthPlans) data.monthPlans = [];
                        if (![15, 30, 60].includes(data.settings.granularity)) {
                            data.settings.granularity = 60;
                        }
                        return true;
                    }
                } catch (e) { /* ignore */ }
                return false;
            }

            function updateStatus(hasData) {
                const hasTasks = data.tasks && data.tasks.length > 0;
                const hasSummary = data.dailySummaries && Object.keys(data.dailySummaries).length > 0;
                const hasPlans = (data.weekPlans && data.weekPlans.length > 0) ||
                    (data.monthPlans && data.monthPlans.length > 0);
                const exists = hasTasks || hasSummary || hasPlans;

                if (exists) {
                    statusText.textContent = '✅ 已自动保存';
                    statusDot.className = 'dot green';
                    dataStatus.className = 'data-status';
                } else {
                    statusText.textContent = '📭 暂无数据';
                    statusDot.className = 'dot gray';
                    dataStatus.className = 'data-status empty';
                }
            }

            // ============================================================
            //  标签管理
            // ============================================================
            function populateTagSelect(selectElement, currentTag) {
                if (!selectElement) return;
                selectElement.innerHTML = '<option value="">无</option>';
                data.tags.forEach(tag => {
                    const opt = document.createElement('option');
                    opt.value = tag;
                    opt.textContent = tag;
                    selectElement.appendChild(opt);
                });
                const addOpt = document.createElement('option');
                addOpt.value = '__add__';
                addOpt.textContent = '➕ ';
                addOpt.className = 'add-tag-option';
                selectElement.appendChild(addOpt);
                if (data.tags.includes(currentTag)) {
                    selectElement.value = currentTag;
                } else {
                    selectElement.value = '';
                }
                selectElement.onchange = function() {
                    if (this.value === '__add__') {
                        this.value = currentTag || '';
                        tagModal.classList.add('active');
                        renderTagManager();
                        newTagInput.focus();
                        return;
                    }
                };
            }

            function renderTagManager() {
                const container = tagList;
                container.innerHTML = '';
                data.tags.forEach((tag, idx) => {
                    const div = document.createElement('div');
                    div.className = 'tag-item';
                    div.innerHTML = `
                        <span>${tag}</span>
                        <button class="tag-del" data-index="${idx}">✕</button>
                    `;
                    container.appendChild(div);
                });
                container.querySelectorAll('.tag-del').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        data.tags.splice(idx, 1);
                        saveToLocal();
                        renderTagManager();
                        refreshAll();
                    });
                });
            }

            // ============================================================
            //  时钟
            // ============================================================
            function updateClock() {
                const now = new Date();
                const dateStr = now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0') + ' ' +
                    ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
                clockDate.textContent = dateStr;
                clockTime.textContent = now.toTimeString().slice(0, 8);
            }

            function startClock() {
                updateClock();
                setInterval(updateClock, 1000);
                setInterval(() => {
                    if (currentView === 'day') renderDayView();
                }, 15 * 60 * 1000);
            }

            // ============================================================
            //  每日总结
            // ============================================================
            function loadDailySummary() {
                const dateStr = formatDate(currentDate);
                summaryDate.textContent = dateStr;
                dailySummaryText.value = data.dailySummaries[dateStr] || '';
            }

            function saveDailySummary() {
                const dateStr = formatDate(currentDate);
                const text = dailySummaryText.value.trim();
                if (text) data.dailySummaries[dateStr] = text;
                else delete data.dailySummaries[dateStr];
                saveToLocal();
                const btn = summarySaveBtn;
                const orig = btn.textContent;
                btn.textContent = '✅ 已保存';
                setTimeout(() => { btn.textContent = orig; }, 1500);
            }

            // ============================================================
            //  周计划 & 月计划
            // ============================================================
            function renderWeekPlans() {
                const weekStart = getWeekStart(currentDate);
                const weekStartStr = formatDate(weekStart);
                const plans = data.weekPlans.filter(p => p.weekStart === weekStartStr);
                weekPlanList.innerHTML = '';
                if (plans.length === 0) {
                    weekPlanList.innerHTML = '<div class="week-plan-empty">暂无周计划</div>';
                    return;
                }
                const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                plans.sort((a, b) => a.dayOfWeek - b.dayOfWeek);
                for (const p of plans) {
                    const div = document.createElement('div');
                    div.className = 'week-plan-item' + (p.completed ? ' completed' : '');
                    const priorityColors = { low: '#2ecc71', medium: '#f1c40f', high: '#e67e22', urgent: '#e74c3c' };
                    const dotColor = priorityColors[p.priority] || '#f1c40f';
                    div.innerHTML = `
                        <span class="plan-check">${p.completed ? '☑' : '☐'}</span>
                        <span class="plan-day">${dayNames[p.dayOfWeek]}</span>
                        <span class="plan-text">${p.text}</span>
                        ${p.tag ? `<span class="plan-tag">${p.tag}</span>` : ''}
                        <span class="plan-priority-dot" style="background:${dotColor};"></span>
                        <button class="plan-del" data-id="${p.id}">✕</button>
                    `;
                    div.querySelector('.plan-check').addEventListener('click', function(e) {
                        e.stopPropagation();
                        p.completed = !p.completed;
                        saveToLocal();
                        renderWeekPlans();
                    });
                    div.querySelector('.plan-del').addEventListener('click', function(e) {
                        e.stopPropagation();
                        data.weekPlans = data.weekPlans.filter(item => item.id !== p.id);
                        saveToLocal();
                        renderWeekPlans();
                    });
                    weekPlanList.appendChild(div);
                }
            }

            function renderMonthPlans() {
                const monthKey = getMonthKey(currentDate);
                const plans = data.monthPlans.filter(p => p.monthKey === monthKey);
                monthPlanList.innerHTML = '';
                if (plans.length === 0) {
                    monthPlanList.innerHTML = '<div class="month-plan-empty">暂无月计划</div>';
                    return;
                }
                const priorityColors = { low: '#2ecc71', medium: '#f1c40f', high: '#e67e22', urgent: '#e74c3c' };
                for (const p of plans) {
                    const div = document.createElement('div');
                    div.className = 'month-plan-item' + (p.completed ? ' completed' : '');
                    const dotColor = priorityColors[p.priority] || '#f1c40f';
                    div.innerHTML = `
                        <span class="plan-check">${p.completed ? '☑' : '☐'}</span>
                        <span class="plan-text">${p.text}</span>
                        ${p.tag ? `<span class="plan-tag">${p.tag}</span>` : ''}
                        <span class="plan-priority-dot" style="background:${dotColor};"></span>
                        <button class="plan-del" data-id="${p.id}">✕</button>
                    `;
                    div.querySelector('.plan-check').addEventListener('click', function(e) {
                        e.stopPropagation();
                        p.completed = !p.completed;
                        saveToLocal();
                        renderMonthPlans();
                    });
                    div.querySelector('.plan-del').addEventListener('click', function(e) {
                        e.stopPropagation();
                        data.monthPlans = data.monthPlans.filter(item => item.id !== p.id);
                        saveToLocal();
                        renderMonthPlans();
                    });
                    monthPlanList.appendChild(div);
                }
            }

            // ============================================================
            //  日视图
            // ============================================================
            function renderDayView() {
                const dateStr = formatDate(currentDate);
                const tasks = getTasksForDate(dateStr);
                const granularity = data.settings.granularity || 60;
                const slotsPerHour = 60 / granularity;
                const totalSlots = 24 * slotsPerHour;
                const nowMinutes = getCurrentTimeMinutes();

                timeline.innerHTML = '';
                const sortedTasks = [...tasks].sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

                for (let slot = 0; slot < totalSlots; slot++) {
                    const hour = Math.floor(slot / slotsPerHour);
                    const minute = (slot % slotsPerHour) * granularity;
                    const slotStart = hour * 60 + minute;
                    const slotEnd = slotStart + granularity;

                    const hourDiv = document.createElement('div');
                    hourDiv.className = 'timeline-hour';
                    hourDiv.dataset.slotStart = slotStart;
                    hourDiv.dataset.slotEnd = slotEnd;

                    const label = document.createElement('div');
                    label.className = 'time-label';
                    label.textContent = formatTime(hour, minute);
                    hourDiv.appendChild(label);

                    const content = document.createElement('div');
                    content.className = 'slot-content';

                    const tasksInSlot = sortedTasks.filter(t => {
                        const tStart = timeToMinutes(t.startTime);
                        return tStart >= slotStart && tStart < slotEnd;
                    });

                    if (tasksInSlot.length === 0) {
                        const emptyDiv = document.createElement('div');
                        emptyDiv.className = 'empty-slot';
                        emptyDiv.textContent = '➕ 点击添加任务';
                        emptyDiv.addEventListener('click', function(e) {
                            e.stopPropagation();
                            openAddTask(slotStart, slotEnd);
                        });
                        content.appendChild(emptyDiv);
                    } else {
                        for (const task of tasksInSlot) {
                            const row = createTaskRow(task);
                            content.appendChild(row);
                        }
                    }

                    hourDiv.appendChild(content);
                    timeline.appendChild(hourDiv);
                }

                // 分隔线
                const allHours = timeline.querySelectorAll('.timeline-hour');
                let targetIndex = 0;
                for (let i = 0; i < allHours.length; i++) {
                    const start = parseInt(allHours[i].dataset.slotStart);
                    if (start <= nowMinutes) targetIndex = i;
                }
                const oldDiv = timeline.querySelector('.timeline-divider');
                if (oldDiv) oldDiv.remove();

                const newDiv = document.createElement('div');
                newDiv.className = 'timeline-divider';
                const dot = document.createElement('span');
                dot.className = 'divider-dot';
                newDiv.appendChild(dot);

                const targetEl = allHours[targetIndex];
                if (targetEl) {
                    const topPos = targetEl.offsetTop + targetEl.offsetHeight / 2 - 1;
                    newDiv.style.top = topPos + 'px';
                    timeline.appendChild(newDiv);
                } else if (allHours.length > 0) {
                    const last = allHours[allHours.length - 1];
                    newDiv.style.top = (last.offsetTop + last.offsetHeight / 2 - 1) + 'px';
                    timeline.appendChild(newDiv);
                }

                // 滚动到 9:00
                const targetSlot = 9 * slotsPerHour;
                if (targetSlot < totalSlots) {
                    const targetElement = timeline.children[targetSlot];
                    if (targetElement) {
                        setTimeout(() => {
                            timelineWrapper.scrollTop = targetElement.offsetTop - 20;
                        }, 30);
                    }
                }

                loadDailySummary();
            }

            // ============================================================
            //  创建任务行（日视图 - 完成状态可编辑）
            // ============================================================
            function createTaskRow(task) {
                const row = document.createElement('div');
                row.className = 'task-row';
                row.dataset.taskId = task.id;

                const isPast = isTaskPast(task) && !task.completed;
                const isActive = isTaskActive(task) && !task.completed;
                const isCompleted = task.completed;

                if (isPast) row.classList.add('past-task');
                if (isActive) row.classList.add('active-task');
                if (isCompleted) row.classList.add('completed-task');

                const priority = task.priority || 'low';
                const priorityColors = { low: '#2ecc71', medium: '#f1c40f', high: '#e67e22', urgent: '#e74c3c' };
                row.style.borderLeftColor = priorityColors[priority] || '#4A90D9';

                // 完成状态勾选框 - 日视图中可编辑
                const check = document.createElement('span');
                check.className = 'task-check';
                check.textContent = isCompleted ? '☑' : '☐';
                check.addEventListener('click', function(e) {
                    e.stopPropagation();
                    task.completed = !task.completed;
                    saveToLocal();
                    renderDayView();
                });
                row.appendChild(check);

                const titleInput = document.createElement('input');
                titleInput.className = 'task-title-input';
                titleInput.type = 'text';
                titleInput.value = task.title;
                titleInput.placeholder = '任务名称…';
                if (isPast) titleInput.disabled = true;
                titleInput.addEventListener('change', function() {
                    const val = this.value.trim();
                    if (val) {
                        task.title = val;
                        saveToLocal();
                    } else {
                        this.value = task.title;
                    }
                });
                titleInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') this.blur();
                });
                row.appendChild(titleInput);

                const tagSelect = document.createElement('select');
                tagSelect.className = 'task-tag-select';
                const currentTag = (task.tags && task.tags.length > 0) ? task.tags[0] : '';
                populateTagSelect(tagSelect, currentTag);
                if (isPast) tagSelect.disabled = true;
                if (data.tags.includes(currentTag)) {
                    tagSelect.value = currentTag;
                    tagSelect.classList.add('has-tag');
                } else {
                    tagSelect.value = '';
                }
                tagSelect.addEventListener('change', function() {
                    const val = this.value;
                    if (val) {
                        task.tags = [val];
                        this.classList.add('has-tag');
                    } else {
                        task.tags = [];
                        this.classList.remove('has-tag');
                    }
                    saveToLocal();
                });
                row.appendChild(tagSelect);

                const prioritySelect = document.createElement('select');
                prioritySelect.className = 'task-priority-select';
                const prioOptions = [
                    { value: 'low', label: '🟢' },
                    { value: 'medium', label: '🟡' },
                    { value: 'high', label: '🟠' },
                    { value: 'urgent', label: '🔴' }
                ];
                prioOptions.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.value;
                    opt.textContent = p.label;
                    prioritySelect.appendChild(opt);
                });
                prioritySelect.value = task.priority || 'low';
                if (isPast) prioritySelect.disabled = true;
                prioritySelect.addEventListener('change', function() {
                    task.priority = this.value;
                    saveToLocal();
                    const colors = { low: '#2ecc71', medium: '#f1c40f', high: '#e67e22', urgent: '#e74c3c' };
                    row.style.borderLeftColor = colors[this.value] || '#4A90D9';
                });
                row.appendChild(prioritySelect);

                const commentInput = document.createElement('input');
                commentInput.className = 'task-comment-input';
                commentInput.type = 'text';
                commentInput.value = task.comment || '';
                commentInput.placeholder = '备注…';
                if (isPast) commentInput.disabled = true;
                commentInput.addEventListener('change', function() {
                    task.comment = this.value.trim();
                    saveToLocal();
                });
                commentInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') this.blur();
                });
                row.appendChild(commentInput);

                const badge = document.createElement('span');
                badge.className = 'task-status-badge';
                if (isCompleted) {
                    badge.classList.add('status-done');
                    badge.textContent = '✅ 已完成';
                } else if (isActive) {
                    badge.classList.add('status-active');
                    badge.textContent = '▶ 进行中';
                } else if (isPast) {
                    badge.classList.add('status-past');
                    badge.textContent = '⏰ 已过期';
                } else {
                    badge.classList.add('status-active');
                    badge.textContent = '⏳ 待办';
                }
                row.appendChild(badge);

                return row;
            }

            // ============================================================
            //  添加任务（日视图点击空槽）
            // ============================================================
            function openAddTask(startMin, endMin) {
                const title = prompt('输入任务名称:');
                if (title === null || title.trim() === '') return;
                const dateStr = formatDate(currentDate);
                const task = {
                    id: generateId(),
                    title: title.trim(),
                    date: dateStr,
                    startTime: minutesToTime(startMin),
                    endTime: minutesToTime(endMin),
                    tags: [],
                    priority: 'low',
                    comment: '',
                    completed: false,
                    createdAt: Date.now()
                };
                data.tasks.push(task);
                saveToLocal();
                renderDayView();
            }

            // ============================================================
            //  周视图（完成状态仅显示，不可编辑）
            // ============================================================
            function renderWeekView() {
                const start = getWeekStart(currentDate);
                const end = getWeekEnd(currentDate);
                const days = [];
                const d = new Date(start);
                for (let i = 0; i < 7; i++) {
                    days.push(new Date(d));
                    d.setDate(d.getDate() + 1);
                }

                const weekTasks = getTasksForDateRange(start, end);
                const today = new Date();
                const dayNames = ['一', '二', '三', '四', '五', '六', '日'];

                weekGrid.innerHTML = '';
                for (let i = 0; i < 7; i++) {
                    const day = days[i];
                    const dateStr = formatDate(day);
                    const dayTasks = weekTasks.filter(t => t.date === dateStr);
                    const isToday = isSameDay(day, today);

                    const col = document.createElement('div');
                    col.className = 'week-day';
                    if (isToday) col.classList.add('today-highlight');

                    const header = document.createElement('div');
                    header.className = 'day-header';
                    const dayNum = day.getDate();
                    const dayName = dayNames[day.getDay() === 0 ? 6 : day.getDay() - 1];
                    header.innerHTML =
                        `<span>${dayName}</span><span class="day-num">${dayNum}</span>`;
                    col.appendChild(header);

                    const tasksContainer = document.createElement('div');
                    tasksContainer.className = 'day-tasks';
                    if (dayTasks.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'empty-tasks';
                        empty.textContent = '—';
                        tasksContainer.appendChild(empty);
                    } else {
                        const sorted = [...dayTasks].sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
                        for (const task of sorted) {
                            const item = document.createElement('div');
                            item.className = 'task-item';
                            if (task.completed) item.classList.add('completed');

                            const check = document.createElement('span');
                            check.className = 'task-check';
                            check.textContent = task.completed ? '☑' : '☐';

                            const dot = document.createElement('span');
                            dot.className = 'priority-dot';
                            const colors = { low: '#2ecc71', medium: '#f1c40f', high: '#e67e22', urgent: '#e74c3c' };
                            dot.style.background = colors[task.priority || 'low'] || '#2ecc71';
                            item.appendChild(dot);

                            const timeSpan = document.createElement('span');
                            timeSpan.className = 'task-time';
                            timeSpan.textContent = task.startTime;
                            item.appendChild(timeSpan);

                            item.appendChild(check);

                            const titleSpan = document.createElement('span');
                            titleSpan.textContent = task.title;
                            item.appendChild(titleSpan);

                            if (task.tags && task.tags.length > 0) {
                                const tagSpan = document.createElement('span');
                                tagSpan.className = 'task-tag';
                                tagSpan.textContent = task.tags[0];
                                item.appendChild(tagSpan);
                            }

                            if (task.comment) {
                                const cmt = document.createElement('span');
                                cmt.textContent = '💬';
                                cmt.style.fontSize = '11px';
                                cmt.style.opacity = '0.6';
                                cmt.style.marginLeft = '4px';
                                item.appendChild(cmt);
                            }

                            tasksContainer.appendChild(item);
                        }
                    }

                    col.appendChild(tasksContainer);
                    weekGrid.appendChild(col);
                }

                renderWeekPlans();
            }

            // ============================================================
            //  月视图
            // ============================================================
            function renderMonthView() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const today = new Date();

                const firstOfMonth = new Date(year, month, 1);
                const lastOfMonth = new Date(year, month + 1, 0);

                let firstDayOfWeek = firstOfMonth.getDay();
                const firstDayOffset = (firstDayOfWeek === 0) ? 6 : firstDayOfWeek - 1;

                const prevMonthLastDate = new Date(year, month, 0);
                const prevMonthYear = prevMonthLastDate.getFullYear();
                const prevMonth = prevMonthLastDate.getMonth();
                const prevMonthDaysCount = prevMonthLastDate.getDate();

                const currentMonthDays = lastOfMonth.getDate();

                const totalCells = Math.ceil((firstDayOffset + currentMonthDays) / 7) * 7;
                const nextMonthDays = totalCells - firstDayOffset - currentMonthDays;

                const allDays = [];

                for (let i = firstDayOffset - 1; i >= 0; i--) {
                    const d = prevMonthDaysCount - i;
                    allDays.push({
                        date: new Date(prevMonthYear, prevMonth, d),
                        isCurrentMonth: false
                    });
                }

                for (let d = 1; d <= currentMonthDays; d++) {
                    allDays.push({
                        date: new Date(year, month, d),
                        isCurrentMonth: true
                    });
                }

                for (let d = 1; d <= nextMonthDays; d++) {
                    allDays.push({
                        date: new Date(year, month + 1, d),
                        isCurrentMonth: false
                    });
                }

                const prevMonthStart = new Date(year, month - 1, 1);
                const nextMonthEnd = new Date(year, month + 2, 0);
                const allMonthTasks = getTasksForDateRange(prevMonthStart, nextMonthEnd);
                const taskMap = {};
                allMonthTasks.forEach(t => {
                    if (!taskMap[t.date]) taskMap[t.date] = [];
                    taskMap[t.date].push(t);
                });

                monthCalendar.innerHTML = '';
                const weekDays = ['一', '二', '三', '四', '五', '六', '日'];
                for (const wd of weekDays) {
                    const head = document.createElement('div');
                    head.className = 'month-header';
                    head.textContent = wd;
                    monthCalendar.appendChild(head);
                }

                for (const dayData of allDays) {
                    const d = dayData.date;
                    const dateStr = formatDate(d);
                    const isToday = isSameDay(d, today);
                    const hasTasks = taskMap[dateStr] && taskMap[dateStr].length > 0;
                    const taskCount = hasTasks ? taskMap[dateStr].length : 0;

                    const cell = document.createElement('div');
                    cell.className = 'month-day';
                    if (isToday) cell.classList.add('today-highlight');
                    if (hasTasks) cell.classList.add('has-tasks');
                    if (!dayData.isCurrentMonth) {
                        cell.style.opacity = '0.55';
                    }

                    const numSpan = document.createElement('span');
                    numSpan.className = 'day-number';
                    if (!dayData.isCurrentMonth) {
                        numSpan.classList.add('other-month');
                    }
                    numSpan.textContent = d.getDate();
                    cell.appendChild(numSpan);

                    if (hasTasks) {
                        const dots = document.createElement('div');
                        dots.className = 'day-dots';
                        const showDots = Math.min(taskCount, 4);
                        const priorityColors = { low: '#2ecc71', medium: '#f1c40f', high: '#e67e22', urgent: '#e74c3c' };
                        for (let i = 0; i < showDots; i++) {
                            const dot = document.createElement('span');
                            dot.className = 'dot';
                            const t = taskMap[dateStr][i] || taskMap[dateStr][0];
                            const p = t.priority || 'low';
                            dot.style.background = priorityColors[p] || '#4A90D9';
                            dots.appendChild(dot);
                        }
                        if (taskCount > 4) {
                            const more = document.createElement('span');
                            more.style.fontSize = '9px';
                            more.style.color = '#6b7c93';
                            more.textContent = `+${taskCount - 4}`;
                            dots.appendChild(more);
                        }
                        cell.appendChild(dots);
                    }

                    cell.addEventListener('click', function() {
                        showMonthDayDetail(dateStr);
                    });

                    monthCalendar.appendChild(cell);
                }

                // 高亮今天并滚动到顶部
                const todayCell = monthCalendar.querySelector('.month-day.today-highlight');
                if (todayCell) {
                    setTimeout(() => {
                        todayCell.scrollIntoView({ block: 'center' });
                    }, 50);
                }

                if (detailDateStr) {
                    showMonthDayDetail(detailDateStr);
                } else {
                    const todayStr = formatDate(today);
                    if (taskMap[todayStr] && taskMap[todayStr].length > 0) {
                        showMonthDayDetail(todayStr);
                    } else {
                        monthDetailPanel.classList.remove('active');
                    }
                }

                renderMonthPlans();
            }

            // ============================================================
            //  月视图详情（完成状态仅显示，不可编辑）
            // ============================================================
            function showMonthDayDetail(dateStr) {
                detailDateStr = dateStr;
                const tasks = getTasksForDate(dateStr);
                detailDate.textContent = dateStr;
                detailTasks.innerHTML = '';
                if (tasks.length === 0) {
                    detailTasks.innerHTML = '<div style="padding:10px 0;color:#8a9fb0;">当天没有任务</div>';
                } else {
                    const sorted = [...tasks].sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
                    for (const task of sorted) {
                        const item = document.createElement('div');
                        item.className = 'task-item';
                        if (task.completed) {
                            item.style.opacity = '0.5';
                            item.style.textDecoration = 'line-through';
                        } else {
                            item.style.textDecoration = 'none';
                        }
                        const priorityColor = { low: '#2ecc71', medium: '#f1c40f', high: '#e67e22', urgent: '#e74c3c' } [
                            task.priority || 'low'
                        ];
                        item.style.borderLeftColor = priorityColor;
                        const checkDisplay = task.completed ? '☑' : '☐';
                        item.innerHTML = `
                            <span style="font-weight:500;">${task.startTime}-${task.endTime}</span>
                            <span>${task.title}</span>
                            ${task.tags && task.tags.length > 0 ? `<span style="background:#e8ecf1;padding:0 8px;border-radius:4px;font-size:12px;margin-left:auto;">${task.tags.join(', ')}</span>` : ''}
                            <span class="task-check-display">${checkDisplay}</span>
                        `;
                        item.addEventListener('click', function(e) {
                            const dateParts = dateStr.split('-').map(Number);
                            currentDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                            switchView('day');
                            monthDetailPanel.classList.remove('active');
                            detailDateStr = null;
                        });
                        detailTasks.appendChild(item);
                    }
                }
                monthDetailPanel.classList.add('active');
            }

            // ============================================================
            //  视图切换与刷新
            // ============================================================
            function refreshAll() {
                const dateStr = formatDate(currentDate);
                if (currentView === 'day') {
                    dateLabel.textContent = dateStr;
                    granularityWrapper.classList.remove('hidden');
                } else if (currentView === 'week') {
                    const start = getWeekStart(currentDate);
                    const end = getWeekEnd(currentDate);
                    dateLabel.textContent = `${formatDate(start)} ~ ${formatDate(end)}`;
                    granularityWrapper.classList.add('hidden');
                } else if (currentView === 'month') {
                    const year = currentDate.getFullYear();
                    const month = currentDate.getMonth() + 1;
                    dateLabel.textContent = `${year} 年 ${month} 月`;
                    granularityWrapper.classList.add('hidden');
                }

                populateTagSelect(weekPlanTag, '');
                populateTagSelect(monthPlanTag, '');

                if (currentView === 'day') {
                    renderDayView();
                } else if (currentView === 'week') {
                    renderWeekView();
                    // 子标签激活状态
                    document.querySelectorAll('.week-sub-tab').forEach(tab => {
                        tab.classList.toggle('active', tab.dataset.sub === weekSubView);
                    });
                    if (weekSubView === 'calendar') {
                        weekCalendarContent.classList.add('active');
                        weekPlanContent.classList.remove('active');
                    } else {
                        weekCalendarContent.classList.remove('active');
                        weekPlanContent.classList.add('active');
                    }
                    weekCalendarContent.style.display = '';
                    weekPlanContent.style.display = '';
                } else if (currentView === 'month') {
                    renderMonthView();
                    document.querySelectorAll('.month-sub-tab').forEach(tab => {
                        tab.classList.toggle('active', tab.dataset.sub === monthSubView);
                    });
                    if (monthSubView === 'calendar') {
                        monthCalendarContent.classList.add('active');
                        monthPlanContent.classList.remove('active');
                    } else {
                        monthCalendarContent.classList.remove('active');
                        monthPlanContent.classList.add('active');
                    }
                    monthCalendarContent.style.display = '';
                    monthPlanContent.style.display = '';
                }

                granularitySelect.value = data.settings.granularity;
                updateStatus(true);

                // 重新绑定子标签事件
                bindSubTabsReliably();

                // ==========================================================
                //  ★★★ 核心修复：每次刷新重新绑定「添加周计划」和「添加月计划」按钮 ★★★
                // ==========================================================
                bindAddPlanButtons();
            }

            // ============================================================
            //  可靠的事件绑定（子标签）
            // ============================================================
            function bindSubTabsReliably() {
                const weekTabs = document.querySelectorAll('#weekSubTabs .week-sub-tab');
                weekTabs.forEach(tab => {
                    tab.removeEventListener('click', weekTabHandler);
                    tab.addEventListener('click', weekTabHandler);
                    tab.onclick = function(e) {
                        weekTabHandler(e);
                    };
                });

                const monthTabs = document.querySelectorAll('#monthSubTabs .month-sub-tab');
                monthTabs.forEach(tab => {
                    tab.removeEventListener('click', monthTabHandler);
                    tab.addEventListener('click', monthTabHandler);
                    tab.onclick = function(e) {
                        monthTabHandler(e);
                    };
                });
            }

            // ============================================================
            //  ★★★ 新增：专门绑定「添加周计划」和「添加月计划」按钮 ★★★
            // ============================================================
            function bindAddPlanButtons() {
                // 周计划添加按钮
                if (addWeekPlanBtn) {
                    // 移除旧监听（防止重复绑定）
                    addWeekPlanBtn.removeEventListener('click', addWeekPlanBtn._boundHandler);
                    // 创建新处理函数并保存引用以便移除
                    const weekHandler = function(e) {
                        e.preventDefault();
                        openWeekPlanModal();
                    };
                    addWeekPlanBtn._boundHandler = weekHandler;
                    addWeekPlanBtn.addEventListener('click', weekHandler);
                    // 同时使用 onclick 作为兜底
                    addWeekPlanBtn.onclick = function(e) {
                        e.preventDefault();
                        openWeekPlanModal();
                    };
                }

                // 月计划添加按钮
                if (addMonthPlanBtn) {
                    addMonthPlanBtn.removeEventListener('click', addMonthPlanBtn._boundHandler);
                    const monthHandler = function(e) {
                        e.preventDefault();
                        openMonthPlanModal();
                    };
                    addMonthPlanBtn._boundHandler = monthHandler;
                    addMonthPlanBtn.addEventListener('click', monthHandler);
                    addMonthPlanBtn.onclick = function(e) {
                        e.preventDefault();
                        openMonthPlanModal();
                    };
                }
            }

            // ============================================================
            //  子标签处理函数
            // ============================================================
            function weekTabHandler(e) {
                const tab = e.currentTarget || e.target;
                const sub = tab.dataset.sub;
                if (sub && sub !== weekSubView) {
                    weekSubView = sub;
                    refreshAll();
                }
            }

            function monthTabHandler(e) {
                const tab = e.currentTarget || e.target;
                const sub = tab.dataset.sub;
                if (sub && sub !== monthSubView) {
                    monthSubView = sub;
                    refreshAll();
                }
            }

            // ============================================================
            //  视图切换
            // ============================================================
            function switchView(view) {
                currentView = view;
                dayView.classList.toggle('active', view === 'day');
                weekView.classList.toggle('active', view === 'week');
                monthView.classList.toggle('active', view === 'month');

                viewTabs.querySelectorAll('.view-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.view === view);
                });

                if (view !== 'month') {
                    monthDetailPanel.classList.remove('active');
                    detailDateStr = null;
                }
                refreshAll();
            }

            function navigateDate(delta) {
                if (currentView === 'day') {
                    currentDate.setDate(currentDate.getDate() + delta);
                } else if (currentView === 'week') {
                    currentDate.setDate(currentDate.getDate() + delta * 7);
                } else if (currentView === 'month') {
                    currentDate.setMonth(currentDate.getMonth() + delta);
                }
                if (currentView === 'month') {
                    detailDateStr = null;
                    monthDetailPanel.classList.remove('active');
                }
                refreshAll();
            }

            function goToday() {
                currentDate = new Date();
                if (currentView === 'month') {
                    detailDateStr = null;
                    monthDetailPanel.classList.remove('active');
                }
                refreshAll();
            }

            // ============================================================
            //  周计划模态框
            // ============================================================
            function openWeekPlanModal() {
                try {
                    populateTagSelect(weekPlanTag, '');
                    weekPlanText.value = '';
                    weekPlanDay.value = 1;
                    weekPlanPriority.value = 'medium';
                    weekPlanModal.classList.add('active');
                } catch (e) {
                    console.warn('打开周计划模态框失败:', e);
                    alert('打开周计划模态框失败，请重试。');
                }
            }

            function closeWeekPlanModal() {
                weekPlanModal.classList.remove('active');
            }

            function saveWeekPlan() {
                const day = parseInt(weekPlanDay.value);
                const text = weekPlanText.value.trim();
                if (!text) { alert('请输入计划内容'); return; }
                const tag = weekPlanTag.value || '';
                const priority = weekPlanPriority.value || 'medium';
                const weekStart = getWeekStart(currentDate);
                data.weekPlans.push({
                    id: generateId(),
                    text: text,
                    dayOfWeek: day,
                    tag: tag,
                    priority: priority,
                    completed: false,
                    weekStart: formatDate(weekStart)
                });
                saveToLocal();
                closeWeekPlanModal();
                refreshAll();
            }

            // ============================================================
            //  月计划模态框
            // ============================================================
            function openMonthPlanModal() {
                try {
                    populateTagSelect(monthPlanTag, '');
                    monthPlanText.value = '';
                    monthPlanPriority.value = 'medium';
                    monthPlanModal.classList.add('active');
                } catch (e) {
                    console.warn('打开月计划模态框失败:', e);
                    alert('打开月计划模态框失败，请重试。');
                }
            }

            function closeMonthPlanModal() {
                monthPlanModal.classList.remove('active');
            }

            function saveMonthPlan() {
                const text = monthPlanText.value.trim();
                if (!text) { alert('请输入计划内容'); return; }
                const tag = monthPlanTag.value || '';
                const priority = monthPlanPriority.value || 'medium';
                const monthKey = getMonthKey(currentDate);
                data.monthPlans.push({
                    id: generateId(),
                    text: text,
                    tag: tag,
                    priority: priority,
                    completed: false,
                    monthKey: monthKey
                });
                saveToLocal();
                closeMonthPlanModal();
                refreshAll();
            }

            // ============================================================
            //  导入导出
            // ============================================================
            function exportData() {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `todo_${formatDate(new Date())}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                const btn = saveBtn;
                const orig = btn.textContent;
                btn.textContent = '✅ 已导出';
                setTimeout(() => { btn.textContent = '📤 导出'; }, 1500);
            }

            function importData(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (imported.tasks && Array.isArray(imported.tasks) &&
                            imported.tags && Array.isArray(imported.tags)) {
                            data = imported;
                            if (!data.settings) data.settings = { granularity: 60 };
                            if (!data.dailySummaries) data.dailySummaries = {};
                            if (!data.weekPlans) data.weekPlans = [];
                            if (!data.monthPlans) data.monthPlans = [];
                            if (![15, 30, 60].includes(data.settings.granularity)) {
                                data.settings.granularity = 60;
                            }
                            saveToLocal();
                            refreshAll();
                            alert('✅ 数据加载成功！');
                        } else {
                            alert('❌ 无效的数据文件格式。');
                        }
                    } catch (err) {
                        alert('❌ 读取文件失败: ' + err.message);
                    }
                };
                reader.readAsText(file);
            }

            // ============================================================
            //  初始化
            // ============================================================
            function init() {
                const hasLocalData = loadFromLocal();

                if (!hasLocalData) {
                    data.tasks = [];
                    data.tags = ['工作', '生活', '个人', '学习'];
                    data.settings = { granularity: 60 };
                    data.dailySummaries = {};
                    data.weekPlans = [];
                    data.monthPlans = [];
                    saveToLocal();
                }

                startClock();

                granularitySelect.value = data.settings.granularity;
                granularitySelect.addEventListener('change', function() {
                    data.settings.granularity = parseInt(this.value);
                    saveToLocal();
                    if (currentView === 'day') renderDayView();
                });

                viewTabs.querySelectorAll('.view-tab').forEach(tab => {
                    tab.addEventListener('click', function() {
                        switchView(this.dataset.view);
                    });
                });

                prevDate.addEventListener('click', () => navigateDate(-1));
                nextDate.addEventListener('click', () => navigateDate(1));
                todayBtn.addEventListener('click', goToday);

                // 标签管理（tagManageBtn 在 HTML 中未定义，但保留以防后续添加）
                if (tagManageBtn) {
                    tagManageBtn.addEventListener('click', function() {
                        renderTagManager();
                        tagModal.classList.add('active');
                    });
                }
                if (closeTagModal) {
                    closeTagModal.addEventListener('click', () => tagModal.classList.remove('active'));
                }
                if (tagModal) {
                    tagModal.addEventListener('click', function(e) {
                        if (e.target === this) tagModal.classList.remove('active');
                    });
                }
                if (addTagBtn) {
                    addTagBtn.addEventListener('click', function() {
                        const name = newTagInput.value.trim();
                        if (!name) return;
                        if (data.tags.includes(name)) { alert('标签已存在'); return; }
                        data.tags.push(name);
                        saveToLocal();
                        newTagInput.value = '';
                        renderTagManager();
                        refreshAll();
                    });
                }
                if (newTagInput) {
                    newTagInput.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' && addTagBtn) addTagBtn.click();
                    });
                }

                saveBtn.addEventListener('click', exportData);
                loadBtn.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', function(e) {
                    if (this.files && this.files[0]) {
                        importData(this.files[0]);
                    }
                    this.value = '';
                });

                summarySaveBtn.addEventListener('click', saveDailySummary);
                dailySummaryText.addEventListener('blur', saveDailySummary);

                // 周计划模态框按钮事件（只绑定一次，刷新时由 bindAddPlanButtons 重新绑定）
                weekPlanModalCancel.addEventListener('click', closeWeekPlanModal);
                weekPlanModalSave.addEventListener('click', saveWeekPlan);
                weekPlanModal.addEventListener('click', function(e) {
                    if (e.target === this) closeWeekPlanModal();
                });

                // 月计划模态框按钮事件
                monthPlanModalCancel.addEventListener('click', closeMonthPlanModal);
                monthPlanModalSave.addEventListener('click', saveMonthPlan);
                monthPlanModal.addEventListener('click', function(e) {
                    if (e.target === this) closeMonthPlanModal();
                });

                // 子标签绑定
                bindSubTabsReliably();

                // ★★★ 初始化时绑定添加按钮 ★★★
                bindAddPlanButtons();

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        if (tagModal && tagModal.classList.contains('active')) tagModal.classList.remove(
                        'active');
                        if (weekPlanModal.classList.contains('active')) closeWeekPlanModal();
                        if (monthPlanModal.classList.contains('active')) closeMonthPlanModal();
                        if (monthDetailPanel.classList.contains('active')) {
                            monthDetailPanel.classList.remove('active');
                            detailDateStr = null;
                        }
                    }
                    if (e.ctrlKey && e.key === 's') {
                        e.preventDefault();
                        exportData();
                    }
                });

                closeDetail.addEventListener('click', function() {
                    monthDetailPanel.classList.remove('active');
                    detailDateStr = null;
                });

                switchView('day');
                console.log('📋 ToDoList 已启动 (添加计划按钮已修复)');
                console.log('💡 快捷键: Ctrl+S 导出备份, ESC 关闭弹窗');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
